name: IMF erisim testi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/imf_testi.py 2>&1 | tee imf.log
      - run: |
          git config user.name "gbri-bot"
          git config user.email "gbri-bot@users.noreply.github.com"
          git add reports/
          git commit -m "IMF erisim testi raporu" || echo none
          git pull --rebase && git push
