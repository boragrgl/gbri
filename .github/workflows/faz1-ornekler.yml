name: Faz 1 - Kaynak ornekleri

on:
  push:
    branches: [faz1-toplama]
    paths: ["config/ornek-adresler.txt", "scripts/ornek_topla.py"]

permissions:
  contents: write

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ornek_topla.py config/ornek-adresler.txt ornekler
      - run: |
          git config user.name "gbri-bot"
          git config user.email "gbri-bot@users.noreply.github.com"
          git add ornekler/
          git commit -m "Faz 1 kaynak ornekleri" || echo "Degisiklik yok"
          git pull --rebase && git push
