name: Haftalik tarama (sali 07:00 / cuma 16:00 TR)

# NOT: GitHub zamanlanmis calistirmalari yalnizca varsayilan dalda (main) tetikler.
# Bu dosya main'e tasinana kadar zamanlama pasif kalir; elle calistirilabilir (workflow_dispatch).
on:
  schedule:
    - cron: "0 4 * * 2"    # Sali 07:00 Turkiye (UTC+3)
    - cron: "0 13 * * 5"   # Cuma 16:00 Turkiye (UTC+3)
  workflow_dispatch:
    inputs:
      topla_args:
        description: "topla.py argumanlari"
        default: "--geri-gun 7"
      analiz_args:
        description: "analiz.py argumanlari"
        default: "--geri-gun 7"

permissions:
  contents: write

concurrency:
  group: gbri-veri
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: |
          pip install pypdf jsonschema
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur
      - name: Topla
        env:
          TOPLA_ARGS: ${{ github.event.inputs.topla_args }}
        run: python pipeline/topla.py ${TOPLA_ARGS:---geri-gun 7} 2>&1 | tee topla.log
      - name: Analiz
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANALIZ_ARGS: ${{ github.event.inputs.analiz_args }}
        run: python pipeline/analiz.py ${ANALIZ_ARGS:---geri-gun 7} 2>&1 | tee analiz.log
      - name: Site verisi
        run: python pipeline/site_verisi.py
      - name: Ozet
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "bulunan=|TOPLAM|OZET|HATA|KOTA" topla.log analiz.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Veriyi kaydet
        if: always()
        run: |
          git config user.name "gbri-bot"
          git config user.email "gbri-bot@users.noreply.github.com"
          git add data/ site/public/data/
          git commit -m "Tarama: $(date -u +%F)" || echo "Degisiklik yok"
          git pull --rebase && git push
