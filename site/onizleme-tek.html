Cre\xE7ler kolayla\u015Fabilir.","Stablecoin ihra\xE7\xE7\u0131lar\u0131 ile bankalar aras\u0131ndaki likidite ve rezerv ili\u015Fkileri, gelecekte daha s\u0131k\u0131 denetimlere tabi olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Tokenize mevduatlar\u0131n tan\u0131mlanmas\u0131 i\xE7in CRD/CRR kapsam\u0131nda uyum \xE7al\u0131\u015Fmalar\u0131 gerekebilir.","Kripto varl\u0131k bor\xE7 verme faaliyetlerinin d\xFCzenlenmesi, bankalar\u0131n bu alandaki risk y\xF6netimi politikalar\u0131n\u0131 g\xFCncellemelerini gerektirebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Raporlama \xE7er\xE7evesinin geni\u015Fletilmesi, bankalar\u0131n kripto varl\u0131k hizmet sa\u011Flay\u0131c\u0131lar\u0131 ile olan veri ak\u0131\u015Flar\u0131n\u0131 yeniden yap\u0131land\u0131rmas\u0131n\u0131 gerektirebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Risk bazl\u0131 sermaye hesaplamalar\u0131nda kripto varl\u0131k maruziyetleri i\xE7in yeni a\u011F\u0131rl\u0131kland\u0131rmalar g\xFCndeme gelebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Tokenize finansal ara\xE7lar",onceki:"MiCA kapsam\u0131 belirsizli\u011Fi",yeni:"MiFID/MiFIR kapsam\u0131nda kalmas\u0131 \xF6nerisi",referans:"Sayfa 5"}],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Kripto varl\u0131k bor\xE7 verme faaliyetlerinin d\xFCzenlenmesi, kredi riski modellerinde yeni parametrelerin tan\u0131mlanmas\u0131n\u0131 gerektirebilir."},LGD:{duzey:"Dolayl\u0131",not:"Tokenize varl\u0131klar\u0131n teminat olarak kabul edilebilirli\u011Fi netle\u015Fti\u011Finde LGD hesaplamalar\u0131 etkilenebilir."},EAD:{duzey:"Dolayl\u0131",not:"Tokenize mevduatlar\u0131n bilan\xE7o i\xE7i/d\u0131\u015F\u0131 s\u0131n\u0131fland\u0131rmas\u0131 EAD hesaplamalar\u0131n\u0131 etkileyebilir."},ECL:{duzey:"Dolayl\u0131",not:"TFRS 9 kapsam\u0131nda tokenize varl\u0131klar\u0131n de\u011Ferlemesi ve kredi riski kar\u015F\u0131l\ ,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"6c58503c3b63d36c"}],alt_konular:["Siber riskler","\xDC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131","\xD6zel kredi (Private credit)","Yapay zeka"],etkilenen_alanlar:["Operasyonel risk","Kredi riski","Bilgi teknolojileri","Risk y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Avrupa Denetim Otoriteleri (ESAs), 2026 sonbahar risk g\xFCncellemesinde AB finansal sistemi i\xE7in d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, siber tehditler ve \xF6zel kredi piyasalar\u0131ndaki b\xFCy\xFCmenin temel k\u0131r\u0131lganl\u0131klar oldu\u011Funu belirtmi\u015Ftir. Bankalar\u0131n, \xF6zellikle AB d\u0131\u015F\u0131 ICT hizmet sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131klar\u0131n\u0131 ve yapay zeka destekli siber sald\u0131r\u0131 risklerini y\xF6netmeleri beklenmektedir. Ayr\u0131ca, \xF6zel kredi piyasalar\u0131ndaki \u015Feffafl\u0131k eksikli\u011Fi ve bankalarla olan ba\u011Flant\u0131lar, kredi riski y\xF6netimi a\xE7\u0131s\u0131ndan yak\u0131ndan izlenmelidir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n ICT hizmet sa\u011Flay\u0131c\u0131lar\u0131na y\xF6nelik denetim ve risk y\xF6netimi s\xFCre\xE7lerinin s\u0131k\u0131la\u015Ft\u0131r\u0131lmas\u0131 gerekebilir.","\xD6zel kredi piyasalar\u0131na olan dolayl\u0131 maruziyetlerin (ortak bor\xE7lular vb.) daha detayl\u0131 raporlanmas\u0131 gerekebilir.","Yapay zeka ve kuantum bili\u015Fim risklerine kar\u015F\u0131 siber g\xFCvenlik stratejilerinin g\xFCncellenmesi gerekebilir.","ESAs, denet\xE7ileri ve piyasa kat\u0131l\u0131mc\u0131lar\u0131n\u0131 haz\u0131rl\u0131klar\u0131n\u0131 g\xFC\xE7lendirmeye ve d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, \xF6zel kredi ve geli\u015Fmekte olan teknolojilerden kaynaklanan riskleri yak\u0131ndan izlemeye \xE7a\u011F\u0131rmaktad\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["DORA uyum s\xFCre\xE7lerinde AB d\u0131\u015F\u0131 ICT sa\u011Flay\u0131c\u0131lar\u0131na y\xF6nelik risk de\u011Ferlendirmelerinin derinle\u015Ftirilmesi gerekebilir.","Kuantum bili\u015Fim tehditlerine kar\u015F\u0131 kriptografik sistemlerin g\xF6zden ge\xE7irilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Operasyonel risk y\xF6netimi \xE7er\xE7evesinde, yapay zeka destekli siber sald\u0131r\u0131lara kar\u015F\u0131 senaryo analizlerinin (stress testing) g\xFCncellenmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk sermaye gereksinimlerinde, siber risklerin artmas\u0131 nedeniyle modelleme varsay\u0131mlar\u0131n\u0131n g\xFCncellenmesi gerekebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"\xD6zel kredi piyasalar\u0131ndaki stresin, ortak bor\xE7lular \xFCzerinden banka portf\xF6y\xFCne yans\u0131mas\u0131 durumunda PD \xFCzerinde bask\u0131 olu\u015Fabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Varl\u0131k kalitesindeki olas\u0131 bozulmalar, TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 kar\u015F\u0131l\u0131klar\u0131n\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-23",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"\xDC\xE7\xFCnc\xFC Taraf Ba\u011F\u0131ml\u0131l\u0131klar\u0131",aciklama:"AB d\u0131\u015F\u0131 ICT ve \xF6deme sistemi sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131\u011F\u0131n operasyonel risk \xFCzerindeki etkisinin de\u011Ferlendirilmesi."},{baslik:"\xD6zel Kredi Maruziyetleri",aciklama:"\xD6zel kredi ara\xE7lar\u0131na veya bu ara\xE7lar\u0131 kullanan bor\xE7lulara olan do\u011Frudan/dolayl\u0131 maruziyetlerin izlenmesi."}],referanslar:[{metin:"Risks from external dependencies in the financial sector",sayfa:4,paragraf:null},{metin:"Risks from private credit",sayfa:6,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:01:09+03:00",gonderilen_karakter:37202,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"bcbs-2026-09-23-a89cce",kurum:"bcbs",baslik_orijinal:"Basel III risk-based capital and leverage ratios are stable while liquidity indicators show limited movements for large internationally active banks, latest Basel III monitoring exercise shows",baslik_tr:"Basel III risk bazl\u0131 sermaye ve kald\u0131ra\xE7 oranlar\u0131 istikrarl\u0131 seyrederken, likidite g\xF6stergeleri b\xFCy\xFCk uluslararas\u0131 aktif bankalar i\xE7in s\u0131n\u0131rl\u0131 hareketler g\xF6steriyor, en son Basel III izleme \xE7al\u0131\u015Fmas\u0131 bunu ortaya koyuyor",url:"https://www.bis.org/media-releases/20260923-basel-iii-risk-based-capital-and-leverage-ratios-are-stable-while-liquidity-indicators-show",belge_turu:"Rapor",statu:"Nihai",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Bu rapor, b\xFCy\xFCk ve uluslararas\u0131 faaliyet g\xF6steren bankalar i\xE7in Basel III izleme sonu\xE7lar\u0131n\u0131 i\xE7eren bilgilendirici bir yay\u0131nd\u0131r. Kamu sermayeli ve standart yakla\u015F\u0131m uygulayan bankam\u0131z i\xE7in do\u011Frudan bir d\xFCzenleyici de\u011Fi\u015Fiklik veya uyum zorunlulu\u011Fu i\xE7ermemektedir.",konu:"Basel",ozet_tek_satir:"BCBS taraf\u0131ndan yay\u0131nlanan bu rapor, 2025 sonu itibar\u0131yla b\xFCy\xFCk uluslararas\u0131 bankalar\u0131n Basel III sermaye ve likidite rasyolar\u0131ndaki de\u011Fi\u015Fimleri ve Basel III \xE7er\xE7evesinin asgari sermaye gereksinimleri \xFCzerindeki etkilerini analiz etmektedir.",yayin_tarihi:"2026-09-23",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"089f409dab1abe01"}],alt_konular:["Basel III \u0130zleme","Likidite Rasyolar\u0131","Sermaye Yeterlili\u011Fi"],etkilenen_alanlar:["Risk Y\xF6netimi","Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"BCBS taraf\u0131ndan yay\u0131mlanan Basel III izleme raporu, 2025 sonu itibar\u0131yla b\xFCy\xFCk uluslararas\u0131 bankalar\u0131n sermaye ve likidite rasyolar\u0131n\u0131n genel olarak istikrarl\u0131 seyretti\u011Fini g\xF6stermektedir. LCR rasyolar\u0131nda hafif bir art\u0131\u015F, NSFR rasyolar\u0131nda ise s\u0131n\u0131rl\u0131 bir d\xFC\u015F\xFC\u015F g\xF6zlemlenmi\u015Ftir. Rapor, Basel III standartlar\u0131n\u0131n tam uygulanmas\u0131 durumunda Tier 1 sermaye gereksinimleri \xFCzerindeki etkinin %2,2 seviyesinde oldu\u011Funu ortaya koymaktad\u0131r.",amac:{teyitli:[{hukum:"Basel III standartlar\u0131n\u0131n bankalar \xFCzerindeki etkilerinin d\xFCzenli olarak g\xF6zden ge\xE7irilmesi.",alinti:"Through a rigorous reporting process, the Basel Committee regularly reviews the implications of the Basel III standards for banks",sayfa:null,paragraf:19,alinti_dogrulandi:!0}],olasi_etki:["K\xFCresel bankac\u0131l\u0131k sekt\xF6r\xFCndeki sermaye ve likidite e\u011Filimlerinin izlenmesi yoluyla bankam\u0131z\u0131n risk i\u015Ftah\u0131 ve stratejik planlamas\u0131 i\xE7in k\u0131yaslama verisi sa\u011Flayabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Uluslararas\u0131 piyasalardaki likidite standartlar\u0131n\u0131n geli\u015Fimi, bankam\u0131z\u0131n likidite y\xF6netimi politikalar\u0131 i\xE7in dolayl\u0131 bir referans noktas\u0131 olu\u015Fturabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Basel III izleme metodolojisinin incelenmesi, bankam\u0131z\u0131n i\xE7sel raporlama s\xFCre\xE7lerinin uluslararas\u0131 standartlarla uyumunun de\u011Ferlendirilmesine katk\u0131 sa\u011Flayabilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Basel III tam ge\xE7i\u015F etkisinin %2,2 olarak raporlanmas\u0131, k\xFCresel sermaye yeterlili\u011Fi standartlar\u0131n\u0131n s\u0131k\u0131la\u015Fma e\u011Filimini g\xF6stermektedir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},EAD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},ECL:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-23",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Basel III \u0130zleme Metodolojisi",aciklama:"Uluslararas\u0131 bankalar\u0131n raporlama standartlar\u0131n\u0131 anlamak ad\u0131na Basel III izleme metodolojisi notu incelenebilir."}],referanslar:[{metin:"Basel III monitoring exercise",sayfa:1,paragraf:11}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:01:27+03:00",gonderilen_karakter:4477,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"bcbs-2026-09-23-9e9e8c",kurum:"bcbs",baslik_orijinal:"Basel III monitoring report",baslik_tr:"Basel III \u0130zleme Raporu",url:"https://www.bis.org/publications/202609-qis-basel-iii-monitoring-report",belge_turu:"Rapor",statu:"Y\xFCr\xFCrl\xFCkte",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Bu belge, Basel Komitesi taraf\u0131ndan yay\u0131mlanan bir izleme raporu olup, banka i\xE7in do\u011Frudan bir yasal y\xFCk\xFCml\xFCl\xFCk getirmemekte, k\xFCresel bankac\u0131l\u0131k sekt\xF6r\xFCne ili\u015Fkin istatistiksel veriler ve Basel III standartlar\u0131n\u0131n genel etkilerini sunmaktad\u0131r.",konu:"Basel",ozet_tek_satir:"Basel Komitesi taraf\u0131ndan haz\u0131rlanan bu rapor, Basel III reformlar\u0131n\u0131n bankalar\u0131n sermaye yeterlilik oranlar\u0131, kald\u0131ra\xE7 ora ending-technical-standards-prior-permission",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Banka standart yakla\u015F\u0131m kulland\u0131\u011F\u0131 ve \u0130RD s\xFCre\xE7lerine tabi olmad\u0131\u011F\u0131 i\xE7in, \xF6zkaynak azalt\u0131m\u0131 \xF6n izni ile ilgili bu teknik standart de\u011Fi\u015Fikli\u011Finin reddi bankan\u0131n sermaye hesaplama y\xF6ntemlerini do\u011Frudan etkilememektedir.",konu:"Basel",ozet_tek_satir:"Avrupa Komisyonu, EBA taraf\u0131ndan sunulan ve \xF6zkaynak azalt\u0131m\u0131 i\xE7in \xF6n izin ba\u015Fvuru s\xFCresini k\u0131saltmay\u0131 hedefleyen teknik standart de\u011Fi\u015Fikli\u011Fi tasla\u011F\u0131n\u0131, daha kapsaml\u0131 bir reform ihtiyac\u0131 gerek\xE7esiyle reddetmi\u015Ftir.",yayin_tarihi:"2026-09-09",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"17f00995ae1417c7"}],alt_konular:["\xD6zkaynak azalt\u0131m\u0131","\xD6n izin s\xFCre\xE7leri"],etkilenen_alanlar:["Sermaye y\xF6netimi","Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Avrupa Komisyonu, EBA taraf\u0131ndan sunulan ve \xF6zkaynak azalt\u0131m\u0131 \xF6n izin ba\u015Fvuru s\xFCresini d\xF6rt aydan \xFC\xE7 aya indirmeyi hedefleyen teknik standart de\u011Fi\u015Fikli\u011Fini reddetmi\u015Ftir. Komisyon, bu de\u011Fi\u015Fikli\u011Fin kapsam\u0131n\u0131n \xE7ok dar oldu\u011Funu ve daha geni\u015F kapsaml\u0131 bir reformun par\xE7as\u0131 olmas\u0131 gerekti\u011Fini belirtmi\u015Ftir. EBA, \xF6n izin rejimine ili\u015Fkin daha kapsaml\u0131 bir g\xF6zden ge\xE7irme s\xFCrecine devam edece\u011Fini a\xE7\u0131klam\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n mevcut operasyonel s\xFCre\xE7lerinde acil bir de\u011Fi\u015Fiklik gerektiren bir durum bulunmamaktad\u0131r.",amac:{teyitli:[{hukum:"EBA, \xF6zkaynak azalt\u0131m\u0131 \xF6n izin ba\u0 31n nakit ak\u0131\u015F bilgilerini sunma y\xFCk\xFCml\xFCl\xFCklerine ili\u015Fkin olas\u0131 muafiyetleri de\u011Ferlendirmek amac\u0131yla yat\u0131r\u0131mc\u0131lar\u0131n g\xF6r\xFC\u015Flerini alan bir anket ba\u015Flatm\u0131\u015Ft\u0131r. Bu \xE7al\u0131\u015Fma, IAS 7 kapsam\u0131nda finansal kurulu\u015Flar i\xE7in nakit ak\u0131\u015F tablosu sunumunda de\u011Fi\u015Fiklik yap\u0131l\u0131p yap\u0131lmayaca\u011F\u0131n\u0131 belirlemeyi hedeflemektedir. Bankam\u0131z i\xE7in do\u011Frudan bir zorunluluk do\u011Furmamakla birlikte, gelecekteki raporlama standartlar\u0131n\u0131 etkileyebilecek bir ara\u015Ft\u0131rma s\xFCrecidir.",amac:{teyitli:[{hukum:"Anket, finansal kurulu\u015Flar\u0131n nakit ak\u0131\u015F tablosu sunumundan muaf tutulmas\u0131 olas\u0131l\u0131\u011F\u0131n\u0131 ara\u015Ft\u0131rmaktad\u0131r.",alinti:"It will also inform the IASB\u2019s research on possible exemptions for financial institutions from presenting cash flow information in their financial statements.",sayfa:null,paragraf:17,alinti_dogrulandi:!0}],olasi_etki:["Gelecekte finansal kurulu\u015Flar i\xE7in nakit ak\u0131\u015F tablosu sunumunda muafiyetler veya farkl\u0131 raporlama gereksinimleri getirilebilir.","IASB, finansal kurulu\u015Flar\u0131n nakit ak\u0131\u015F bilgilerini nas\u0131l kulland\u0131klar\u0131n\u0131 anlamak i\xE7in bir anket ba\u015Flatm\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["IAS 7 standard\u0131nda yap\u0131lacak olas\u0131 de\u011Fi\u015Fiklikler, bankan\u0131n finansal raporlama s\xFCre\xE7lerini ve nakit ak\u0131\u015F tablosu haz\u0131rlama y\xF6ntemlerini etkileyebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yat\u0131r\u0131mc\u0131 ili\u015Fkileri biriminin, IASB'nin bu projesini takip etmesi ve olas\u0131 standart de\u011Fi\u015Fikliklerine haz\u0131rl\u0131k yapmas\u0131 \xF6nerilebili :55+03:00",gonderilen_karakter:4295,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"eba-2026-10-29-d06975",kurum:"eba",baslik_orijinal:"The EBA advises on targeted simplifications to Taxonomy disclosures",baslik_tr:"EBA, Taksonomi a\xE7\u0131klamalar\u0131nda hedeflenen basitle\u015Ftirmeler konusunda tavsiyelerde bulunuyor",url:"https://www.eba.europa.eu/publications-and-media/press-releases/eba-advises-targeted-simplifications-taxonomy-disclosures",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"Orta",onem_gerekcesi:"D\xFCzenleme, bankalar\u0131n TFRS 9 ve s\xFCrd\xFCr\xFClebilirlik raporlamas\u0131 kapsam\u0131ndaki KPI hesaplamalar\u0131n\u0131 basitle\u015Ftirmeyi hedefleyen teknik bir tavsiye s\xFCrecidir. Kamu bankas\u0131 i\xE7in raporlama y\xFCk\xFCn\xFC azaltma potansiyeli ta\u015F\u0131maktad\u0131r.",konu:"S\xFCrd\xFCr\xFClebilirlik",ozet_tek_satir:"EBA, kredi kurulu\u015Flar\u0131n\u0131n Taksonomi raporlama y\xFCk\xFCml\xFCl\xFCklerini azaltmak, karma\u015F\u0131kl\u0131\u011F\u0131 gidermek ve veri kullan\u0131labilirli\u011Fini art\u0131rmak amac\u0131yla Avrupa Komisyonu'na teknik tavsiyelerini sunmu\u015Ftur.",yayin_tarihi:"2026-10-29",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"ca0814f9008a7254"}],alt_konular:["Taksonomi Raporlamas\u0131","KPI Basitle\u015Ftirme"],etkilenen_alanlar:["Raporlama","S\xFCrd\xFCr\xFClebilirlik"],gorus_son_tarihi:"2026-10-29",yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, Avrupa Komisyonu'nun talebi \xFCzerine Taksonomi T\xFCz\xFC\u011F\xFC kapsam\u0131ndaki KPI raporlama gerekliliklerini basitle\u015Ftirmeye y\xF6nelik teknik tavsiyelerini yay\u0131mlam\u0131\u015Ft\u0131r. Bankalar i\xE7in 'Komisyon ve \xDCcretler' ile 'Al\u0131m-Sat\u0131m Defteri' KPI'lar\u0131n\u0131n kapsam\u0131n\u0131n daralt\u0131lmas\u0131 ve raporlama \u015Fablonlar\u0131n ilirli\u011Fi (explainability) i\xE7in teknik altyap\u0131 g\xFCncellemeleri gerekebilir.","Veri kalitesini art\u0131rmak amac\u0131yla manuel s\xFCre\xE7lerin otomasyona ge\xE7irilmesi i\xE7in suptech \xE7\xF6z\xFCmleri de\u011Ferlendirilebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yapay zeka modellerinin do\u011Frulanmas\u0131 ve \u015F\xFCpheli i\u015Flem bildirimlerinin (STR) nihai karar\u0131 i\xE7in uzman personel ihtiyac\u0131 artabilir.","AML/CFT anketleri ve veri toplama s\xFCre\xE7lerinde daha fazla veri noktas\u0131n\u0131n i\u015Flenmesi operasyonel y\xFCk olu\u015Fturabilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk sermaye y\xFCk\xFCml\xFCl\xFCkleri, AML/CFT s\xFCre\xE7lerindeki iyile\u015Ftirmelerle daha etkin y\xF6netilebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"AML/CFT risk de\u011Ferlendirmeleri, m\xFC\u015Fteri risk profillerini etkileyerek dolayl\u0131 yoldan kredi riski de\u011Ferlendirmelerine yans\u0131yabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"AML/CFT kaynakl\u0131 uyum riskleri, bankan\u0131n itibar ve operasyonel riskleri \xFCzerinden TFRS 9 kar\u015F\u0131l\u0131k hesaplamalar\u0131n\u0131 dolayl\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-10-19",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Yapay Zeka Y\xF6neti\u015Fimi",aciklama:"\u0130\u015Flem izleme sistemlerinde kullan\u0131lan yapay zeka modellerinin a\xE7\u0131klanabilirli\u011Fi ve insan g\xF6zetimi s\xFCre\xE7lerinin g\xF6zden ge\xE7irilmesi."},{baslik:"Veri Kalitesi ve Otomasyon",aciklama:"AML/CFT veri toplama s\xFCre\xE7lerinde manuel y\xF6ntemlerin azalt\u0131lmas\u0131 ve veri kalitesinin art\u0131r\u0131lmas\u0131 i\xE7in suptech ara\xE7lar\u0131n\u0131n de\u011Ferlendirilmesi."}],referanslar:[{metin:"Enhancing AML/CFT Risk Assessments: key findings from a supervisory stoc  uygulamalar\u0131n\u0131 engellemek amac\u0131yla raporlama standartlar\u0131n\u0131 g\xFCncelledi. G-SIB g\xF6stergelerinin y\u0131l sonu de\u011Ferleri yerine y\u0131ll\u0131k ortalamalar \xFCzerinden raporlanmas\u0131 zorunlu hale getirildi. Ayr\u0131ca, G-SIB raporlama e\u015Fi\u011Fi 200 milyar Euro'dan 350 milyar Euro'ya y\xFCkseltildi. Bu de\u011Fi\u015Fiklikler, sistemik \xF6neme sahip bankalar\u0131n risk profillerini oldu\u011Fundan d\xFC\u015F\xFCk g\xF6sterme \xE7abalar\u0131n\u0131 s\u0131n\u0131rlamay\u0131 hedeflemektedir.",amac:{teyitli:[{hukum:"G-SIB g\xF6stergelerinin y\u0131l sonu de\u011Ferleri yerine y\u0131ll\u0131k ortalamalar \xFCzerinden raporlanmas\u0131 zorunlulu\u011Fu getirilmi\u015Ftir.",alinti:"report and disclose all stock G-SIB indicators based on an average of values over the reporting year, rather than year-end values",sayfa:null,paragraf:13,alinti_dogrulandi:!0}],olasi_etki:["D\xFCzenlemenin G-SIB stat\xFCs\xFCnde olmayan bankalar i\xE7in do\u011Frudan bir uyum y\xFCk\xFCml\xFCl\xFC\u011F\xFC olu\u015Fturmas\u0131 beklenmemektedir.","K\xFCresel piyasalarda faaliyet g\xF6steren bankalar i\xE7in raporlama altyap\u0131s\u0131n\u0131n y\u0131ll\u0131k ortalama verileri i\xE7erecek \u015Fekilde g\xFCncellenmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:[]},operasyonel_etki:{teyitli:[],olasi_etki:[]},sermaye_rwa:{teyitli:[],olasi_etki:[]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"G-SIB Raporlama E\u015Fi\u011Fi",onceki:"200 milyar Euro",yeni:"350 milyar Euro",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"\u0130lgili de\u011Fil",not:"Banka G-SIB kapsam\u0131nda de\u011Fildir."},LGD:{duzey:"\u0130lgili de\u011Fil",not:"Banka G-SIB kapsam\u0131nda de\u011Fildir."},EAD:{duzey:"\u0130lgili de\u011Fil",not:"Banka G-SIB kapsam\u0131nda de\u011Fildir."},ECL:{duzey:"\u0130lgili de\u011Fil",not:"Banka G-SIB kapsam\u0131nda de\u011Fildir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2030-01-01",referans:"Sayfa 1"},{tur:"G\xF6r\xFC\u015F son tarihi",tarih:"2027-01-14",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"G-SIB Kapsam\u0131",aciklama:"Bankan\u0131n sistemik \xF6nemlilik skorlar\u0131 ve raporlama y\xFCk\xFCml\xFCl\xFCkleri a\xE7\u0131s\u0131ndan g\xFCncel Basel standartlar\u0131 ile uyumu periyodik olarak kontrol edilmelidir."}],referanslar:[{metin:"Basel Committee finalises measures to address window-dressing in the G-SIB framework",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:49:42+03:00",gonderilen_karakter:2396,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"bcbs-2026-10-16-5d007c",kurum:"bcbs",baslik_orijinal:"Amendments to G-SIB framework to address window dressing",baslik_tr:"G-SIB \xC7er\xE7evesinde Pencere S\xFCsleme Uygulamalar\u0131n\u0131 \xD6nlemeye Y\xF6nelik De\u011Fi\u015Fiklikler",url:"https://www.bis.org/publications/202610-standards-amendments-g-sib-framework-address-window-dressing",belge_turu:"Standart",statu:"Nihai",onem:"Orta",onem_gerekcesi:"D\xFCzenleme k\xFCresel sistemik \xF6neme sahip bankalar\u0131 (G-SIB) hedeflese de, raporlama e\u015Fi\u011Finin y\xFCkseltilmesi ve veri hesaplama y\xF6ntemlerindeki de\u011Fi\u015Fiklikler, kamu bankas\u0131 gibi b\xFCy\xFCk \xF6l\xE7ekli kurumlar\u0131n raporlama s\xFCre\xE7lerini ve veri altyap\u0131s\u0131n\u0131 dolayl\u0131 olarak etkileyebilir.",konu:"Basel",ozet_tek_satir:"Basel Komitesi, k\xFCresel sistemik \xF6neme sahip bankalar\u0131n (G-SIB) y\u0131l sonu verilerini manip\xFCle etmesini (pencere s\xFCsleme) engellemek amac\u0131yla, g\xF6stergelerin y\u0131l boyu ortalamalar \xFCzerinden raporlanmas\u0131n\u0131 zorunlu k\u0131lan ve raporlama e\u015Fiklerini g\xFCncelleyen nihai standartlar\u0131 yay\u0131mlam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-10-16",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"238ab314a616c17e"}],alt_konular:["G-SIB \xE7er\xE7evesi","Window dressing","Raporlama e\u015Fi\u011Fi"],etkilenen_alanlar:["Raporlama","Veri y\xF6netimi","Kredi riski"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:"2030-01-01",analiz:{yonetici_ozeti:"Basel Komitesi, G-SIB \xE7er\xE7evesinde 'window dressing' (makyajlama) faaliyetlerini engellemek amac\u0131yla raporlama y\xF6ntemlerini revize etmi\u015Ftir. Y\u0131l sonu de\u011Ferleri yerine y\u0131l boyu ortalama de\u011Ferlerin kullan\u0131lmas\u0131 zorunlu hale getirilmi\u015Ftir. Ayr\u0131ca, G-SIB raporlama ve a\xE7\u0131klama e\u015Fi\u011Fi 200 milyar EUR'dan 350 milyar EUR'ya y\xFCkseltilmi\u015Ftir. De\u011Fi\u015Fiklikler 2027 ve 2030 y\u0131llar\u0131nda iki a\u015Famada y\xFCr\xFCrl\xFC\u011Fe girecektir.",amac:{teyitli:[{hukum:"G-SIB \xE7er\xE7evesinde makyajlama faaliyetlerini engellemek amac\u0131yla revizyonlar yap\u0131lm\u0131\u015Ft\u0131r.",alinti:"The Basel Committee on Banking Supervision has finalised amendments to address window-dressing behaviour in the context of the framework for global systemically important banks (G-SIBs).",sayfa:null,paragraf:34,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n sistemik \xF6nem skorunun hesaplanmas\u0131nda y\u0131l sonu yerine ortalama de\u011Ferlerin kullan\u0131lmas\u0131, bilan\xE7o y\xF6netimi stratejilerinde de\u011Fi\u015Fikli\u011Fe yol a\xE7abilir.","Raporlama e\u015Fi\u011Finin y\xFCkseltilmesi, baz\u0131 bankalar\u0131n G-SIB raporlama y\xFCk\xFCml\xFCl\xFC\u011F\xFCnden muaf kalmas\u0131na veya raporlama kapsam\u0131n\u0131n daralmas\u0131na neden olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Y\xFCksek frekansl\u0131 (g\xFCnl\xFCk, ayl\u0131k) veri toplama ve i\u015Fleme kapasitesinin art\u0131r\u0131lmas\u0131 gerekebilir.","Veri ambar\u0131 ve raporlama sistemlerinde hesaplama mant\u0131\u011F\u0131n\u0131n g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["2028'den itibaren ba\u015Flayacak ge\xE7i\u015F d\xF6neminde, bankalar\u0131n hem y\u0131l sonu hem de ortalama de\u011Ferleri raporlamas\u0131 operasyonel y\xFCk\xFC art\u0131rabilir.","Veri kalitesi ve tutarl\u0131l\u0131\u011F\u0131na y\xF6nelik i\xE7 denetim s\xFCre\xE7lerinin yeniden yap\u0131land\u0131r\u0131lmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["G-SIB skorlar\u0131ndaki de\u011Fi\u015Fim, bankan\u0131n tabi olabilece\u011Fi ek sermaye tamponu (higher loss absorbency) gereksinimlerini etkileyebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Raporlama ve a\xE7\u0131klama e\u015Fi\u011Fi",onceki:"200 milyar EUR",yeni:"350 milyar EUR",referans:"Sayfa 5"},{konu:"G-SIB g\xF6sterge hesaplama y\xF6ntemi",onceki:"Y\u0131l sonu de\u011Ferleri",yeni:"Y\u0131l boyu ortalama de\u011Ferler",referans:"Sayfa 4"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme do\u011Frudan kredi riski PD parametrelerini de\u011Fil, sistemik \xF6nem skorlar\u0131n\u0131 etkilemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme LGD hesaplamalar\u0131n\u0131 do\u011Frudan etkilememektedir."},EAD:{duzey:"Orta",not:"Kald\u0131ra\xE7 oran\u0131 maruziyeti (leverage ratio exposure) hesaplamalar\u0131, G-SIB raporlama e\u015Fi\u011Fi i\xE7in kritik \xF6neme sahiptir."},ECL:{duzey:"Dolayl\u0131",not:"Bilan\xE7o y\xF6netimi ve raporlama verilerindeki de\u011Fi\u015Fiklikler dolayl\u0131 olarak finansal raporlama s\xFCre\xE7lerini etkileyebilir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 5"},{tur:"Uyum",tarih:"2030-01-01",referans:"Sayfa 5"}],gozden_gecirilecekler:[{baslik:"Veri toplama frekans\u0131",aciklama:"G-SIB g\xF6stergelerinin hesaplanmas\u0131nda kullan\u0131lacak g\xFCnl\xFCk, ayl\u0131k ve \xFC\xE7 ayl\u0131k veri setlerinin olu\u015Fturulmas\u0131."},{baslik:"Raporlama e\u015Fi\u011Fi analizi",aciklama:"Bankan\u0131n 350 milyar EUR e\u015Fi\u011Fine g\xF6re G-SIB raporlama y\xFCk\xFCml\xFCl\xFC\u011F\xFCn\xFCn yeniden de\u011Ferlendirilmesi."}],referanslar:[{metin:"Reporting and disclosure threshold",sayfa:5,paragraf:null},{metin:"Implementation date",sayfa:5,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:50:00+03:00",gonderilen_karakter:28432,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"fsb-2026-10-15-4c215a",kurum:"fsb",baslik_orijinal:"Sound Practices for Responsible Adoption of Artificial Intelligence (AI): Overview of consultation responses",baslik_tr:"Yapay Zekan\u0131n (YZ) Sorumlu Kullan\u0131m\u0131 \u0130\xE7in Sa\u011Fl\u0131kl\u0131 Uygulamalar: \u0130sti\u015Fare Yan\u0131tlar\u0131na Genel Bak\u0131\u015F",url:"https://www.fsb.org/2026/10/sound-practices-for-responsible-adoption-of-artificial-intelligence-ai-overview-of-consultation-responses/",belge_turu:"Rapor",statu:"Nihai",onem:"Orta",onem_gerekcesi:"FSB taraf\u0131ndan yay\u0131mlanan bu rapor, yapay zeka (YZ) adaptasyonunda finansal kurumlar i\xE7in uluslararas\u0131 d\xFCzeyde kabul g\xF6rm\xFC\u015F iyi uygulama \xF6rneklerini i\xE7ermektedir. Kamu sermayeli bir banka olarak, operasyonel risk y\xF6netimi ve teknoloji stratejilerinde bu rehberin dikkate al\u0131nmas\u0131, uluslararas\u0131 standartlara uyum ve risk y\xF6netimi kalitesi a\xE7\u0131s\u0131ndan \xF6nem arz etmektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"FSB taraf\u0131ndan finansal kurulu\u015Flar\u0131n yapay zeka teknolojilerini sorumlu bir \u015Fekilde benimsemelerine yard\u0131mc\u0131 olmak amac\u0131yla haz\u0131rlanan rehberin isti\u015Fare s\xFCreci sonu\xE7lar\u0131n\u0131 ve nihai raporda yap\u0131lan de\u011Fi\u015Fiklikleri i\xE7ermektedir.",yayin_tarihi:"2026-10-15",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"5a19e05f24847d64"}],alt_konular:["Yapay Zeka Y\xF6neti\u015Fimi","\xDC\xE7\xFCnc\xFC Taraf Risk Y\xF6netimi","Operasyonel Dayan\u0131kl\u0131l\u0131k"],etkilenen_alanlar:["Risk Y\xF6netimi","Bilgi Teknolojileri","Operasyonel Risk","Y\xF6neti\u015Fim"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"FSB, finansal kurumlar\u0131n yapay zekay\u0131 sorumlu bir \u015Fekilde benimsemelerine yard\u0131mc\u0131 olmak amac\u0131yla haz\u0131rlad\u0131\u011F\u0131 iyi uygulama raporunu, gelen 160'tan fazla geri bildirimi de\u011Ferlendirerek nihai hale getirmi\u015Ftir. Rapor, YZ y\xF6neti\u015Fimi, ya\u015Fam d\xF6ng\xFCs\xFC y\xF6netimi ve \xFC\xE7\xFCnc\xFC taraf riskleri gibi konularda ilkeler bazl\u0131 ve teknoloji tarafs\u0131z bir yakla\u015F\u0131m sunmaktad\u0131r. \xD6zellikle otonom (agentic) YZ sistemlerine y\xF6nelik risk y\xF6netimi ve insan g\xF6zetimi konular\u0131nda ek rehberlik sa\u011Flanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n mevcut risk y\xF6netimi ve y\xF6neti\u015Fim \xE7er\xE7evelerini bu ilkelerle uyumlu hale getirmesi beklenmektedir.",amac:{teyitli:[{hukum:"Finansal kurumlar\u0131n yapay zekay\u0131 sorumlu bir \u015Fekilde benimsemelerine yard\u0131mc\u0131 olmak i\xE7in iyi uygulamalar\u0131n belirlenmesi.",alinti:"The FSB has developed sound practices to help all types of financial institutions navigate benefits and risks responsibly as they adopt AI.",sayfa:null,paragraf:19,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n mevcut YZ projelerinde ve \xFC\xE7\xFCnc\xFC taraf YZ tedarik\xE7i s\xF6zle\u015Fmelerinde, FSB'nin g\xFCncellenmi\u015F iyi uygulama ilkeleriyle uyum sa\u011Flanmas\u0131 gerekebilir.","Otonom YZ sistemlerinin kullan\u0131m\u0131nda, raporun \xF6nerdi\u011Fi yeni kontrol mekanizmalar\u0131n\u0131n (runtime monitoring, audit trails) i\xE7 s\xFCre\xE7lere entegre edilmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Daha \xF6nce yay\u0131mlanan isti\u015Fare raporuna k\u0131yasla, nihai raporda otonom YZ sistemlerine y\xF6nelik daha spesifik risk y\xF6netimi beklentileri eklenmi\u015Ftir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["YZ sistemlerinin a\xE7\u0131klanabilirli\u011Fi ve performans y\xF6netimi i\xE7in ba\u011F\u0131ms\u0131z do\u011Frulama s\xFCre\xE7lerinin teknik altyap\u0131ya dahil edilmesi gerekebilir.","Otonom YZ sistemleri i\xE7in ger\xE7ek zamanl\u0131 izleme ve m\xFCdahale yeteneklerinin geli\u015Ftirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Y\xF6netim kurulu ve \xFCst y\xF6netimin YZ riskleri konusundaki sorumluluklar\u0131n\u0131n netle\u015Ftirilmesi ve raporlama s\xFCre\xE7lerinin g\xFCncellenmesi gerekebilir.","\u0130\u015F s\xFCreklili\u011Fi planlar\u0131n\u0131n, otonom YZ sistemlerinin hata yapmas\u0131 veya kesintiye u\u011Framas\u0131 durumlar\u0131n\u0131 kapsayacak \u015Fekilde revize edilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk y\xF6netimi \xE7er\xE7evesinin g\xFC\xE7lendirilmesi, uzun vadede operasyonel risk kaynakl\u0131 sermaye gereksinimlerinin daha etkin y\xF6netilmesini sa\u011Flayabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"\xDC\xE7\xFCnc\xFC Taraf YZ Risk Y\xF6netimi",onceki:"Genel \xFC\xE7\xFCnc\xFC taraf risk y\xF6netimi \xE7er\xE7evesi.",yeni:"G\xF6m\xFCl\xFC YZ riskleri, alt y\xFCklenici faaliyetleri ve yo\u011Funla\u015Fma risklerini kapsayan geni\u015Fletilmi\u015F rehberlik.",referans:"Sayfa 7"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},EAD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},ECL:{duzey:"Dolayl\u0131",not:"YZ tabanl\u0131 modelleme s\xFCre\xE7lerinin iyile\u015Ftirilmesi, model risk y\xF6netimi \xFCzerinden dolayl\u0131 olarak ECL hesaplamalar\u0131n\u0131n g\xFCvenilirli\u011Fini etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-06-10",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"YZ Y\xF6neti\u015Fim \xC7er\xE7evesi",aciklama:"Banka i\xE7i YZ y\xF6neti\u015Fim yap\u0131s\u0131n\u0131n, y\xF6netim kurulu ve \xFCst y\xF6netim sorumluluklar\u0131 a\xE7\u0131s\u0131ndan FSB ilkeleriyle uyumu g\xF6zden ge\xE7irilmelidir."},{baslik:"\xDC\xE7\xFCnc\xFC Taraf YZ S\xF6zle\u015Fmeleri",aciklama:"\xDC\xE7\xFCnc\xFC taraf YZ tedarik\xE7ileri ile yap\u0131lan s\xF6zle\u015Fmelerin, yo\u011Funla\u015Fma riski ve i\u015F s\xFCreklili\u011Fi maddeleri a\xE7\u0131s\u0131ndan g\xFCncellenmesi de\u011Ferlendirilmelidir."}],referanslar:[{metin:"Sound practices for financial institutions\u2019 responsible AI adoption",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:50:20+03:00",gonderilen_karakter:20611,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"ecb-2026-10-15-12d716",kurum:"ecb",baslik_orijinal:"Regulatory reporting on profit and loss: institutions will have option to report under IAS 1 or IFRS 18",baslik_tr:"Kar ve zarar raporlamas\u0131nda d\xFCzenleyici raporlama: kurumlar IAS 1 veya IFRS 18 kapsam\u0131nda raporlama se\xE7ene\u011Fine sahip olacak",url:"https://www.bankingsupervision.europa.eu//press/pr/date/2026/html/ssm.pr261015~9c7bd1ee8e.en.html",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"Orta",onem_gerekcesi:"TFRS 9 uygulayan bir banka olarak, IFRS 18'e ge\xE7i\u015F s\xFCreci finansal raporlama formatlar\u0131n\u0131 ve FINREP bildirimlerini do\u011Frudan etkilemektedir.",konu:"TFRS 9",ozet_tek_satir:"IFRS 18 standard\u0131n\u0131n y\xFCr\xFCrl\xFC\u011Fe girmesiyle birlikte, bankalar\u0131n ge\xE7i\u015F d\xF6nemindeki operasyonel y\xFCk\xFCn\xFC azaltmak amac\u0131yla 2027 y\u0131l\u0131 boyunca IAS 1 veya IFRS 18 standartlar\u0131ndan birini se\xE7erek d\xFCzenleyici raporlama yapmalar\u0131na izin verilmektedir.",yayin_tarihi:"2026-10-15",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"1fbd7369a3f330a4"}],alt_konular:["FINREP","Finansal Raporlama"],etkilenen_alanlar:["Raporlama","Muhasebe"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"IFRS 18 muhasebe standard\u0131 1 Ocak 2027 itibar\u0131yla y\xFCr\xFCrl\xFC\u011Fe girmektedir. EBA'n\u0131n g\xFCncellenmi\u015F teknik standartlar\u0131 Eyl\xFCl 2027'ye kadar uygulanmayaca\u011F\u0131ndan, bankalara ge\xE7i\u015F d\xF6neminde IAS 1 veya IFRS 18 raporlama formatlar\u0131ndan birini se\xE7me opsiyonu tan\u0131nm\u0131\u015Ft\u0131r. Bu esneklik, operasyonel y\xFCk\xFC azaltmay\u0131 ama\xE7lamaktad\u0131r.",amac:{teyitli:[{hukum:"IFRS 18 standard\u0131 1 Ocak 2027'de y\xFCr\xFCrl\xFC\u011Fe girecektir.",alinti:"The new accounting standard IFRS 18, concerning the presentation of profit and loss items, will come into effect on 1 January 2027",sayfa:null,paragraf:7,alinti_dogrulandi:!0},{hukum:"Kurumlar, ge\xE7i\u015F d\xF6neminde IAS 1 veya IFRS 18 aras\u0131nda se\xE7im yapabilirler.",alinti:"institutions will have the option to report regulatory templates under either the previous (IAS 1) or the new (IFRS 18) accounting standard",sayfa:null,paragraf:8,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n raporlama sistemlerinde IFRS 18 uyumlu FINREP \u015Fablonlar\u0131na ge\xE7i\u015F i\xE7in teknik haz\u0131rl\u0131k yap\u0131lmas\u0131 gerekebilir.","Se\xE7ilen raporlama y\xF6nteminin ulusal d\xFCzenleyici kurum (NCA) ile koordine edilmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["FINREP veri setlerinde ve raporlama \u015Fablonlar\u0131nda IFRS 18 uyumlu veri noktalar\u0131na ge\xE7i\u015F gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Ge\xE7i\u015F d\xF6neminde \xE7ift raporlama y\xFCk\xFCn\xFCn azalt\u0131lmas\u0131 i\xE7in bankan\u0131n bir tercih yapmas\u0131 ve bu tercihi NCA'ya bildirmesi gerekecektir."]},sermaye_rwa:{teyitli:[],olasi_etki:[]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Kar ve zarar sunumu",onceki:"IAS 1",yeni:"IFRS 18",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama format\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u015Ftirmez."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama format\u0131 ile ilgilidir."},EAD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama format\u0131 ile ilgilidir."},ECL:{duzey:"Dolayl\u0131",not:"IFRS 18'in kar ve zarar sunumundaki de\u011Fi\u015Fiklikleri, finansal tablolar\u0131n dipnotlar\u0131nda ve ECL sunumunda dolayl\u0131 etkiler yaratabilir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Raporlama Tercihi",aciklama:"Bankan\u0131n IAS 1 veya IFRS 18 raporlama formatlar\u0131ndan hangisini kullanaca\u011F\u0131n\u0131n belirlenmesi ve NCA'ya bildirilmesi."}],referanslar:[{metin:"Regulatory reporting on profit and loss",sayfa:1,paragraf:2}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:50:34+03:00",gonderilen_karakter:4208,alinti_dogrulanan:2,alinti_toplam:2,guven:"Y\xFCksek"}},{id:"fsb-2026-10-14-4d353c",kurum:"fsb",baslik_orijinal:"FSB consults on high-level principles for regulatory and supervisory modernisation",baslik_tr:"FSB, d\xFCzenleyici ve denetleyici modernizasyon i\xE7in \xFCst d\xFCzey ilkeler konusunda isti\u015Farede bulunuyor",url:"https://www.fsb.org/2026/10/fsb-consults-on-high-level-principles-for-regulatory-and- ri ve yetkili kurumlara bildirim s\xFCre\xE7leri operasyonel i\u015F y\xFCk\xFCn\xFC art\u0131rabilir.","CSD'lerin bankac\u0131l\u0131k tipi yan hizmetleri di\u011Fer CSD'lere sunabilmesine olanak tan\u0131yan CSDR Refit de\u011Fi\u015Fikliklerine uyum sa\u011Flamak. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Standart yakla\u015F\u0131m kullanan bankam\u0131z i\xE7in CRR referansl\u0131 sermaye hesaplama y\xF6ntemlerinde g\xFCncellemeler yap\u0131lmas\u0131 gerekebilir.","\u0130ntraday kredi ve likidite riski izleme ara\xE7lar\u0131n\u0131n, di\u011Fer CSD kat\u0131l\u0131mc\u0131lar\u0131n\u0131 i\xE7erecek \u015Fekilde g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yetkili kuruma bildirim s\xFCre\xE7lerinin (Article 27) yeni hizmet kapsam\u0131na g\xF6re revize edilmesi gerekebilir.","Risk komitesi raporlama s\xFCre\xE7lerinin yeni CSD ba\u011Flant\u0131lar\u0131n\u0131 kapsayacak \u015Fekilde geni\u015Fletilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riski sermaye gereklilikleri i\xE7in FRTB (Fundamental Review of Trading Book) uyumlu hesaplamalara ge\xE7i\u015F gerekebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Operasyonel risk sermaye hesaplamas\u0131",onceki:"Bankac\u0131l\u0131k ve bankac\u0131l\u0131k d\u0131\u015F\u0131 CSD'ler aras\u0131nda ayr\u0131m mevcuttu.",yeni:"CRR'deki tek y\xF6ntem nedeniyle ayr\u0131m kald\u0131r\u0131ld\u0131.",referans:"Sayfa 7"},{konu:"\u0130ntraday kredi riski raporlamas\u0131",onceki:"Sadece kendi kat\u0131l\u0131mc\u0131lar\u0131na y\xF6nelik raporlama.",yeni:"Di\u011Fer CSD kat\u0131l\u0131mc\u0131lar\u0131na sunulan hizmetleri de kapsayacak \u015Fekilde geni\u015Fletildi.",referans:"Sayfa 16"}],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Standart yakla\u015F\u0131m kullan\u0131ld\u0131\u011F\u0131 i\xE7in do\u011Frudan bi ","IRRBB","Kripto Varl\u0131klar"],etkilenen_alanlar:["Raporlama","Risk Y\xF6netimi","Bilgi Teknolojileri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Basel Komitesi, yapay zeka, operasyonel risk kategorileri, IRRBB ve kripto varl\u0131klar gibi alanlarda yeni standartlar ve rehberler \xFCzerinde \xE7al\u0131\u015Fmaktad\u0131r. Makine taraf\u0131ndan okunabilir Pillar 3 a\xE7\u0131klamalar\u0131 i\xE7in nihai standart onaylanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n bu geli\u015Fmeleri izleyerek, \xF6zellikle operasyonel risk \xE7er\xE7evesi ve raporlama altyap\u0131s\u0131nda uyum haz\u0131rl\u0131klar\u0131na ba\u015Flamas\u0131 \xF6nerilmektedir.",amac:{teyitli:[{hukum:"Makine taraf\u0131ndan okunabilir Pillar 3 a\xE7\u0131klamalar\u0131 i\xE7in nihai standart onaylanm\u0131\u015Ft\u0131r.",alinti:"Approves annual assessment exercise for global systemically important banks and revisions to reduce year-end window-dressing behaviour, and final standard for machine-readable Pillar 3 disclosures.",sayfa:null,paragraf:9,alinti_dogrulandi:!0}],olasi_etki:["Makine taraf\u0131ndan okunabilir Pillar 3 raporlama standard\u0131, bankan\u0131n veri i\u015Fleme ve raporlama s\xFCre\xE7lerinde dijitalle\u015Fme zorunlulu\u011Fu getirebilir.","Operasyonel risk \xE7er\xE7evesindeki 'olay tipi' kategorilerinin g\xF6zden ge\xE7irilmesi, bankan\u0131n i\xE7sel risk s\u0131n\u0131fland\u0131rma sistemlerinde g\xFCncelleme gerektirebilir.","IRRBB i\xE7in planlanan ek Pillar 2 rehberli\u011Fi, bankan\u0131n faiz oran\u0131 risk y\xF6netimi s\xFCre\xE7lerinde daha s\u0131k\u0131 denetim ve raporlama beklentisi yaratabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Veri ambar\u0131 ve raporlama sistemlerinin makine taraf\u0131ndan okunabilir (machine-readable) formatlara uyumlu hale getirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yapay zeka kullan\u0131m\u0131 ile ilgili risk y\xF6netimi ve y\xF6neti\u015Fim s\xFCre\xE7lerinin olu\u015Fturulmas\u0131 gerekebilir.","Operasyonel risk olay kategorilerinin g\xFCncellenmesi, bankan\u0131n i\xE7sel veri toplama s\xFCre\xE7lerini etkileyebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Kripto varl\u0131k standartlar\u0131ndaki olas\u0131 g\xFCncellemeler, ilgili varl\u0131klar\u0131n RWA hesaplamalar\u0131n\u0131 etkileyebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Pillar 3 Raporlama",onceki:"PDF format\u0131nda raporlama",yeni:"Makine taraf\u0131ndan okunabilir formatta raporlama",referans:"Sayfa 1, P17"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Do\u011Frudan bir de\u011Fi\u015Fiklik belirtilmemi\u015Ftir."},LGD:{duzey:"Etki beklenmiyor",not:"Do\u011Frudan bir de\u011Fi\u015Fiklik belirtilmemi\u015Ftir."},EAD:{duzey:"Etki beklenmiyor",not:"Do\u011Frudan bir de\u011Fi\u015Fiklik belirtilmemi\u015Ftir."},ECL:{duzey:"Dolayl\u0131",not:"Operasyonel risk ve IRRBB g\xFCncellemeleri dolayl\u0131 olarak risk profili de\u011Ferlendirmelerini etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-10-01",referans:"Sayfa 1, P5"}],gozden_gecirilecekler:[{baslik:"Operasyonel Risk \xC7er\xE7evesi",aciklama:"Siber risk ve yapay zeka odakl\u0131 olay tipi kategorilerinin yeterlili\u011Finin g\xF6zden ge\xE7irilmesi."},{baslik:"Pillar 3 Raporlama Altyap\u0131s\u0131",aciklama:"Makine taraf\u0131ndan okunabilir raporlama standartlar\u0131na ge\xE7i\u015F i\xE7in teknik haz\u0131rl\u0131klar\u0131n de\u011Ferlendirilmesi."}],referanslar:[{metin:"Digitalisation",sayfa:1,paragraf:14},{metin:"Interest rate risk in the banking book",sayfa:1,paragraf:24}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:58:29+03:00",gonderilen_karakter:7573,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"bcbs-2026-10-01-6f25d6",kurum:"bcbs",baslik_orijinal:"International supervisory community meets to discuss the future of global bank supervision and regulation",baslik_tr:"Uluslararas\u0131 denetim toplulu\u011Fu, k\xFCresel banka denetimi ve d\xFCzenlemesinin gelece\u011Fini tart\u0131\u015Fmak \xFCzere bir araya geldi",url:"https://www.bis.org/media-releases/20261001-international-supervisory-community-meets-discuss-future-global-bank-supervision-and-regulation",belge_turu:"Bas\u0131n duyurusu",statu:"Bilgi ama\xE7l\u0131",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Belge, BCBS taraf\u0131ndan d\xFCzenlenen bir konferans\u0131n \xF6zetini i\xE7eren bilgilendirme ama\xE7l\u0131 bir bas\u0131n b\xFCltenidir; banka i\xE7in do\u011Frudan ba\u011Flay\u0131c\u0131 bir d\xFCzenleme de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir.",konu:"Di\u011Fer",ozet_tek_satir:"Basel Komitesi taraf\u0131ndan d\xFCzenlenen 24. Uluslararas\u0131 Banka Denet\xE7ileri Konferans\u0131'nda, denetim etkinli\u011Finin art\u0131r\u0131lmas\u0131, d\xFCzenlemelerin sadele\u015Ftirilmesi, finans\u0131n dijitalle\u015Fmesi ve banka-banka d\u0131\u015F\u0131 finansal kurulu\u015Flar aras\u0131ndaki risk ba\u011Flant\u0131lar\u0131 ele al\u0131nm\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-10-01",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"5a9931911d5a9bdc"}],alt_konular:["Denetim stratejileri","Dijitalle\u015Fme","Operasyonel dayan\u0131kl\u0131l\u0131k"],etkilenen_alanlar:["Risk Y\xF6netimi","Stratejik Planlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"BCBS taraf\u0131ndan d\xFCzenlenen 24. Uluslararas\u0131 Bankac\u0131l\u0131k Denet\xE7ileri Konferans\u0131'nda (ICBS) denetim etkinli\u011Fi, finans\u0131n dijitalle\u015Fmesi, yapay zeka ve banka-banka d\u0131\u015F\u0131 finansal kurulu\u015Flar aras\u0131ndaki ba\u011Flant\u0131lar ele al\u0131nm\u0131\u015Ft\u0131r. Konferans, denetim \xE7er\xE7evelerinin modernle\u015Ftirilmesi ve risk apor, denetim makamlar\u0131n\u0131n kurallar\u0131 b\xFCy\xFCk oranda uyumla\u015Ft\u0131rd\u0131\u011F\u0131n\u0131 ve hem standart hem de i\xE7sel derecelendirme yakla\u015F\u0131mlar\u0131 i\xE7in kritik oldu\u011Funu belirtmektedir.",yayin_tarihi:"2026-11-26",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T13:46:13+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T13:46:13+03:00",icerik_hash:"9913f3fdf6bfdbdd"}],alt_konular:["Temerr\xFCt Tan\u0131m\u0131 (DoD)","Standart yakla\u015F\u0131m","Kredi riski"],etkilenen_alanlar:["Kredi riski","Raporlama","\u0130\xE7 kontrol"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, temerr\xFCt tan\u0131m\u0131 (DoD) rehberlerinin uygulanmas\u0131na ili\u015Fkin bir takip raporu yay\u0131mlam\u0131\u015Ft\u0131r. Rapor, AB genelinde denetimsel yak\u0131nsaman\u0131n y\xFCksek oldu\u011Funu ancak standart yakla\u015F\u0131m (SA) kullanan bankalar\u0131n denetiminde farkl\u0131l\u0131klar bulundu\u011Funu belirtmektedir. Bankam\u0131z\u0131n SA kullanmas\u0131 nedeniyle, denetleyici otoritelerin temerr\xFCt tan\u0131m\u0131 uyumunu izlemek i\xE7in daha resmi ve dok\xFCmante edilmi\u015F \xE7er\xE7eveler geli\u015Ftirmesi beklenmektedir.",amac:{teyitli:[],olasi_etki:["Denetleyici otoritelerin, standart yakla\u015F\u0131m kullanan bankalar i\xE7in temerr\xFCt tan\u0131m\u0131 uyumunu izlemek \xFCzere daha s\u0131k\u0131 ve dok\xFCmante edilmi\u015F denetim s\xFCre\xE7leri uygulamas\u0131 beklenebilir.","Bankan\u0131n temerr\xFCt tan\u0131m\u0131 ile ilgili i\xE7 politikalar\u0131n\u0131n ve IT sistemlerinin, EBA rehberleri ile tam uyumunun sa\u011Flanmas\u0131 i\xE7in ek denetimler gerekebilir.","EBA, temerr\xFCt tan\u0131m\u0131n\u0131n AB bankac\u0131l\u0131k sekt\xF6r\xFCnde tutarl\u0131 uygulanmas\u0131n\u0131 te\u015Fvik etmek amac\u0131yla rehberler yay\u0131mlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131 (DoD) ile ilgili IT sistemlerinin, \xF6zellikle 'g\xFCn baz\u0131nda gecikme' (DpD) ve '\xF6dememe olas\u0131l\u0131\u011F\u0131' (UTP) g\xF6stergelerini do\u011Fru hesaplayacak \u015Fekilde g\xFCncellenmesi gerekebilir.","Temerr\xFCt tan\u0131m\u0131n\u0131n grup d\xFCzeyinde tutarl\u0131 uygulanmas\u0131 i\xE7in veri altyap\u0131s\u0131n\u0131n g\xFC\xE7lendirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131 uyumuna ili\u015Fkin i\xE7 denetim ve risk y\xF6netimi raporlamalar\u0131n\u0131n s\u0131kl\u0131\u011F\u0131 ve derinli\u011Fi artabilir.","Temerr\xFCt tan\u0131m\u0131 ile ilgili s\xFCre\xE7lerin (UTP g\xF6stergeleri, \xE7\u0131k\u0131\u015F kriterleri) daha detayl\u0131 dok\xFCmante edilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131n\u0131n daha tutarl\u0131 uygulanmas\u0131, risk a\u011F\u0131rl\u0131kl\u0131 varl\u0131klar\u0131n (RWA) hesaplanmas\u0131nda daha do\u011Fru sonu\xE7lar do\u011Furabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Denetim Yakla\u015F\u0131m\u0131",onceki:"SA bankalar\u0131 i\xE7in daha az resmi denetim s\xFCre\xE7leri",yeni:"SA bankalar\u0131 i\xE7in daha resmi ve dok\xFCmante edilmi\u015F denetim \xE7er\xE7eveleri beklentisi",referans:"Sayfa 39"}],parametre_etkisi:{PD:{duzey:"Orta",not:"Temerr\xFCt tan\u0131m\u0131ndaki de\u011Fi\u015Fiklikler, temerr\xFCt olas\u0131l\u0131\u011F\u0131 (PD) tahminlerini do\u011Frudan etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"Temerr\xFCt tan\u0131m\u0131n\u0131n netle\u015Fmesi, temerr\xFCt durumunda kay\u0131p (LGD) hesaplamalar\u0131nda kullan\u0131lan verilerin kalitesini etkileyebilir."},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Orta",not:"Temerr\xFCt tan\u0131m\u0131ndaki g\xFCncellemeler, TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 (ECL) hesaplamalar\u0131n\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-26",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Temerr\xFCt Tan\u0131m\u0131 Politikalar\u0131",aciklama:"EBA/GL/2016/07 rehberleri ile uyumun, \xF6zellikle UTP g\xF6stergeleri ve \xE7\u0131k\u0131\u015F kriterleri a\xE7\u0131s\u0131ndan g\xF6zden ge\xE7irilmesi."},{baslik:"IT Sistemleri",aciklama:"Temerr\xFCt hesaplamalar\u0131nda kullan\u0131lan IT sistemlerinin, EBA rehberlerindeki teknik gereklilikleri kar\u015F\u0131lay\u0131p kar\u015F\u0131lamad\u0131\u011F\u0131n\u0131n kontrol\xFC."}],referanslar:[{metin:"Implementation of EBA/GL/2016/07",sayfa:12,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T16:14:42+03:00",gonderilen_karakter:102973,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"fsb-2026-11-25-d8a72b",kurum:"fsb",baslik_orijinal:"2026 List of Global Systemically Important Banks (G-SIBs)",baslik_tr:"2026 K\xFCresel Sistemik \xD6neme Sahip Bankalar (G-SIB) Listesi",url:"https://www.fsb.org/2026/11/2026-list-of-global-systemically-important-banks-g-sibs/",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Banka kamu sermayeli olup G-SIB (K\xFCresel Sistemik \xD6nemli Banka) stat\xFCs\xFCnde de\u011Fildir; bu nedenle liste do\u011Frudan bankay\u0131 ba\u011Flamamaktad\u0131r.",konu:"Basel",ozet_tek_satir:"Finansal \u0130stikrar Kurulu (FSB), 2026 y\u0131l\u0131 i\xE7in k\xFCresel sistemik \xF6neme sahip 29 bankay\u0131 belirlemi\u015F ve bu bankalar\u0131n sermaye tamponu gerekliliklerini g\xFCncelleyerek 2028 y\u0131l\u0131ndan itibaren ge\xE7erli olacak yeni s\u0131n\u0131fland\u0131rmalar\u0131 duyurmu\u015Ftur.",yayin_tarihi:"2026-11-25",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"1370ec4e4b678157"}],alt_konular:["G-SIB","Sermaye Tamp including-emts-decentralised-finance",belge_turu:"Rapor",statu:"Nihai",onem:"Orta",onem_gerekcesi:"D\xFCzenleme, MiCA kapsam\u0131nda yetkilendirilmi\u015F EMT'lerin DeFi ekosistemindeki kullan\u0131m\u0131n\u0131 ve bu durumun t\xFCketici korumas\u0131 ile d\xFCzenleyici arbitraj \xFCzerindeki etkilerini analiz etmektedir. Bankan\u0131n do\u011Frudan bir DeFi faaliyeti olmasa da, stabilcoin ihra\xE7\xE7\u0131lar\u0131 ve CASP'lerle olan etkile\u015Fimler nedeniyle risk y\xF6netimi a\xE7\u0131s\u0131ndan \xF6nem arz etmektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"EBA, MiCA kapsam\u0131nda ihra\xE7 edilen EMT'lerin DeFi ekosistemindeki rol\xFCn\xFC, t\xFCketici koruma risklerini ve d\xFCzenleyici arbitraj potansiyelini analiz eden bir rapor yay\u0131nlam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-11-25",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"e462446e6243cf22"}],alt_konular:["DeFi","Stabilcoin (EMT)","D\xFCzenleyici Arbitraj","T\xFCketici Koruma"],etkilenen_alanlar:["Kredi riski","Operasyonel risk","Uyum","Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, stabilcoinlerin (EMT'ler dahil) DeFi ekosistemindeki rol\xFCn\xFC inceleyen bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. Rapor, DeFi'nin likidite ve teminat sa\u011Flama gibi kritik i\u015Flevlerine dikkat \xE7ekerken, t\xFCketici korumas\u0131, operasyonel riskler ve MiCA d\xFCzenlemelerinin etraf\u0131ndan dola\u015F\u0131lmas\u0131na y\xF6nelik arbitraj risklerini vurgulamaktad\u0131r. Bankalar i\xE7in, DeFi ile etkile\u015Fime giren CASP'ler ve stabilcoin ihra\xE7\xE7\u0131lar\u0131 \xFCzerinden dolayl\u0131 risk bula\u015Fma kanallar\u0131 olu\u015Fabilece\u011Fi belirtilmektedir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n stabilcoin ihra\xE7\xE7\u0131lar\u0131 veya DeFi protokollerine eri\u015Fim sa\u011Flayan CASP'lerle olan ili\u015Fkileri, operasyonel ve itibari riskler a\xE7\u0131s\u0131ndan yeniden de\u011Ferlendirilebilir.","DeFi \xFCzerinden sa\u011Flanan y\xFCksek kald\u0131ra\xE7l\u0131 pozisyonlar ve stabilcoin teminatl\u0131 krediler, bankan\u0131n kar\u015F\u0131 taraf risk y\xF6netimi s\xFCre\xE7lerini etkileyebilir.","EBA, EMT'lerin ve di\u011Fer se\xE7ilmi\u015F stabilcoinlerin DeFi'deki kullan\u0131m\u0131n\u0131 ve t\xFCketiciler ile denetleyiciler \xFCzerindeki etkilerini analiz eden bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["DeFi protokollerinde kullan\u0131lan stabilcoinlerin likidite yap\u0131s\u0131, bankan\u0131n bu varl\u0131klara olan maruziyetini etkileyebilir.","Ak\u0131ll\u0131 s\xF6zle\u015Fme a\xE7\u0131klar\u0131ndan kaynaklanan operasyonel riskler, bankan\u0131n teknolojik risk de\u011Ferlendirme modellerine dahil edilebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["CASP'ler arac\u0131l\u0131\u011F\u0131yla DeFi'ye eri\u015Fim sa\u011Flayan m\xFC\u015Fterilerin risk profilleri, bankan\u0131n M\xFC\u015Fterini Tan\u0131 (KYC) ve Kara Para Aklama (AML) s\xFCre\xE7lerinde daha detayl\u0131 izleme gerektirebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["DeFi ile ba\u011Flant\u0131l\u0131 risklerin artmas\u0131 durumunda, bankan\u0131n operasyonel risk sermaye gereksinimi \xFCzerinde dolayl\u0131 bir bask\u0131 olu\u015Fabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"DeFi protokollerindeki teminatl\u0131 kredilerin geri \xF6denmeme riski, dolayl\u0131 olarak kar\u015F\u0131 taraf\u0131n kredi de\u011Ferlili\u011Fini etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"DeFi'de teminat olarak kullan\u0131lan stabilcoinlerin de\u011Fer kayb\u0131 veya likidite sorunlar\u0131, teminat\u0131n geri kazan\u0131m oran\u0131n\u0131 etkile r, AB ve ABD menkul k\u0131ymetle\u015Ftirme piyasalar\u0131 aras\u0131ndaki farklar\u0131 incelemekte ve AB piyasas\u0131n\u0131n san\u0131lan\u0131n aksine daha az geli\u015Fmi\u015F olmad\u0131\u011F\u0131n\u0131, sadece farkl\u0131 ara\xE7lara (teminatl\u0131 tahviller ve sentetik SRT) odakland\u0131\u011F\u0131n\u0131 savunmaktad\u0131r. Kamu bankalar\u0131 i\xE7in sentetik SRT i\u015Flemlerinin sermaye verimlili\u011Fi ve kredi kapasitesini koruma konusundaki stratejik \xF6nemi vurgulanmaktad\u0131r. Rapor, AB'deki fonlama ekosisteminin \xE7e\u015Fitlili\u011Finin, ABD'nin ajans destekli modeline k\u0131yasla farkl\u0131 bir dayan\u0131kl\u0131l\u0131k sa\u011Flad\u0131\u011F\u0131n\u0131 ortaya koymaktad\u0131r.",amac:{teyitli:[{hukum:"AB ve ABD menkul k\u0131ymetle\u015Ftirme piyasalar\u0131 aras\u0131ndaki farklar\u0131n metodolojik ve yap\u0131sal tan\u0131mlamalardan kaynakland\u0131\u011F\u0131 belirtilmektedir.",alinti:"We conclude that the apparent gap in terms of scale stems from methodological and structural differences in how securitisation is defined and measured across jurisdictions",sayfa:3,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n sermaye optimizasyonu stratejilerinde sentetik SRT i\u015Flemlerinin pay\u0131n\u0131n art\u0131r\u0131lmas\u0131 g\xFCndeme gelebilir.","Teminatl\u0131 tahvil ihrac\u0131n\u0131n, fonlama maliyetlerini d\xFC\u015F\xFCrmek ve likidite y\xF6netimi i\xE7in daha etkin bir ara\xE7 olarak kullan\u0131lmas\u0131 de\u011Ferlendirilebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Sentetik SRT i\u015Flemlerinin, bankan\u0131n RWA (Risk A\u011F\u0131rl\u0131kl\u0131 Varl\u0131klar) y\xF6netimi \xFCzerindeki etkisi daha yak\u0131ndan izlenebilir.","Teminatl\u0131 tahvillerin LCR (Likidite Kar\u015F\u0131lama Oran\u0131) ve NSFR (Net \u0130stikrarl\u0131 Fonlama Oran\u0131) \xFCzerindeki avantajlar\u0131, bankan\u0131n fonlama planlamas\u0131nda daha fazla dikkate al\u0131nabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Sentetik SRT i\u015Flemlerinin yap\u0131land\u0131r\u0131lmas\u0131 ve denetleyici onay s\xFCre\xE7leri i\xE7in operasyonel kapasitenin art\u0131r\u0131lmas\u0131 gerekebilir.","AB'deki STS (Basit, \u015Eeffaf ve Standart) \xE7er\xE7evesine uyum, menkul k\u0131ymetle\u015Ftirme i\u015Flemlerinde operasyonel standart haline gelebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Sentetik SRT kullan\u0131m\u0131 yoluyla RWA optimizasyonu, bankan\u0131n sermaye yeterlilik rasyolar\u0131n\u0131 iyile\u015Ftirebilir."]},iklim:{teyitli:[],olasi_etki:["Ye\u015Fil teminatl\u0131 tahvillerin ve ye\u015Fil menkul k\u0131ymetlerin, bankan\u0131n ESG hedefleriyle uyumlu bir fonlama arac\u0131 olarak kullan\u0131m\u0131 artabilir."],ilgili_degil:!1},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleyici bir de\u011Fi\u015Fiklik de\u011Fil, piyasa analizi raporudur."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleyici bir de\u011Fi\u015Fiklik de\u011Fil, piyasa analizi raporudur."},EAD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleyici bir de\u011Fi\u015Fiklik de\u011Fil, piyasa analizi raporudur."},ECL:{duzey:"Etki beklenmiyor",not:"D\xFCzenleyici bir de\u011Fi\u015Fiklik de\u011Fil, piyasa analizi raporudur."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-19",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Sentetik SRT Stratejisi",aciklama:"Bankan\u0131n sermaye verimlili\u011Fini art\u0131rmak i\xE7in sentetik SRT i\u015Flemlerinin mevcut portf\xF6y \xFCzerindeki potansiyel etkisi analiz edilmelidir."},{baslik:"Fonlama \xC7e\u015Fitlendirmesi",aciklama:"Teminatl\u0131 tahvillerin, geleneksel menkul k\u0131ymetle\u015Ftirmeye k\u0131yasla fonlama maliyeti ve likidite avantajlar\u0131 g\xF6zden ge\xE7irilmelidir."}],referanslar:[{metin:"Institutional and regulatory framework",sayfa:31,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026 i \xFCzerindeki etkilerini analiz etmektedir. Kamu bankas\u0131 olarak do\u011Frudan \u0130RD kullanmasak da, piyasa riskleri ve sermaye piyasas\u0131 faaliyetleri \xFCzerindeki dolayl\u0131 etkiler izlenmelidir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, yapay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n ve pasif yat\u0131r\u0131m trendlerinin piyasa d\xF6ng\xFCselli\u011Fi ve \xF6zkaynak finansman\u0131 \xFCzerindeki finansal istikrar etkilerini de\u011Ferlendirmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"6467bf3615b350c8"}],alt_konular:["\xD6z sermaye ihrac\u0131","Pasif yat\u0131r\u0131m","Piyasa d\xF6ng\xFCselli\u011Fi"],etkilenen_alanlar:["Kredi riski","Piyasa riski","Hazine faaliyetleri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB raporu, \xF6zellikle yapay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n (IPO) ve \xF6z sermaye ihra\xE7lar\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerini incelemektedir. Pasif yat\u0131r\u0131m\u0131n artan rol\xFC, hisse senedi talebini daha inelastik hale getirerek ihra\xE7 hacimlerini art\u0131rmaktad\u0131r. Bu durum, piyasa d\xF6ng\xFCselli\u011Fini g\xFC\xE7lendirebilir ve ekonomik gerileme d\xF6nemlerinde \xF6z sermaye finansman\u0131n\u0131n kurumas\u0131 riskini do\u011Furabilir. Bankam\u0131z\u0131n piyasa riskleri ve sermaye piyasas\u0131 stratejileri a\xE7\u0131s\u0131ndan bu e\u011Filimlerin izlenmesi \xF6nerilmektedir.",amac:{teyitli:[],olasi_etki:["Piyasa duyarl\u0131l\u0131\u011F\u0131ndaki de\u011Fi\u015Fimlerin, bankan\u0131n \xF6z sermaye piyasalar\u0131ndaki yat\u0131r\u0131m portf\xF6y\xFC \xFCzerinde oynakl\u0131\u011F\u0131 art\u0131rabilece\u011Fi de\u011Ferlendirilmektedir.","Pasif yat\u0131r\u0131m\u0131n artan etkisi nedeniyle, piyasa likiditesinin stres d\xF6nemlerinde beklenenden daha h\u0131zl\u0131 daralabilece\u011Fi \xF6ng\xF6r\xFClebilir.","B\xFCy\xFCk halka arzlar\u0131n ve genel olarak \xF6z sermaye ihrac\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerinin de\u011Ferlendirilmesi. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Pasif yat\u0131r\u0131m\u0131n inelastik talebi, hisse senedi fiyatlar\u0131n\u0131n temel g\xF6stergelerden kopmas\u0131na ve fiyat ke\u015Ffi s\xFCre\xE7lerinin zay\u0131flamas\u0131na neden olabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Halka arzlara kat\u0131l\u0131m veya bu piyasalardaki pozisyon y\xF6netimi s\xFCre\xE7lerinde, pasif yat\u0131r\u0131mc\u0131 ak\u0131\u015Flar\u0131n\u0131n piyasa \xFCzerindeki etkisinin daha yak\u0131ndan izlenmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan \xF6z sermaye pozisyonlar\u0131n\u0131n de\u011Ferlemesindeki oynakl\u0131k, sermaye yeterlilik rasyolar\u0131 \xFCzerinde k\u0131sa vadeli dalgalanmalara yol a\xE7abilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"\xD6z sermaye finansman\u0131n\u0131n d\xF6ng\xFCselli\u011Fi, ekonomik gerileme d\xF6nemlerinde firmalar\u0131n sermaye art\u0131rma kapasitesini etkileyerek dolayl\u0131 olarak kredi riskini art\u0131rabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Piyasa oynakl\u0131\u011F\u0131n\u0131n artmas\u0131, \xF6z sermaye bazl\u0131 varl\u0131klar\u0131n de\u011Ferlemesinde ve dolay\u0131s\u0131yla TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 hesaplamalar\u0131nda dolayl\u0131 etki yaratabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-18",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Piyasa Duyarl\u0131l\u0131\u011F\u0131 ve \xD6z Sermaye \u0130hrac\u0131",aciklama:"\xD6z sermaye ihra\xE7lar\u0131ndaki d\xF6ng\xFCsel zirvelerin, piyasa d\xFCzeltmelerine \xF6nc\xFC bir g\xF6sterge olup olmad\u0131\u011F\u0131n\u0131n izlenmesi."},{baslik:"Pasif Yat\u0131r\u0131m Etkisi",aciklama:"Pasif yat\u0131r\u0131mc\u0131lar\u0131n inelastik talebinin, bankan\u0131n piyasa risk y\xF6netimi modellerindeki likidite varsay\u0131mlar\u0131 \xFCzerindeki etkisinin g\xF6zden ge\xE7irilmesi."}],referanslar:[{metin:"Financial stability risks from large IPOs, equity issuance and passive investing",sayfa:1,paragraf:1}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T16:16:40+03:00",gonderilen_karakter:50528,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"ecb-2026-11-18-b62887",kurum:"ecb",baslik_orijinal:"Risks from AI valuations, fiscal imbalances and geoeconomic tensions weigh on financial stability outlook",baslik_tr:"Yapay zeka de\u011Ferlemeleri, mali dengesizlikler ve jeoekonomik gerilimlerden kaynaklanan riskler finansal istikrar g\xF6r\xFCn\xFCm\xFCn\xFC bask\u0131l\u0131yor",url:"https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr261118~83c5c60158.en.html",belge_turu:"Bas\u0131n duyurusu",statu:"Bilgi ama\xE7l\u0131",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Belge, Avrupa Merkez Bankas\u0131'n\u0131n finansal istikrar de\u011Ferlendirmesini i\xE7eren bir bas\u0131n b\xFCltenidir. Kamu sermayeli bankam\u0131z i\xE7in do\u011Frudan bir d\xFCzenleyici y\xFCk\xFCml\xFCl\xFCk i\xE7ermemekte, makroekonomik riskler hakk\u0131nda genel bilgilendirme yapmaktad\u0131r.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"ECB'nin finansal istikrar raporu, yapay zeka kaynakl\u0131 piyasa riskleri, mali dengesizlikler ve jeoekonomik gerilimlerin bankac\u0131l\u0131k sekt\xF6r\xFC \xFCzerindeki etkilerini ve sekt\xF6r\xFCn dayan\u0131kl\u0131l\u0131\u011F\u0131n\u0131 analiz etmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,t nal:"Peer Review of T\xFCrkiye",baslik_tr:"T\xFCrkiye Akran De\u011Ferlendirmesi",url:"https://www.fsb.org/2026/11/peer-review-of-turkiye/",belge_turu:"Rapor",statu:"Nihai",onem:"Y\xFCksek",onem_gerekcesi:"FSB'nin T\xFCrkiye'ye y\xF6nelik kripto varl\u0131k ve stablecoin d\xFCzenlemelerine ili\u015Fkin kritik tavsiyeleri, bankalar\u0131n bu varl\u0131klarla olan etkile\u015Fimlerini ve risk y\xF6netimini do\u011Frudan etkilemektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Finansal \u0130stikrar Kurulu (FSB), T\xFCrkiye'nin kripto varl\u0131k piyasalar\u0131na ili\u015Fkin d\xFCzenleyici \xE7er\xE7evesini de\u011Ferlendirerek, finansal istikrar\u0131n izlenmesi, stabil kripto varl\u0131klar i\xE7in \xF6zel bir rejim olu\u015Fturulmas\u0131 ve denetimlerin g\xFC\xE7lendirilmesi y\xF6n\xFCnde tavsiyelerde bulunmaktad\u0131r.",yayin_tarihi:"2026-11-11",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"3926a6801e624439"}],alt_konular:["Kripto varl\u0131klar","Stablecoin","Finansal istikrar izleme","Kredi riski"],etkilenen_alanlar:["Kredi riski","Raporlama","Uyum","Hazine ve risk y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"FSB, T\xFCrkiye'nin kripto varl\u0131k d\xFCzenlemelerinde kaydetti\u011Fi ilerlemeyi olumlu bulmakla birlikte, stablecoinler i\xE7in \xF6zel bir rejim kurulmas\u0131n\u0131 ve finansal istikrar izleme \xE7er\xE7evesinin g\xFC\xE7lendirilmesini \xF6nermektedir. Bankalar\u0131n kripto varl\u0131k maruziyetlerinin prudansiyel \xE7er\xE7evede daha etkin ele al\u0131nmas\u0131 ve BCBS standartlar\u0131yla uyumun de\u011Ferlendirilmesi kritik bir beklentidir. Bankam\u0131z\u0131n, i\u015Ftirakleri \xFCzerinden y\xFCr\xFCtt\xFC\u011F\xFC kripto faaliyetlerinde operasyonel ve finansal riskleri daha sistematik izlemesi gerekmektedir.",amac:{teyitli:[{hukum:"T\xFCrkiye'nin kripto varl\u0 -11-26T00:57:45+03:00",icerik_hash:"eebb03dce50a853f"}],alt_konular:["Beyaz etiketli (white-labelled) \xFCr\xFCnler","\xDC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131","T\xFCketici koruma","AML/CFT uyumu"],etkilenen_alanlar:["Kredi riski","Operasyonel risk","Uyum (Compliance)","T\xFCketici haklar\u0131"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, beyaz etiketli finansal \xFCr\xFCnlerin da\u011F\u0131t\u0131m modeline ili\u015Fkin bir bilgilendirme notu ve kapsaml\u0131 bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. Bu model, bankalar\u0131n \xFCr\xFCnlerini \xFC\xE7\xFCnc\xFC taraf markalar \xFCzerinden sunmas\u0131n\u0131 i\xE7erir ve operasyonel, uyum ve itibar riskleri ta\u015F\u0131r. Bankan\u0131n, bu t\xFCr i\u015F birliklerinde sorumluluk payla\u015F\u0131m\u0131n\u0131, m\xFC\u015Fteri \u015Feffafl\u0131\u011F\u0131n\u0131 ve AML/CFT s\xFCre\xE7lerini netle\u015Ftirmesi beklenmektedir. Rapor, \xF6zellikle \xE7apraz s\u0131n\u0131r faaliyetlerde ve dijital platformlarda risklerin artt\u0131\u011F\u0131na dikkat \xE7ekmektedir.",amac:{teyitli:[{hukum:"T\xFCketicilerin beyaz etiketli \xFCr\xFCnleri tan\u0131mlamas\u0131na yard\u0131mc\u0131 olmak.",alinti:"The European Banking Authority (EBA) published today a factsheet to help consumers identify when a banking or payment product or service is white labelled",sayfa:null,paragraf:4,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n mevcut beyaz etiketli \xFCr\xFCn s\xF6zle\u015Fmelerinin, EBA'n\u0131n vurgulad\u0131\u011F\u0131 \u015Feffafl\u0131k ve sorumluluk payla\u015F\u0131m\u0131 ilkeleriyle uyumlu olup olmad\u0131\u011F\u0131n\u0131n denetlenmesi gerekebilir.","T\xFCketici \u015Fikayet s\xFCre\xE7lerinin, beyaz etiketli \xFCr\xFCnler i\xE7in daha belirgin hale getirilmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["API entegrasyonlar\u0131 ve veri payla\u015F\u si."}],referanslar:[{metin:"EBA REPORT ON WHITE LABELLING",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T15:54:59+03:00",gonderilen_karakter:89535,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"eba-2026-11-09-61a683",kurum:"eba",baslik_orijinal:"The EBA streamlines the 2027 EU-wide stress test with more than 55% reduction in requested data",baslik_tr:"EBA, 2027 AB geneli stres testini talep edilen verilerde %55'ten fazla azaltarak sadele\u015Ftiriyor",url:"https://www.eba.europa.eu/publications-and-media/press-releases/eba-streamlines-2027-eu-wide-stress-test-more-55-reduction-requested-data",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"Orta",onem_gerekcesi:"Stres testi metodolojisindeki de\u011Fi\u015Fiklikler, bankan\u0131n raporlama y\xFCk\xFCn\xFC azaltacak olsa da, 2027 stres testi haz\u0131rl\u0131k s\xFCre\xE7lerinin ve veri setlerinin yeniden yap\u0131land\u0131r\u0131lmas\u0131n\u0131 gerektirmektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"EBA, 2027 stres testi i\xE7in metodolojiyi ve raporlama \u015Fablonlar\u0131n\u0131 yay\u0131nlayarak veri y\xFCk\xFCn\xFC %55 oran\u0131nda azaltm\u0131\u015F ve ilk kez iklim risklerini de\u011Ferlendirme mod\xFCl\xFCn\xFC dahil etmi\u015Ftir.",yayin_tarihi:"2026-11-09",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"285ed50c2bef10a2"}],alt_konular:["Stres Testi","Raporlama"],etkilenen_alanlar:["Kredi riski","Raporlama","Risk Y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, 2027 AB genelindeki stres testi i\xE7in veri noktalar\u0131n\u0131 %55 oran\u0131nda azaltarak raporlama y\xFCk\xFCn\xFC hafifletmeyi hedeflemektedir. Yeni metodoloji, kredi riski ba\u015Fta olmak \xFCzere denetim raporlamalar\u0131yla daha yak\u0131n bir uyum sa\u011Flamay\u0131 ama\xE7lamaktad\u0131r. Ayr\u0131ca, ilk kez fiziksel ve ge\xE7i\u015F iklim risklerini de\u011Ferlendiren \xF6zel bir mod\xFCl s\xFCrece dahil edilmi\u015Ftir. Bankam\u0131z\u0131n bu yeni \u015Fablonlara ve iklim risk mod\xFCl\xFCne uyum sa\u011Flamak i\xE7in i\xE7 veri sistemlerini g\xF6zden ge\xE7irmesi gerekecektir.",amac:{teyitli:[{hukum:"Stres testi \u015Fablonlar\u0131n\u0131n ve metodolojisinin basitle\u015Ftirilmesi, raporlama y\xFCk\xFCn\xFC azaltmay\u0131 ve veri kalitesini art\u0131rmay\u0131 ama\xE7lamaktad\u0131r.",alinti:"These changes will reduce operational burden and improve efficiency while preserving the robustness, risk-sensitivity and comparability of stress test results.",sayfa:null,paragraf:4,alinti_dogrulandi:!0}],olasi_etki:["Veri noktalar\u0131ndaki %55'lik azalma, bankan\u0131n stres testi haz\u0131rl\u0131k s\xFCre\xE7lerinde operasyonel verimlilik sa\u011Flayabilir.","\u0130klim riski mod\xFCl\xFCn\xFCn eklenmesi, bankan\u0131n iklim riskine y\xF6nelik veri toplama ve modelleme kapasitesini art\u0131rmas\u0131n\u0131 zorunlu k\u0131labilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["\xD6nceki stres testlerinde kullan\u0131lan daha karma\u015F\u0131k ve geni\u015F kapsaml\u0131 veri setleri, 2027 itibar\u0131yla yerini denetim raporlamas\u0131yla uyumlu daha sade bir yap\u0131ya b\u0131rakacakt\u0131r."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n mevcut stres testi veri toplama altyap\u0131s\u0131n\u0131n, yeni \u015Fablonlara ve denetim raporlama kavramlar\u0131na g\xF6re g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Stres testi haz\u0131rl\u0131k s\xFCrecinde operasyonel y\xFCk\xFCn azalmas\u0131 beklenmektedir; ancak iklim riski mod\xFCl\xFC i\xE7in yeni veri giri\u015Fleri gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Stres testi sonu\xE7lar\u0131n\u0131n sermaye yeterlili\u011Fi \xFCzerindeki etkisi, yeni metodoloji ile daha \u015Feffaf ve kar\u015F\u0131la\u015Ft\u0131r\u0131labilir hale gelebilir."]},iklim:{teyitli:[{hukum:"2027 stres testi, fiziksel ve ge\xE7i\u015F iklim risklerini de\u011Ferlendiren \xF6zel bir mod\xFCl i\xE7erecektir.",alinti:"For the first time, physical and transition climate risks will be assessed through a dedicated module, without affecting the core stress test results.",sayfa:null,paragraf:7,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n iklim riskine maruziyetini \xF6l\xE7mek i\xE7in yeni veri toplama s\xFCre\xE7leri geli\u015Ftirmesi gerekebilir."],ilgili_degil:!1},degisiklikler:[{konu:"Stres testi veri gereksinimleri",onceki:"Daha y\xFCksek say\u0131da veri noktas\u0131 i\xE7eren karma\u015F\u0131k \u015Fablonlar.",yeni:"Veri noktalar\u0131nda %55 azalma ve denetim raporlamas\u0131yla daha yak\u0131n uyum.",referans:"Sayfa 1, P4"}],parametre_etkisi:{PD:{duzey:"Orta",not:"Kredi riski \u015Fablonlar\u0131n\u0131n denetim raporlamas\u0131yla uyumla\u015Ft\u0131r\u0131lmas\u0131, PD tahminlerinde kullan\u0131lan veri setlerini etkileyebilir."},LGD:{duzey:"Orta",not:"Kredi riski metodolojisindeki sadele\u015Fme, LGD hesaplamalar\u0131nda kullan\u0131lan veri giri\u015Flerini etkileyebilir."},EAD:{duzey:"Orta",not:"Raporlama \u015Fablonlar\u0131ndaki de\u011Fi\u015Fiklikler EAD hesaplamalar\u0131n\u0131 do\u011Frudan etkileyecektir."},ECL:{duzey:"Orta",not:"Stres testi sonu\xE7lar\u0131n\u0131n TFRS 9 beklentileriyle uyumu, metodolojik de\u011Fi\u015Fikliklerden etkilenecektir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 1, P4"},{tur:"Yay\u0131n",tarih:"2026-11-09",referans:"Sayfa 1, P3"}],gozden_gecirilecekler:[{baslik:"\u0130klim Riski Mod\xFCl\xFC",aciklama:"Fiziksel ve ge\xE7i\u015F risklerini de\u011Ferlendirmek i\xE7in gerekli veri altyap\u0131s\u0131n\u0131n kurulmas\u0131."},{baslik:"Stres Testi \u015Eablonlar\u0131",aciklama:"Yeni yay\u0131nlanan \u015Fablonlar\u0131n ve rehberli\u011Fin banka i\xE7i raporlama sistemlerine entegrasyonu."}],referanslar:[{metin:
