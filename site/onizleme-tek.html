T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"bf3fc60e8c147c15"}],alt_konular:["FINREP","IFRS 18","Denetleyici Raporlama"],etkilenen_alanlar:["Raporlama","Muhasebe","Bilgi Teknolojileri"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, denetleyici raporlamay\u0131 sadele\u015Ftirme ve IFRS 18 ge\xE7i\u015F s\xFCrecini y\xF6netme amac\u0131yla raporlama takvimlerini g\xFCncellemi\u015Ftir. IFRS 18'in 1 Ocak 2027'de y\xFCr\xFCrl\xFC\u011Fe girmesiyle, denetleyici raporlama (FINREP) ile uyum sa\u011Flamak i\xE7in ge\xE7ici bir opsiyonel raporlama d\xF6nemi tan\u0131mlanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n, IFRS 18 uyumlu FINREP \u015Fablonlar\u0131na ge\xE7i\u015F stratejisini belirlemesi ve yeni raporlama takvimine g\xF6re sistemlerini g\xFCncellemesi gerekmektedir.",amac:{teyitli:[{hukum:"IFRS 18'in finansal tablolara uygulanmas\u0131 ile denetleyici raporlama aras\u0131ndaki uyumsuzluklar\u0131n giderilmesi ve raporlama y\xFCk\xFCn\xFCn azalt\u0131lmas\u0131.",alinti:"This Opinion aims to contribute to the reduction of any potential burdens for relevant institutions, who would otherwise have to incur costs from the discrepancies",sayfa:3,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["IFRS 18'e ge\xE7i\u015F s\xFCrecinde d\u0131\u015F raporlama ile denetleyici raporlama aras\u0131nda olu\u015Fabilecek uyumsuzluklar, bankan\u0131n operasyonel maliyetlerini art\u0131rabilir.","Yeni raporlama \u015Fablonlar\u0131n\u0131n kullan\u0131m\u0131, bankan\u0131n veri ambar\u0131 ve raporlama yaz\u0131l\u0131mlar\u0131nda g\xFCncelleme gerektirebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Yeni veri noktas\u0131 modeli (DPM) ve XBRL taksonomilerinin 2026 sonuna kadar sisteme entegre edilmesi gerekebilir.","IFRS 18 uyumlu FINREP \u015Fablonlar\u0131n\u0131n (F 02.01, F 16.01.1 vb.) test s\xFCre\xE7lerinin ba\u015Flat\u0131lmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Bankan\u0131n IFRS 18 ge\xE7i\u015Fi i\xE7in opsiyonel raporlama y\xF6ntemini se\xE7ip se\xE7meyece\u011Fine dair karar vermesi ve bunu yetkili otoriteye bildirmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Raporlama sadele\u015Ftirmeleri, dolayl\u0131 olarak raporlama maliyetlerinde azalma sa\u011Flayabilir."]},iklim:{teyitli:[],olasi_etki:["ESG raporlama gereksinimlerinin sadele\u015Ftirilmesi ve ertelenmesi, bankan\u0131n ESG veri toplama s\xFCre\xE7lerinde rahatlama sa\u011Flayabilir."],ilgili_degil:!1},degisiklikler:[{konu:"Raporlama Takvimi",onceki:"Mevcut raporlama takvimi",yeni:"Yeni gereksinimler i\xE7in ilk referans tarihi Aral\u0131k 2027, likidite ve ESG gibi alanlar Aral\u0131k 2028'e ertelenmi\u015Ftir.",referans:"Sayfa 2, P12"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u015Ftirmez."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},EAD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},ECL:{duzey:"D\xFC\u015F\xFCk",not:"IFRS 9 k\u0131yaslama raporlamas\u0131n\u0131n denetleyici \xE7er\xE7eveye entegrasyonu nedeniyle raporlama s\xFCre\xE7lerinde de\u011Fi\u015Fiklik olabilir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 2, P4"},{tur:"Yay\u0131n",tarih:"2026-11-06",referans:"Sayfa 1, P3"}],gozden_gecirilecekler:[{baslik:"IFRS 18 Ge\xE7i\u015F Stratejisi",aciklama:"Bankan\u0131n IFRS 18'e ge\xE7i\u015Fte denetleyici raporlama i\xE7in sunulan opsiyonel \u015Fablonlar\u0131 kullan\u0131p kullanmayaca\u011F\u0131n\u0131n de\u011Ferlendirilmesi."},{baslik:"Raporlama Takvimi G\xFCncellemesi",aciklama:"Ertelenen raporlama alanlar\u0131n\u0131n (likidite, ESG vb.) yeni takvime g\xF6re planlanmas\u0131."}],refe
