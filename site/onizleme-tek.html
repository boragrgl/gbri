,tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T13:46:13+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T13:46:13+03:00",icerik_hash:"9913f3fdf6bfdbdd"}],alt_konular:["Temerr\xFCt Tan\u0131m\u0131 (DoD)","Standart yakla\u015F\u0131m","Kredi riski"],etkilenen_alanlar:["Kredi riski","Raporlama","\u0130\xE7 kontrol"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, temerr\xFCt tan\u0131m\u0131 (DoD) rehberlerinin uygulanmas\u0131na ili\u015Fkin bir takip raporu yay\u0131mlam\u0131\u015Ft\u0131r. Rapor, AB genelinde denetimsel yak\u0131nsaman\u0131n y\xFCksek oldu\u011Funu ancak standart yakla\u015F\u0131m (SA) kullanan bankalar\u0131n denetiminde farkl\u0131l\u0131klar bulundu\u011Funu belirtmektedir. Bankam\u0131z\u0131n SA kullanmas\u0131 nedeniyle, denetleyici otoritelerin temerr\xFCt tan\u0131m\u0131 uyumunu izlemek i\xE7in daha resmi ve dok\xFCmante edilmi\u015F \xE7er\xE7eveler geli\u015Ftirmesi beklenmektedir.",amac:{teyitli:[],olasi_etki:["Denetleyici otoritelerin, standart yakla\u015F\u0131m kullanan bankalar i\xE7in temerr\xFCt tan\u0131m\u0131 uyumunu izlemek \xFCzere daha s\u0131k\u0131 ve dok\xFCmante edilmi\u015F denetim s\xFCre\xE7leri uygulamas\u0131 beklenebilir.","Bankan\u0131n temerr\xFCt tan\u0131m\u0131 ile ilgili i\xE7 politikalar\u0131n\u0131n ve IT sistemlerinin, EBA rehberleri ile tam uyumunun sa\u011Flanmas\u0131 i\xE7in ek denetimler gerekebilir.","EBA, temerr\xFCt tan\u0131m\u0131n\u0131n AB bankac\u0131l\u0131k sekt\xF6r\xFCnde tutarl\u0131 uygulanmas\u0131n\u0131 te\u015Fvik etmek amac\u0131yla rehberler yay\u0131mlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131 (DoD) ile ilgili IT sistemlerinin, \xF6zellikle 'g\xFCn baz\u0131nda gecikme' (DpD) ve '\xF6dememe olas\u0131l\u0131\u011F\u0131' (UTP) g\xF6s enleyici arbitraj \xFCzerindeki etkilerini analiz etmektedir. Bankan\u0131n do\u011Frudan bir DeFi faaliyeti olmasa da, stabilcoin ihra\xE7\xE7\u0131lar\u0131 ve CASP'lerle olan etkile\u015Fimler nedeniyle risk y\xF6netimi a\xE7\u0131s\u0131ndan \xF6nem arz etmektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"EBA, MiCA kapsam\u0131nda ihra\xE7 edilen EMT'lerin DeFi ekosistemindeki rol\xFCn\xFC, t\xFCketici koruma risklerini ve d\xFCzenleyici arbitraj potansiyelini analiz eden bir rapor yay\u0131nlam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-11-25",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"e462446e6243cf22"}],alt_konular:["DeFi","Stabilcoin (EMT)","D\xFCzenleyici Arbitraj","T\xFCketici Koruma"],etkilenen_alanlar:["Kredi riski","Operasyonel risk","Uyum","Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, stabilcoinlerin (EMT'ler dahil) DeFi ekosistemindeki rol\xFCn\xFC inceleyen bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. Rapor, DeFi'nin likidite ve teminat sa\u011Flama gibi kritik i\u015Flevlerine dikkat \xE7ekerken, t\xFCketici korumas\u0131, operasyonel riskler ve MiCA d\xFCzenlemelerinin etraf\u0131ndan dola\u015F\u0131lmas\u0131na y\xF6nelik arbitraj risklerini vurgulamaktad\u0131r. Bankalar i\xE7in, DeFi ile etkile\u015Fime giren CASP'ler ve stabilcoin ihra\xE7\xE7\u0131lar\u0131 \xFCzerinden dolayl\u0131 risk bula\u015Fma kanallar\u0131 olu\u015Fabilece\u011Fi belirtilmektedir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n stabilcoin ihra\xE7\xE7\u0131lar\u0131 veya DeFi protokollerine eri\u015Fim sa\u011Flayan CASP'lerle olan ili\u015Fkileri, operasyonel ve itibari riskler a\xE7\u0131s\u0131ndan yeniden de\u011Ferlendirilebilir.","DeFi \xFCzerinden sa\u011Flanan y\xFCksek kald\u0131ra\xE7l\u0131 pozisyonlar ve stabilcoin teminatl\u0131 krediler, bankan\u0131n kar\u015F\u0131 taraf risk y\xF6netimi s\xFCre\xE7lerini etkileyebilir.","EBA, EMT'lerin ve di\u011Fer se\xE7ilmi\u015F stabilcoinlerin DeFi'deki kullan\u0131m\u0131n\u0131 ve t\xFCketiciler ile denetleyiciler \xFCzerindeki etkilerini analiz eden bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["DeFi protokollerinde kullan\u0131lan stabilcoinlerin likidite yap\u0131s\u0131, bankan\u0131n bu varl\u0131klara olan maruziyetini etkileyebilir.","Ak\u0131ll\u0131 s\xF6zle\u015Fme a\xE7\u0131klar\u0131ndan kaynaklanan operasyonel riskler, bankan\u0131n teknolojik risk de\u011Ferlendirme modellerine dahil edilebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["CASP'ler arac\u0131l\u0131\u011F\u0131yla DeFi'ye eri\u015Fim sa\u011Flayan m\xFC\u015Fterilerin risk profilleri, bankan\u0131n M\xFC\u015Fterini Tan\u0131 (KYC) ve Kara Para Aklama (AML) s\xFCre\xE7lerinde daha detayl\u0131 izleme gerektirebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["DeFi ile ba\u011Flant\u0131l\u0131 risklerin artmas\u0131 durumunda, bankan\u0131n operasyonel risk sermaye gereksinimi \xFCzerinde dolayl\u0131 bir bask\u0131 olu\u015Fabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"DeFi protokollerindeki teminatl\u0131 kredilerin geri \xF6denmeme riski, dolayl\u0131 olarak kar\u015F\u0131 taraf\u0131n kredi de\u011Ferlili\u011Fini etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"DeFi'de teminat olarak kullan\u0131lan stabilcoinlerin de\u011Fer kayb\u0131 veya likidite sorunlar\u0131, teminat\u0131n geri kazan\u0131m oran\u0131n\u0131 etkileyebilir."},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"DeFi ekosistemindeki genel piyasa oynakl\u0131\u011F\u0131, bankan\u0131n stabilcoin ihra\xE7\xE7\u0131lar\u0131na olan maruziyetine ili\u015Fkin beklenen kredi zarar\u0131 hesaplamala ay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n ve pasif yat\u0131r\u0131m trendlerinin piyasa d\xF6ng\xFCselli\u011Fi ve \xF6zkaynak finansman\u0131 \xFCzerindeki finansal istikrar etkilerini de\u011Ferlendirmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"6467bf3615b350c8"}],alt_konular:["\xD6z sermaye ihrac\u0131","Pasif yat\u0131r\u0131m","Piyasa d\xF6ng\xFCselli\u011Fi"],etkilenen_alanlar:["Kredi riski","Piyasa riski","Hazine faaliyetleri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB raporu, \xF6zellikle yapay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n (IPO) ve \xF6z sermaye ihra\xE7lar\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerini incelemektedir. Pasif yat\u0131r\u0131m\u0131n artan rol\xFC, hisse senedi talebini daha inelastik hale getirerek ihra\xE7 hacimlerini art\u0131rmaktad\u0131r. Bu durum, piyasa d\xF6ng\xFCselli\u011Fini g\xFC\xE7lendirebilir ve ekonomik gerileme d\xF6nemlerinde \xF6z sermaye finansman\u0131n\u0131n kurumas\u0131 riskini do\u011Furabilir. Bankam\u0131z\u0131n piyasa riskleri ve sermaye piyasas\u0131 stratejileri a\xE7\u0131s\u0131ndan bu e\u011Filimlerin izlenmesi \xF6nerilmektedir.",amac:{teyitli:[],olasi_etki:["Piyasa duyarl\u0131l\u0131\u011F\u0131ndaki de\u011Fi\u015Fimlerin, bankan\u0131n \xF6z sermaye piyasalar\u0131ndaki yat\u0131r\u0131m portf\xF6y\xFC \xFCzerinde oynakl\u0131\u011F\u0131 art\u0131rabilece\u011Fi de\u011Ferlendirilmektedir.","Pasif yat\u0131r\u0131m\u0131n artan etkisi nedeniyle, piyasa likiditesinin stres d\xF6nemlerinde beklenenden daha h\u0131zl\u0131 daralabilece\u011Fi \xF6ng\xF6r\xFClebilir.","B\xFCy\xFCk halka arzlar\u0131n ve genel olarak \xF6z sermaye ihrac\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerinin de\u011Ferlendirilmesi. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Pasif yat\u0131r\u0131m\u0131n inelastik talebi, hisse senedi fiyatlar\u0131n\u0131n temel g\xF6stergelerden kopmas\u0131na ve fiyat ke\u015Ffi s\xFCre\xE7lerinin zay\u0131flamas\u0131na neden olabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Halka arzlara kat\u0131l\u0131m veya bu piyasalardaki pozisyon y\xF6netimi s\xFCre\xE7lerinde, pasif yat\u0131r\u0131mc\u0131 ak\u0131\u015Flar\u0131n\u0131n piyasa \xFCzerindeki etkisinin daha yak\u0131ndan izlenmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan \xF6z sermaye pozisyonlar\u0131n\u0131n de\u011Ferlemesindeki oynakl\u0131k, sermaye yeterlilik rasyolar\u0131 \xFCzerinde k\u0131sa vadeli dalgalanmalara yol a\xE7abilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"\xD6z sermaye finansman\u0131n\u0131n d\xF6ng\xFCselli\u011Fi, ekonomik gerileme d\xF6nemlerinde firmalar\u0131n sermaye art\u0131rma kapasitesini etkileyerek dolayl\u0131 olarak kredi riskini art\u0131rabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Piyasa oynakl\u0131\u011F\u0131n\u0131n artmas\u0131, \xF6z sermaye bazl\u0131 varl\u0131klar\u0131n de\u011Ferlemesinde ve dolay\u0131s\u0131yla TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 hesaplamalar\u0131nda dolayl\u0131 etki yaratabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-18",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Piyasa Duyarl\u0131l\u0131\u011F\u0131 ve \xD6z Sermaye \u0130hrac\u0131",aciklama:"\xD6z sermaye ihra\xE7lar\u0131ndaki d\xF6ng\xFCsel zirvelerin, piyasa d\xFCzeltmelerine \xF6nc\xFC bir g\xF6sterge olup olmad\u0131\u011F\u0131n\u0131n izlenmesi."},{baslik:"Pasif Yat\u0131r\u0131m Etkisi",aciklama:"Pasif yat\u0131r\u0131mc\u0131lar\u0131n inelastik talebi \u0131n\u0131n finansal istikrar \xFCzerindeki etkileri, risk y\xF6netimi modellerinde izlenmeye devam edebilir."],ilgili_degil:!1},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Ekonomik b\xFCy\xFCmedeki yava\u015Flama ve enerji fiyatlar\u0131, hanehalk\u0131 ve firmalar\u0131n bor\xE7 \xF6deme kapasitesini etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"Yapay zeka sekt\xF6r\xFC teminatlar\u0131n\u0131n de\u011Ferlemesindeki oynakl\u0131k, teminat de\u011Ferlerini etkileyebilir."},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Makroekonomik g\xF6r\xFCn\xFCmdeki bozulma, TFRS 9 kapsam\u0131nda ileriye d\xF6n\xFCk beklentileri etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-18",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Sekt\xF6rel Kredi Yo\u011Funla\u015Fmas\u0131",aciklama:"Yapay zeka altyap\u0131s\u0131na y\xF6nelik bor\xE7 finansman\u0131 sa\u011Flanan sekt\xF6rlerdeki risk yo\u011Funla\u015Fmas\u0131n\u0131n g\xF6zden ge\xE7irilmesi."},{baslik:"Stres Testi Senaryolar\u0131",aciklama:"Jeoekonomik gerilimlerin ve enerji fiyat \u015Foklar\u0131n\u0131n banka bilan\xE7osu \xFCzerindeki etkilerinin sim\xFCle edilmesi."}],referanslar:[{metin:"Financial stability",sayfa:1,paragraf:16}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T15:44:02+03:00",gonderilen_karakter:3739,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"ecb-2026-11-18-a9309c",kurum:"ecb",baslik_orijinal:"Financial Stability Review, November 2026",baslik_tr:"Finansal \u0130stikrar Raporu, Kas\u0131m 2026",url:"https://www.ecb.europa.eu//press/financial-stability-publications/fsr/html/ecb.fsr202611~e03b919d36.en.html",belge_turu:"Rapor",statu:"Nihai",onem:"Y\xFCksek",onem_gerekcesi:"Rapor, bankac\u0131l\u0131k sekt\xF6r\xFCn\xFC do\u011Frudan etkileyen makro-finansal riskleri, yapay zeka kaynakl\u0131 piyasa oynakl\u0131\u011F\u0131n\u0131 ve egemen bor\xE7 risklerini detayland\u0131rmaktad\u0131r. Kamu sermayeli bir banka i\xE7in bu risklerin kredi riski ve sermaye yeterlili\u011Fi \xFCzerindeki etkileri kritiktir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, yapay zeka kaynakl\u0131 riskler, kamu bor\xE7lulu\u011Fu ve jeopolitik gerilimlerin finansal istikrar \xFCzerindeki etkilerini analiz ederek bankac\u0131l\u0131k sekt\xF6r\xFC i\xE7in potansiyel kredi riski ve yay\u0131lma etkilerine dikkat \xE7ekmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"460c49a6c0cfdaaa"}],alt_konular:["Kredi riski","Piyasa riski","Operasyonel risk","Sermaye yeterlili\u011Fi"],etkilenen_alanlar:["Kredi riski","Hazine ve piyasa i\u015Flemleri","Operasyonel risk y\xF6netimi","Sermaye planlamas\u0131"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB'nin Kas\u0131m 2026 Finansal \u0130stikrar Raporu, yapay zeka (AI) yat\u0131r\u0131mlar\u0131na dayal\u0131 piyasa de\u011Ferlemeleri, artan egemen bor\xE7 y\xFCk\xFC ve jeopolitik gerilimlerin finansal istikrar \xFCzerindeki bask\u0131lar\u0131n\u0131 vurgulamaktad\u0131r. Bankalar genel olarak diren\xE7li olsa da, AI ba\u011Flant\u0131l\u0131 varl\u0131klardaki olas\u0131 bir d\xFCzeltmenin banka-d\u0131\u015F\u0131 finansal kurulu\u015Flar \xFCzerinden bankalara s\u0131\xE7rama riski bulunmaktad\u0131r. Ayr\u0131ca, enerji arz\u0131 kesintileri ve y\xFCksek faiz ortam\u0131, kredi kalitesinde bozulma potansiyeli ta\u015F\u0131maktad\u0131r. Bankalar\u0131n sermaye ve likidite tamponlar\u0131n\u0131 korumalar\u0131, makro-ihtiyati politikalar\u0131n temel \xF6nceli\u011Fi olarak belirlenmi\u015Ftir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n kredi portf\xF6y\xFCnde enerji yo\u011Fun sekt\xF6rlere y\xF6nelik risklerin artmas\u0131 beklenebilir.","Yapay zeka teknolojilerine ba\u011F\u0131ml\u0131 firmalara verilen kredilerde teminat yap\u0131s\u0131n\u0131n zay\u0131fl\u0131\u011F\u0131 nedeniyle risk art\u0131\u015F\u0131 g\xF6r\xFClebilir.","Sovereign (egemen) bor\xE7 piyasalar\u0131ndaki oynakl\u0131k, bankan\u0131n elindeki devlet tahvili portf\xF6y\xFCn\xFCn de\u011Ferlemesini olumsuz etkileyebilir.","Rapor, sistemik risklerin fark\u0131ndal\u0131\u011F\u0131n\u0131 art\u0131rmay\u0131 ve finansal istikrar\u0131 te\u015Fvik etmeyi ama\xE7lamaktad\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 (ECL) modellerinde, jeopolitik riskler ve enerji fiyat \u015Foklar\u0131 nedeniyle ileriye d\xF6n\xFCk senaryolar\u0131n g\xFCncellenmesi gerekebilir.","Siber risklerin artmas\u0131, operasyonel risk sermaye hesaplamalar\u0131nda daha y\xFCksek stres testi senaryolar\u0131n\u0131 zorunlu k\u0131labilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["\xDC\xE7\xFCnc\xFC taraf ICT sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131\u011F\u0131n g\xF6zden ge\xE7irilmesi ve siber g\xFCvenlik protokollerinin s\u0131k\u0131la\u015Ft\u0131r\u0131lmas\u0131 gerekebilir.","Dijital bankac\u0131l\u0131k kanallar\u0131nda yapay zeka kullan\u0131m\u0131 nedeniyle artan siber sald\u0131r\u0131 risklerine kar\u015F\u0131 savunma mekanizmalar\u0131 g\xFC\xE7lendirilmelidir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan varl\u0131klar\u0131n de\u011Ferlemesindeki oynakl\u0131k, RWA hesaplamalar\u0131nda art\u0131\u015Fa neden olabilir."]},iklim:{teyitli:[],olasi_etki:["A\u015F\u0131r\u0131 hava olaylar\u0131n\u0131n fiziksel riskleri, kredi portf\xF6y\xFCndeki tar\u0131m ve enerji sekt\xF6rlerini do\u011Frudan etkileyebilir."],ilgili_degil:!1},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Y\xFCksek",not:"Enerji yo\u011Fun sekt\xF6rlerdeki firmalar\u0131n bor\xE7 \xF6deme kapasitesindeki d\xFC\u015F\xFC\u015F, temerr\xFCt eknolojilerindeki h\u0131zl\u0131 ilerleme, siber tehdit ortam\u0131n\u0131 k\xF6kten de\u011Fi\u015Ftirerek sald\u0131rganlar\u0131n yeteneklerini art\u0131rmaktad\u0131r. Bankalar, YZ destekli sald\u0131r\u0131lar\u0131n h\u0131z\u0131 ve sofistike yap\u0131s\u0131 kar\u015F\u0131s\u0131nda yap\u0131sal bir dezavantajla kar\u015F\u0131 kar\u015F\u0131yad\u0131r. Kamu bankas\u0131 olarak, \xFC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131 ve YZ modellerine eri\u015Fimdeki asimetriler, sistemik riskleri art\u0131rmaktad\u0131r. Bankan\u0131n siber savunma stratejilerini, 'varsay\u0131lan ihlal' (assumed compromise) prensibiyle yeniden g\xF6zden ge\xE7irmesi ve operasyonel dayan\u0131kl\u0131l\u0131\u011F\u0131 art\u0131rmas\u0131 gerekmektedir.",amac:{teyitli:[{hukum:"Yapay zeka modellerinin siber yeteneklerinin h\u0131zla geli\u015Fmesi, siber risklerin artmas\u0131na katk\u0131da bulunmaktad\u0131r.",alinti:"Rapid advances in the cyber capabilities of AI models are contributing to heightened cyber risks.",sayfa:null,paragraf:100,alinti_dogrulandi:!0}],olasi_etki:["YZ destekli sald\u0131r\u0131lar\u0131n artmas\u0131, bankan\u0131n mevcut siber g\xFCvenlik b\xFCt\xE7esinin ve personel kapasitesinin yetersiz kalmas\u0131na yol a\xE7abilir.","\xDC\xE7\xFCnc\xFC taraf hizmet sa\u011Flay\u0131c\u0131lar\u0131na olan yo\u011Fun ba\u011F\u0131ml\u0131l\u0131k, tek bir noktadan kaynaklanan sistemik bir kesintiye neden olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n kulland\u0131\u011F\u0131 YZ modellerinin 'prompt injection' gibi yeni sald\u0131r\u0131 t\xFCrlerine kar\u015F\u0131 savunmas\u0131z kalmas\u0131 muhtemeldir.","Yama y\xF6netimi (patch management) s\xFCre\xE7lerinin, YZ destekli h\u0131zl\u0131 sald\u0131r\u0131lar kar\u015F\u0131s\u0131nda daha s\u0131k\u0131 ve otomatikle\u015Ftirilmi\u015F hale getirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Bankan\u0131n i\xE7 s\xFCre\xE7lerinde kullan\u0131lan YZ ajanlar\u0131n\u0131n, insan denetimi d\u0131\u015F\u0131nda beklenmedik eylemler ger\xE7ekle\u015Ftirmesi operasyonel riskleri art\u0131rabilir.","Siber savunma s\xFCre\xE7lerinin, YZ'nin h\u0131z\u0131yla uyumlu hale getirilmesi i\xE7in karar alma mekanizmalar\u0131n\u0131n h\u0131zland\u0131r\u0131lmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk sermaye gereksinimlerinin, siber risklerin artmas\u0131yla birlikte y\xFCkselmesi beklenebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Siber Tehdit Ortam\u0131",onceki:"Otomatik sald\u0131r\u0131lar (self-propagating malware) s\u0131n\u0131rl\u0131yd\u0131.",yeni:"Agentic AI (ajan tabanl\u0131 YZ) ile sald\u0131r\u0131lar\u0131n \xF6l\xE7e\u011Fi, h\u0131z\u0131 ve sofistike yap\u0131s\u0131 artm\u0131\u015Ft\u0131r.",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Y\xFCksek",not:"Siber sald\u0131r\u0131lar\u0131n ba\u015Far\u0131l\u0131 olma olas\u0131l\u0131\u011F\u0131, YZ ara\xE7lar\u0131n\u0131n d\xFC\u015F\xFCk maliyetle eri\u015Filebilir olmas\u0131 nedeniyle artmaktad\u0131r."},LGD:{duzey:"Y\xFCksek",not:"Sistemik bir siber olay durumunda, operasyonel kesintilerin finansal kay\u0131plar\u0131 ve itibar maliyeti ciddi d\xFCzeyde olabilir."},EAD:{duzey:"Etki beklenmiyor",not:"Bu d\xFCzenleme do\u011Frudan kredi riski maruziyetini etkilememektedir."},ECL:{duzey:"Orta",not:"Operasyonel risk kaynakl\u0131 kay\u0131plar\u0131n TFRS 9 kapsam\u0131nda kar\u015F\u0131l\u0131k hesaplamalar\u0131na dolayl\u0131 etkisi olabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-16",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Siber Savunma Stratejisi",aciklama:"Savunma derinli\u011Fi (defence-in-depth) ve varsay\u0131lan ihlal (assumed compromise) prensiplerinin uygulanmas\u0131."},{baslik:"\xDC\xE7\xFCnc\xFC Taraf Risk Y\xF6netimi",aciklama:"Kritik ICT sa\u011Flay\u0131c\u0131lar\ orus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, denetleyici raporlamay\u0131 sadele\u015Ftirme ve IFRS 18 ge\xE7i\u015F s\xFCrecini y\xF6netme amac\u0131yla raporlama takvimlerini g\xFCncellemi\u015Ftir. IFRS 18'in 1 Ocak 2027'de y\xFCr\xFCrl\xFC\u011Fe girmesiyle, denetleyici raporlama (FINREP) ile uyum sa\u011Flamak i\xE7in ge\xE7ici bir opsiyonel raporlama d\xF6nemi tan\u0131mlanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n, IFRS 18 uyumlu FINREP \u015Fablonlar\u0131na ge\xE7i\u015F stratejisini belirlemesi ve yeni raporlama takvimine g\xF6re sistemlerini g\xFCncellemesi gerekmektedir.",amac:{teyitli:[{hukum:"IFRS 18'in finansal tablolara uygulanmas\u0131 ile denetleyici raporlama aras\u0131ndaki uyumsuzluklar\u0131n giderilmesi ve raporlama y\xFCk\xFCn\xFCn azalt\u0131lmas\u0131.",alinti:"This Opinion aims to contribute to the reduction of any potential burdens for relevant institutions, who would otherwise have to incur costs from the discrepancies",sayfa:3,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["IFRS 18'e ge\xE7i\u015F s\xFCrecinde d\u0131\u015F raporlama ile denetleyici raporlama aras\u0131nda olu\u015Fabilecek uyumsuzluklar, bankan\u0131n operasyonel maliyetlerini art\u0131rabilir.","Yeni raporlama \u015Fablonlar\u0131n\u0131n kullan\u0131m\u0131, bankan\u0131n veri ambar\u0131 ve raporlama yaz\u0131l\u0131mlar\u0131nda g\xFCncelleme gerektirebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Yeni veri noktas\u0131 modeli (DPM) ve XBRL taksonomilerinin 2026 sonuna kadar sisteme entegre edilmesi gerekebilir.","IFRS 18 uyumlu FINREP \u015Fablonlar\u0131n\u0131n (F 02.01, F 16.01.1 vb.) test s\xFCre\xE7lerinin ba\u015Flat\u0131lmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Bankan\u0131n IFRS 18 ge\xE7i\u015Fi i\xE7in opsiyonel raporlama y\xF6ntemini se\xE7ip se\xE7meyece\u011Fine dair karar vermesi ve bunu yetkili otoriteye bildirmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Raporlama sadele\u015Ftirmeleri, dolayl\u0131 olarak raporlama maliyetlerinde azalma sa\u011Flayabilir."]},iklim:{teyitli:[],olasi_etki:["ESG raporlama gereksinimlerinin sadele\u015Ftirilmesi ve ertelenmesi, bankan\u0131n ESG veri toplama s\xFCre\xE7lerinde rahatlama sa\u011Flayabilir."],ilgili_degil:!1},degisiklikler:[{konu:"Raporlama Takvimi",onceki:"Mevcut raporlama takvimi",yeni:"Yeni gereksinimler i\xE7in ilk referans tarihi Aral\u0131k 2027, likidite ve ESG gibi alanlar Aral\u0131k 2028'e ertelenmi\u015Ftir.",referans:"Sayfa 2, P12"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u015Ftirmez."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},EAD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},ECL:{duzey:"D\xFC\u015F\xFCk",not:"IFRS 9 k\u0131yaslama raporlamas\u0131n\u0131n denetleyici \xE7er\xE7eveye entegrasyonu nedeniyle raporlama s\xFCre\xE7lerinde de\u011Fi\u015Fiklik olabilir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 2, P4"},{tur:"Yay\u0131n",tarih:"2026-11-06",referans:"Sayfa 1, P3"}],gozden_gecirilecekler:[{baslik:"IFRS 18 Ge\xE7i\u015F Stratejisi",aciklama:"Bankan\u0131n IFRS 18'e ge\xE7i\u015Fte denetleyici raporlama i\xE7in sunulan opsiyonel \u015Fablonlar\u0131 kullan\u0131p kullanmayaca\u011F\u0131n\u0131n de\u011Ferlendirilmesi."},{baslik:"Raporlama Takvimi G\xFCncellemesi",aciklama:"Ertelenen raporlama alanlar\u0131n\u0131n (likidite, ESG vb.) yeni takvime g\xF6re planlanmas\u0131."}],referanslar:[{metin:"Opinion on the implementation of IFRS 18 \u2013 FINREP \u2013 Interim period",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T15:58:25+03:00",gonderilen_karakter:18827,alinti_dogrulanan:1,alinti_ 6/11/pir-ifrs-16-concludes-identifies-targeted-improvements/",belge_turu:"Rapor",statu:"Nihai",onem:"Orta",onem_gerekcesi:"IFRS 16, bankan\u0131n finansal tablolar\u0131nda kiralama i\u015Flemlerinin raporlanmas\u0131 a\xE7\u0131s\u0131ndan temel bir standartt\u0131r. Yap\u0131lacak iyile\u015Ftirmeler operasyonel maliyetleri ve raporlama s\xFCre\xE7lerini do\u011Frudan etkileyecektir.",konu:"TFRS 9",ozet_tek_satir:"IASB, IFRS 16 standard\u0131n\u0131n genel olarak ama\xE7land\u0131\u011F\u0131 gibi \xE7al\u0131\u015Ft\u0131\u011F\u0131n\u0131 ancak operasyonel maliyetlerin azalt\u0131lmas\u0131 ve nakit ak\u0131\u015F\u0131 \u015Feffafl\u0131\u011F\u0131n\u0131n art\u0131r\u0131lmas\u0131 i\xE7in hedeflenen iyile\u015Ftirmelere ihtiya\xE7 duyuldu\u011Funu a\xE7\u0131klam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-11-01",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"75852e472f179c8f"}],alt_konular:["IFRS 16 Kiralama \u0130\u015Flemleri","Finansal Raporlama"],etkilenen_alanlar:["Finansal Raporlama","Operasyonel Maliyetler","Nakit Ak\u0131\u015F Tablosu"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"IASB, IFRS 16 Kiralama Standard\u0131'na ili\u015Fkin uygulama sonras\u0131 incelemesini tamamlam\u0131\u015Ft\u0131r. Standart genel olarak ba\u015Far\u0131l\u0131 bulunsa da, operasyonel maliyetlerin azalt\u0131lmas\u0131 ve nakit ak\u0131\u015F bilgilerinin \u015Feffafl\u0131\u011F\u0131n\u0131n art\u0131r\u0131lmas\u0131 i\xE7in hedeflenmi\u015F iyile\u015Ftirmeler yap\u0131lmas\u0131na karar verilmi\u015Ftir. Banka, kiralama i\u015Flemlerine ili\u015Fkin raporlama s\xFCre\xE7lerini ve gelecekteki olas\u0131 standart de\u011Fi\u015Fikliklerini takip etmelidir.",amac:{teyitli:[{hukum:"IASB, IFRS 16'n\u0131n genel olarak ama\xE7land\u0131\u011F\u0131 gibi \xE7al\u0131\u015Ft\u0131\u011F\u0131n\u0131 ancak hedef
