iew-mica",belge_turu:"Bas\u0131n duyurusu",statu:"\u0130sti\u015Fare",onem:"Orta",onem_gerekcesi:"D\xFCzenleme, kripto varl\u0131k piyasalar\u0131 i\xE7in MiCA \xE7er\xE7evesinin g\xF6zden ge\xE7irilmesine y\xF6nelik EBA tavsiyelerini i\xE7ermektedir. Banka do\u011Frudan kripto varl\u0131k ihra\xE7\xE7\u0131s\u0131 olmasa da, bu d\xFCzenlemeler bankac\u0131l\u0131k sekt\xF6r\xFC ile kripto varl\u0131klar aras\u0131ndaki etkile\u015Fimi ve gelecekteki uyum gerekliliklerini \u015Fekillendirecektir.",konu:"TFRS 9",ozet_tek_satir:"EBA, Avrupa Komisyonu'nun MiCA d\xFCzenlemesine ili\u015Fkin isti\u015Faresine verdi\u011Fi yan\u0131tta; kripto varl\u0131k ihra\xE7\xE7\u0131lar\u0131, stabil coinler ve kripto varl\u0131k kredilendirme faaliyetlerine y\xF6nelik d\xFCzenleyici \xE7er\xE7evenin g\xFC\xE7lendirilmesini \xF6nermektedir.",yayin_tarihi:"2026-09-24",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"6c1c2cb4fd2e9fd7"}],alt_konular:["Kripto varl\u0131klar","Stablecoin","Tokenize mevduat","DeFi"],etkilenen_alanlar:["Kredi riski","Raporlama","Sermaye yeterlili\u011Fi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, MiCA d\xFCzenlemesinin g\xF6zden ge\xE7irilmesi kapsam\u0131nda Avrupa Komisyonu'na sundu\u011Fu yan\u0131tta, \xF6zellikle \xE7oklu ihra\xE7\xE7\u0131 stablecoin modelleri, DeFi ve tokenize mevduat alanlar\u0131nda d\xFCzenleyici netlik \xE7a\u011Fr\u0131s\u0131nda bulunmaktad\u0131r. Bankalar i\xE7in tokenize mevduatlar\u0131n s\u0131n\u0131fland\u0131r\u0131lmas\u0131 ve bankac\u0131l\u0131k sekt\xF6r\xFC ile kripto varl\u0131klar aras\u0131ndaki risk etkile\u015Fimleri kritik \xF6neme sahiptir. EBA, tokenize finansal ara\xE7lar\u0131n MiCA kapsam\u0131 d\u0131\u015F\u0131nda tutulmas\u0131n\u0131 ve mevcut sekt\xF6rel mevzuata tabi olmas\u0131n\u0131 \xF6nermektedir.",amac:{teyitli:[{hukum:"MiCA d\xFCzenlemesinin g\xF6zden ge\xE7irilmesi i\xE7in \xF6nceliklerin belirlenmesi.",alinti:"The EBA recommends the European Commission prioritise specific issues in its review of MiCA.",sayfa:null,paragraf:7,alinti_dogrulandi:!0}],olasi_etki:["Bankalar\u0131n tokenize mevduat \xFCr\xFCnleri geli\u015Ftirmesi durumunda, d\xFCzenleyici belirsizliklerin giderilmesiyle operasyonel s\xFCre\xE7ler kolayla\u015Fabilir.","Stablecoin ihra\xE7\xE7\u0131lar\u0131 ile bankalar aras\u0131ndaki likidite ve rezerv ili\u015Fkileri, gelecekte daha s\u0131k\u0131 denetimlere tabi olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Tokenize mevduatlar\u0131n tan\u0131mlanmas\u0131 i\xE7in CRD/CRR kapsam\u0131nda uyum \xE7al\u0131\u015Fmalar\u0131 gerekebilir.","Kripto varl\u0131k bor\xE7 verme faaliyetlerinin d\xFCzenlenmesi, bankalar\u0131n bu alandaki risk y\xF6netimi politikalar\u0131n\u0131 g\xFCncellemelerini gerektirebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Raporlama \xE7er\xE7evesinin geni\u015Fletilmesi, bankalar\u0131n kripto varl\u0131k hizmet sa\u011Flay\u0131c\u0131lar\u0131 ile olan veri ak\u0131\u015Flar\u0131n\u0131 yeniden yap\u0131land\u0131rmas\u0131n\u0131 gerektirebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Risk bazl\u0131 sermaye hesaplamalar\u0131nda kripto varl\u0131k maruziyetleri i\xE7in yeni a\u011F\u0131rl\u0131kland\u0131rmalar g\xFCndeme gelebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Tokenize finansal ara\xE7lar",onceki:"MiCA kapsam\u0131 belirsizli\u011Fi",yeni:"MiFID/MiFIR kapsam\u0131nda kalmas\u0131 \xF6nerisi",referans:"Sayfa 5"}],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Kripto varl\u0131k bor\xE7 verme faaliyetlerinin d\xFCzenlenmesi, kredi riski modellerinde yeni parametrelerin tan\u0131mlanmas\u0131n\u0131 gerektirebilir."},LGD:{duzey:"Dolayl\u0131",not:"Tokenize varl\u0131klar\u0131n teminat olarak kabul edilebilirli\u011Fi netle\u015Fti\u011Finde LGD hesaplamalar\u0131 etkilenebilir."},EAD:{duzey:"Dolayl\u0131",not:"Tokenize mevduatlar\u0131n bilan\xE7o i\xE7i/d\u0131\u015F\u0131 s\u0131n\u0131fland\u0131rmas\u0131 EAD hesaplamalar\u0131n\u0131 etkileyebilir."},ECL:{duzey:"Dolayl\u0131",not:"TFRS 9 kapsam\u0131nda tokenize varl\u0131klar\u0131n de\u011Ferlemesi ve kredi riski kar\u015F\u0131l\u0131klar\u0131, d\xFCzenleyici s\u0131n\u0131fland\u0131rmaya g\xF6re de\u011Fi\u015Febilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-24",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Tokenize Mevduat S\u0131n\u0131fland\u0131rmas\u0131",aciklama:"Banka, tokenize mevduat \xFCr\xFCnlerinin CRD/CRR ve MiCA s\u0131n\u0131r\u0131ndaki yerini takip etmelidir."}],referanslar:[{metin:"EBA RESPONSE TO THE EC TARGETED CONSULTATION ON THE REVIEW OF MICA",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:00:51+03:00",gonderilen_karakter:122241,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"eba-2026-09-23-30c6d7",kurum:"eba",baslik_orijinal:"ESAs call for vigilance over external dependencies, cyber threats and private credit risks",baslik_tr:"Avrupa Denetim Otoriteleri d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, siber tehditler ve \xF6zel kredi risklerine kar\u015F\u0131 dikkatli olunmas\u0131 \xE7a\u011Fr\u0131s\u0131nda bulundu",url:"https://www.eba.europa.eu/publications-and-media/press-releases/esas-call-vigilance-over-external-dependencies-cyber-threats-and-private-credit-risks",belge_turu:"Bas\u0131n duyurusu",statu:"Bilgi ama\xE7l\u0131",onem:"Orta",onem_gerekcesi:"Kamu bankas\u0131 olarak do\u011Frudan \u0130RD kullanmasa da, operasyonel risk y\xF6netimi, siber g\xFCvenlik ve \xFC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131 (ICT) bankan\u0131n risk profili i\xE7in kritik \xF6neme sahiptir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Avrupa Denetim Otoriteleri, 2026 sonbahar risk g\xFCncellemesinde AB finansal sistemi i\xE7in d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, siber tehditler ve \xF6zel kredi piyasalar\u0131ndaki h\u0131zl\u0131 b\xFCy\xFCmenin yaratt\u0131\u011F\u0131 risklere kar\u015F\u0131 uyar\u0131da bulunmu\u015Ftur.",yayin_tarihi:"2026-09-23",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"6c58503c3b63d36c"}],alt_konular:["Siber riskler","\xDC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131","\xD6zel kredi (Private credit)","Yapay zeka"],etkilenen_alanlar:["Operasyonel risk","Kredi riski","Bilgi teknolojileri","Risk y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Avrupa Denetim Otoriteleri (ESAs), 2026 sonbahar risk g\xFCncellemesinde AB finansal sistemi i\xE7in d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, siber tehditler ve \xF6zel kredi piyasalar\u0131ndaki b\xFCy\xFCmenin temel k\u0131r\u0131lganl\u0131klar oldu\u011Funu belirtmi\u015Ftir. Bankalar\u0131n, \xF6zellikle AB d\u0131\u015F\u0131 ICT hizmet sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131klar\u0131n\u0131 ve yapay zeka destekli siber sald\u0131r\u0131 risklerini y\xF6netmeleri beklenmektedir. Ayr\u0131ca, \xF6zel kredi piyasalar\u0131ndaki \u015Feffafl\u0131k eksikli\u011Fi ve bankalarla olan ba\u011Flant\u0131lar, kredi riski y\xF6netimi a\xE7\u0131s\u0131ndan yak\u0131ndan izlenmelidir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n ICT hizmet sa\u011Flay\u0131c\u0131lar\u0131na y\xF6nelik denetim ve risk y\xF6netimi s\xFCre\xE7lerinin s\u0131k\u0131la\u015Ft\u0131r\u0131lmas\u0131 gerekebilir.","\xD6zel kredi piyasalar\u0131na olan dolayl\u0131 maruziyetlerin (ortak bor\xE7lular vb.) daha detayl\u0131 raporlanmas\u0131 gerekebilir.","Yapay zeka ve kuantum bili\u015Fim risklerine kar\u015F\u0131 siber g\xFCvenlik stratejilerinin g\xFCncellenmesi gerekebilir.","ESAs, denet\xE7ileri ve piyasa kat\u0131l\u0131mc\u0131lar\u0131n\u0131 haz\u0131rl\u0131klar\u0131n\u0131 g\xFC\xE7lendirmeye ve d\u0131\u015F ba\u011F\u0131ml\u0131l\u0131klar, \xF6zel kredi ve geli\u015Fmekte olan teknolojilerden kaynaklanan riskleri yak\u0131ndan izlemeye \xE7a\u011F\u0131rmaktad\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["DORA uyum s\xFCre\xE7lerinde AB d\u0131\u015F\u0131 ICT sa\u011Flay\u0131c\u0131lar\u0131na y\xF6nelik risk de\u011Ferlendirmelerinin derinle\u015Ftirilmesi gerekebilir.","Kuantum bili\u015Fim tehditlerine kar\u015F\u0131 kriptografik sistemlerin g\xF6zden ge\xE7irilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Operasyonel risk y\xF6netimi \xE7er\xE7evesinde, yapay zeka destekli siber sald\u0131r\u0131lara kar\u015F\u0131 senaryo analizlerinin (stress testing) g\xFCncellenmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk sermaye gereksinimlerinde, siber risklerin artmas\u0131 nedeniyle modelleme varsay\u0131mlar\u0131n\u0131n g\xFCncellenmesi gerekebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"\xD6zel kredi piyasalar\u0131ndaki stresin, ortak bor\xE7lular \xFCzerinden banka portf\xF6y\xFCne yans\u0131mas\u0131 durumunda PD \xFCzerinde bask\u0131 olu\u015Fabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Varl\u0131k kalitesindeki olas\u0131 bozulmalar, TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 kar\u015F\u0131l\u0131klar\u0131n\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-23",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"\xDC\xE7\xFCnc\xFC Taraf Ba\u011F\u0131ml\u0131l\u0131klar\u0131",aciklama:"AB d\u0131\u015F\u0131 ICT ve \xF6deme sistemi sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131\u011F\u0131n operasyonel risk \xFCzerindeki etkisinin de\u011Ferlendirilmesi."},{baslik:"\xD6zel Kredi Maruziyetleri",aciklama:"\xD6zel kredi ara\xE7lar\u0131na veya bu ara\xE7lar\u0131 kullanan bor\xE7lulara olan do\u011Frudan/dolayl\u0131 maruziyetlerin izlenmesi."}],referanslar:[{metin:"Risks from external dependencies in the financial sector",sayfa:4,paragraf:null},{metin:"Risks from private credit",sayfa:6,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:01:09+03:00",gonderilen_karakter:37202,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"bcbs-2026-09-23-a89cce",kurum:"bcbs",baslik_orijinal:"Basel III risk-based capital and leverage ratios are stable while liquidity indicators show limited movements for large internationally active banks, latest Basel III monitoring exercise shows",baslik_tr:"Basel III risk bazl\u0131 sermaye ve kald\u0131ra\xE7 oranlar\u0131 istikrarl\u0131 seyrederken, likidite g\xF6stergeleri b\xFCy\xFCk uluslararas\u0131 aktif bankalar i\xE7in s\u0131n\u0131rl\u0131 hareketler g\xF6steriyor, en son Basel III izleme \xE7al\u0131\u015Fmas\u0131 bunu ortaya koyuyor",url:"https://www.bis.org/media-releases/20260923-basel-iii-risk-based-capital-and-leverage-ratios-are-stable-while-liquidity-indicators-show",belge_turu:"Rapor",statu:"Nihai",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Bu rapor, b\xFCy\xFCk ve uluslararas\u0131 faaliyet g\xF6steren bankalar i\xE7in Basel III izleme sonu\xE7lar\u0131n\u0131 i\xE7eren bilgilendirici bir yay\u0131nd\u0131r. Kamu sermayeli ve standart yakla\u015F\u0131m uygulayan bankam\u0131z i\xE7in do\u011Frudan bir d\xFCzenleyici de\u011Fi\u015Fiklik veya uyum zorunlulu\u011Fu i\xE7ermemektedir.",konu:"Basel",ozet_tek_satir:"BCBS taraf\u0131ndan yay\u0131nlanan bu rapor, 2025 sonu itibar\u0131yla b\xFCy\xFCk uluslararas\u0131 bankalar\u0131n Basel III sermaye ve likidite rasyolar\u0131ndaki de\u011Fi\u015Fimleri ve Basel III \xE7er\xE7evesinin asgari sermaye gereksinimleri \xFCzerindeki etkilerini analiz etmektedir.",yayin_tarihi:"2026-09-23",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"089f409dab1abe01"}],alt_konular:["Basel III \u0130zleme","Likidite Rasyolar\u0131","Sermaye Yeterlili\u011Fi"],etkilenen_alanlar:["Risk Y\xF6netimi","Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"BCBS taraf\u0131ndan yay\u0131mlanan Basel III izleme raporu, 2025 sonu itibar\u0131yla b\xFCy\xFCk uluslararas\u0131 bankalar\u0131n sermaye ve likidite rasyolar\u0131n\u0131n genel olarak istikrarl\u0131 seyretti\u011Fini g\xF6stermektedir. LCR rasyolar\u0131nda hafif bir art\u0131\u015F, NSFR rasyolar\u0131nda ise s\u0131n\u0131rl\u0131 bir d\xFC\u015F\xFC\u015F g\xF6zlemlenmi\u015Ftir. Rapor, Basel III standartlar\u0131n\u0131n tam uygulanmas\u0131 durumunda Tier 1 sermaye gereksinimleri \xFCzerindeki etkinin %2,2 seviyesinde oldu\u011Funu ortaya koymaktad\u0131r.",amac:{teyitli:[{hukum:"Basel III standartlar\u0131n\u0131n bankalar \xFCzerindeki etkilerinin d\xFCzenli olarak g\xF6zden ge\xE7irilmesi.",alinti:"Through a rigorous reporting process, the Basel Committee regularly reviews the implications of the Basel III standards for banks",sayfa:null,paragraf:19,alinti_dogrulandi:!0}],olasi_etki:["K\xFCresel bankac\u0131l\u0131k sekt\xF6r\xFCndeki sermaye ve likidite e\u011Filimlerinin izlenmesi yoluyla bankam\u0131z\u0131n risk i\u015Ftah\u0131 ve stratejik planlamas\u0131 i\xE7in k\u0131yaslama verisi sa\u011Flayabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Uluslararas\u0131 piyasalardaki likidite standartlar\u0131n\u0131n geli\u015Fimi, bankam\u0131z\u0131n likidite y\xF6netimi politikalar\u0131 i\xE7in dolayl\u0131 bir referans noktas\u0131 olu\u015Fturabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Basel III izleme metodolojisinin incelenmesi, bankam\u0131z\u0131n i\xE7sel raporlama s\xFCre\xE7lerinin uluslararas\u0131 standartlarla uyumunun de\u011Ferlendirilmesine katk\u0131 sa\u011Flayabilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Basel III tam ge\xE7i\u015F etkisinin %2,2 olarak raporlanmas\u0131, k\xFCresel sermaye yeterlili\u011Fi standartlar\u0131n\u0131n s\u0131k\u0131la\u015Fma e\u011Filimini g\xF6stermektedir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},EAD:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."},ECL:{duzey:"Etki beklenmiyor",not:"Rapor, banka \xF6zelinde bir parametre de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-23",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Basel III \u0130zleme Metodolojisi",aciklama:"Uluslararas\u0131 bankalar\u0131n raporlama standartlar\u0131n\u0131 anlamak ad\u0131na Basel III izleme metodolojisi notu incelenebilir."}],referanslar:[{metin:"Basel III monitoring exercise",sayfa:1,paragraf:11}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:01:27+03:00",gonderilen_karakter:4477,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"bcbs-2026-09-23-9e9e8c",kurum:"bcbs",baslik_orijinal:"Basel III monitoring report",baslik_tr:"Basel III \u0130zleme Raporu",url:"https://www.bis.org/publications/202609-qis-basel-iii-monitoring-report",belge_turu:"Rapor",statu:"Y\xFCr\xFCrl\xFCkte",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Bu belge, Basel Komitesi taraf\u0131ndan yay\u0131mlanan bir izleme raporu olup, banka i\xE7in do\u011Frudan bir yasal y\xFCk\xFCml\xFCl\xFCk getirmemekte, k\xFCresel bankac\u0131l\u0131k sekt\xF6r\xFCne ili\u015Fkin istatistiksel veriler ve Basel III standartlar\u0131n\u0131n genel etkilerini sunmaktad\u0131r.",konu:"Basel",ozet_tek_satir:"Basel Komitesi taraf\u0131ndan haz\u0131rlanan bu rapor, Basel III reformlar\u0131n\u0131n bankalar\u0131n sermaye yeterlilik oranlar\u0131, kald\u0131ra\xE7 oranlar\u0131 ve likidite metrikleri \xFCzerindeki etkilerini 2025 y\u0131l\u0131 sonu verileriyle analiz etmektedir.",yayin_tarihi:"2026-09-23",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"d26b8d18a7e695b0"}],alt_konular:["Basel III","Sermaye Yeterlili\u011Fi","Likidite Riski","Kald\u0131ra\xE7 Oran\u0131"],etkilenen_alanlar:["Risk Y\xF6netimi","Sermaye Planlamas\u0131","Likidite Y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Basel Komitesi'nin 31 Aral\u0131k 2025 verilerine dayanan bu raporu, Basel III standartlar\u0131n\u0131n k\xFCresel bankalar \xFCzerindeki etkilerini \xF6zetlemektedir. Rapor, risk bazl\u0131 sermaye ve kald\u0131ra\xE7 oranlar\u0131n\u0131n istikrarl\u0131 seyretti\u011Fini, likidite g\xF6stergelerinin ise s\u0131n\u0131rl\u0131 hareketlilik sergiledi\u011Fini ortaya koymaktad\u0131r. Banka y\xF6netimi, k\xFCresel \xF6l\xE7ekteki bu e\u011Filimleri kendi sermaye ve likidite yeterlilik oranlar\u0131n\u0131 k\u0131yaslamak i\xE7in bir referans noktas\u0131 olarak kullanabilir.",amac:{teyitli:[{hukum:"Basel III \xE7er\xE7evesinin bankalar \xFCzerindeki etkisini de\u011Ferlendirmek amac\u0131yla Basel Bankac\u0131l\u0131k Denetim Komitesi reformlar\u0131n etkilerini ve dinamiklerini izlemektedir.",alinti:"To assess the impact of the Basel III framework on banks, the Basel Committee on Banking Supervision monitors the effects and dynamics of the reforms.",sayfa:8,paragraf:null,alinti_dogrulandi:!0 eminat y\xF6netimi","Para piyasalar\u0131"],etkilenen_alanlar:["Hazine y\xF6netimi","Likidite riski","Teminat y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:"2026-09-17",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"TCMB, finansal piyasalardaki geli\u015Fmeler do\u011Frultusunda TL likidite imk\xE2nlar\u0131n\u0131 geni\u015Fletme karar\u0131 alm\u0131\u015Ft\u0131r. Bu kapsamda haftal\u0131k repo fonlamas\u0131 art\u0131r\u0131lacak, bankalar\u0131n bor\xE7 alabilme limitleri g\xFCncellenecek ve teminat iskonto oranlar\u0131 d\xFC\u015F\xFCr\xFClecektir. Bankam\u0131z\u0131n likidite pozisyonu ve teminat portf\xF6y\xFC bu de\u011Fi\u015Fikliklere g\xF6re yeniden optimize edilmelidir.",amac:{teyitli:[{hukum:"Haftal\u0131k repo ihaleleriyle sa\u011Flanacak fonlama miktar\u0131 art\u0131r\u0131lacakt\u0131r.",alinti:"Haftal\u0131k repo ihaleleriyle sa\u011Flanacak fonlama miktar\u0131 likidite ko\u015Fullar\u0131 g\xF6z \xF6n\xFCnde bulundurularak art\u0131r\u0131lacakt\u0131r.",sayfa:1,paragraf:null,alinti_dogrulandi:!0},{hukum:"Bankalar\u0131n bor\xE7 alabilme limitleri g\xFCncellenecektir.",alinti:"TCMB b\xFCnyesinde faaliyette bulunan Bankalararas\u0131 Para Piyasas\u0131nda bankalar\u0131n bor\xE7 alabilme limitleri, bankac\u0131l\u0131k sisteminin mevcut bilan\xE7o b\xFCy\xFCkl\xFCkleri dikkate al\u0131narak g\xFCncellenecektir.",sayfa:1,paragraf:null,alinti_dogrulandi:!0},{hukum:"Teminat iskonto oranlar\u0131 azalt\u0131lacakt\u0131r.",alinti:"TCMB b\xFCnyesinde yer alan piyasalarda ge\xE7erli olan teminat iskonto oranlar\u0131 g\xF6zden ge\xE7irilerek azalt\u0131lacakt\u0131r.",sayfa:1,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n TCMB nezdindeki teminat havuzunun verimlili\u011Fi artabilir.","Likiditeye eri\u015Fim maliyetlerinde iyile\u015Fme g\xF6r\xFClebilir.","Bankalararas\u0131 piyasadaki bor\xE7lanma kapasitesi geni\u015Fleyebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Daha \xF6nce uygulanan daha y\xFCksek teminat iskonto oranlar\u0131 ve daha k\u0131s\u0131tl\u0131 bor\xE7lanma limitleri, bankan\u0131n likidite tamponlar\u0131n\u0131 daha y\xFCksek tutmas\u0131n\u0131 gerektiriyordu."],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Teminat iskonto oranlar\u0131n\u0131n d\xFC\u015Fmesi, ayn\u0131 miktardaki menkul k\u0131ymet ile daha fazla TL likidite sa\u011Flanmas\u0131na olanak tan\u0131yabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Hazine biriminin TCMB limitlerini ve teminat y\xF6netim stratejisini g\xFCncel piyasa ko\u015Fullar\u0131na g\xF6re revize etmesi gerekecektir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Likidite imk\xE2nlar\u0131n\u0131n artmas\u0131, bankan\u0131n piyasa riskine kar\u015F\u0131 daha esnek bir bilan\xE7o y\xF6netimi yapmas\u0131n\u0131 sa\u011Flayarak dolayl\u0131 olarak sermaye yeterlili\u011Fini destekleyebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Teminat \u0130skonto Oranlar\u0131",onceki:"Daha y\xFCksek iskonto oranlar\u0131",yeni:"Azalt\u0131lm\u0131\u015F iskonto oranlar\u0131",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Likidite y\xF6netimi kararlar\u0131 kredi risk parametrelerini do\u011Frudan etkilemez."},LGD:{duzey:"Etki beklenmiyor",not:"Teminat iskonto oranlar\u0131 TCMB nezdindeki operasyonel s\xFCre\xE7lerle ilgilidir, kredi riski LGD hesaplamalar\u0131n\u0131 de\u011Fi\u015Ftirmez."},EAD:{duzey:"Etki beklenmiyor",not:"Kredi riski maruziyetini etkilemez."},ECL:{duzey:"Etki beklenmiyor",not:"TFRS 9 beklenen kredi zarar\u0131 hesaplamalar\u0131 \xFCzerinde do\u011Frudan bir etkisi yoktur."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-17",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Teminat Portf\xF6y\xFC",aciklama:"Azalt\u0131lan iskonto oranlar\u0131 sonras\u0131 teminat havuzunun yeniden de\u011Ferlendirilmesi."},{baslik:"Likidite Stratejisi",aciklama:"Art\u0131r\u0131lan repo fonlama imk\xE2nlar\u0131n\u0131n banka likidite projeksiyonlar\u0131na entegrasyonu."}],referanslar:[{metin:"T\xFCrk Liras\u0131 Likidite Y\xF6netimine \u0130li\u015Fkin Bas\u0131n Duyurusu",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:02:58+03:00",gonderilen_karakter:2073,alinti_dogrulanan:3,alinti_toplam:3,guven:"Y\xFCksek"}},{id:"tcmb-2026-09-17-9e4859",kurum:"tcmb",baslik_orijinal:"Para Politikas\u0131 Kurulu Toplant\u0131 \xD6zeti (2026-42)",baslik_tr:"Para Politikas\u0131 Kurulu Toplant\u0131 \xD6zeti (2026-42)",url:"http://www.tcmb.gov.tr/wps/wcm/connect/tr/tcmb+tr/main+menu/duyurular/basin/2026/duy2026-42",belge_turu:"B\xFClten",statu:"Bilgi ama\xE7l\u0131",onem:"Orta",onem_gerekcesi:"TCMB'nin faiz karar\u0131 ve makroekonomik projeksiyonlar\u0131, kamu bankas\u0131n\u0131n fonlama maliyetlerini, kredi fiyatlamas\u0131n\u0131 ve TFRS 9 kapsam\u0131ndaki beklenen kredi zarar\u0131 (ECL) hesaplamalar\u0131n\u0131 do\u011Frudan etkilemektedir.",konu:"Di\u011Fer",ozet_tek_satir:"K\xFCresel ve yerel ekonomik g\xF6r\xFCn\xFCm, kredi b\xFCy\xFCme h\u0131zlar\u0131 ve faiz oranlar\u0131ndaki de\u011Fi\u015Fimleri detayland\u0131rarak TFRS 9 senaryolar\u0131 ve kredi riski y\xF6netimi i\xE7in veri sa\u011Flamaktad\u0131r.",yayin_tarihi:"2026-09-17",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"6188b8fde04af35e"}],alt_konular:["Para politikas\u0131","TFRS 9 Makroekonomik Senaryolar","YTAK Limitleri"],etkilenen_alanlar:["Kredi Riski","Hazine ve Aktif-Pasif Y\xF6netimi","Finansal Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:"2026-09-17",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"TCMB politika faizini %37 seviyesinde sabit tutmu\u015F ve s\u0131k\u0131 para politikas\u0131 duru\u015Funun dezenflasyon sa\u011Flanana kadar s\xFCrd\xFCr\xFClece\u011Fini teyit etmi\u015Ftir. \u0130\xE7 talepteki yava\u015Flama belirginle\u015Firken, k\xFCresel jeopolitik riskler ve enerji fiyatlar\u0131ndaki oynakl\u0131k enflasyon \xFCzerinde yukar\u0131 y\xF6nl\xFC risk olu\u015Fturmaya devam etmektedir. Banka i\xE7in en kritik teknik de\u011Fi\u015Fiklik YTAK limitlerinin 750 milyar TL'ye \xE7\u0131kar\u0131lmas\u0131d\u0131r.",amac:{teyitli:[{hukum:"Politika faizinin sabit tutulmas\u0131 ve s\u0131k\u0131 duru\u015Fun korunmas\u0131.",alinti:"Para Politikas\u0131 Kurulu (Kurul), politika faizi olan bir hafta vadeli repo ihale faiz oran\u0131n\u0131n y\xFCzde 37\u2019de sabit tutulmas\u0131na karar vermi\u015Ftir.",sayfa:6,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["S\u0131k\u0131 para politikas\u0131 duru\u015Funun devam\u0131, bankan\u0131n fonlama maliyetlerinin y\xFCksek seviyelerde kalmas\u0131na neden olabilir.","Dezenflasyon s\xFCreci vurgusu, uzun vadeli kredi fiyatlamalar\u0131nda baz al\u0131nacak enflasyon beklentilerini \u015Fekillendirebilir."]},onceki_cerceve:{teyitli:[{hukum:"Repo ihalelerine yeniden ba\u015Flanmas\u0131.",alinti:"TCMB, 23 A\u011Fustos 2026 tarihli duyurusu ile 1 Mart 2026 tarihinde ara verilen bir hafta vadeli repo ihalelerine tekrar ba\u015Flanmas\u0131na karar verildi\u011Fini ilan etmi\u015Ftir.",sayfa:6,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Likidite y\xF6netiminde miktar bazl\u0131 s\u0131k\u0131la\u015Ft\u0131rmadan fiyat bazl\u0131 operasyonel \xE7er\xE7eveye tam d\xF6n\xFC\u015F\xFCn teyit edilmesi."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["TFRS 9 modellerinde kullan\u0131lan GSYH b\xFCy\xFCme varsay\u0131mlar\u0131n\u0131n 2026 i\xE7in %1,6 ve 2027 i\xE7in %2,5 olarak g\xFCncellenmesi gerekebilir.","Enflasyon beklentilerindeki (2026 sonu %29,4) s\u0131n\u0131rl\u0131 y\xFCkseli\u015F, ileriye d\xF6n\xFCk makroekonomik senaryo a\u011F\u0131rl\u0131klar\u0131n\u0131 etkileyebilir."]},operasyonel_etki:{teyitli:[{hukum:"YTAK limitlerinin y\u0131llara g\xF6re tahsisi.",alinti:"Kalan limit, 2027 y\u0131l\u0131na 200 milyar TL ve 2028 y\u0131l\u0131na 200 milyar TL olacak \u015Fekilde tahsis edilmi\u015Ftir.",sayfa:2,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["YTAK kapsam\u0131ndaki kredi kulland\u0131r\u0131m s\xFCre\xE7lerinin ve limit takibinin yeni tahsisatlara g\xF6re g\xFCncellenmesi.","Kredi ve mevduat piyasas\u0131ndaki geli\u015Fmelerin takibi i\xE7in makroihtiyati raporlama s\u0131kl\u0131\u011F\u0131n\u0131n art\u0131r\u0131lmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Kredi b\xFCy\xFCmesindeki yava\u015Flama, RWA art\u0131\u015F h\u0131z\u0131n\u0131 d\xFC\u015F\xFCrerek sermaye yeterlilik rasyosunu (SYR) olumlu etkileyebilir.","YTAK limit art\u0131\u015F\u0131, bu kredilerin d\xFC\u015F\xFCk risk a\u011F\u0131rl\u0131\u011F\u0131na sahip olmas\u0131 durumunda sermaye verimlili\u011Fini art\u0131rabilir."]},iklim:{teyitli:[],olasi_etki:["TFRS 9 senaryolar\u0131nda tar\u0131m emtia fiyatlar\u0131 \xFCzerindeki iklim kaynakl\u0131 risklerin 'stres senaryosu' olarak dikkate al\u0131nmas\u0131 gerekebilir.","\u0130klim olaylar\u0131n\u0131n arz \u015Foku riski olu\u015Fturmas\u0131. (belgeden birebir do\u011Frulanamad\u0131)"],ilgili_degil:!1},degisiklikler:[{konu:"YTAK Program Limitleri",onceki:"300 milyar TL",yeni:"750 milyar TL",referans:"Sayfa 1, Paragraf 6"},{konu:"Politika Faizi",onceki:"%37",yeni:"%37 (Sabit)",referans:"Sayfa 6, Paragraf 27"}],parametre_etkisi:{PD:{duzey:"Orta",not:"\u0130\xE7 talepteki belirgin zay\u0131flama ve sanayi \xFCretimindeki gerileme, \xF6zellikle KOB\u0130 ve ticari segmentte temerr\xFCt olas\u0131l\u0131klar\u0131n\u0131 art\u0131rabilir."},LGD:{duzey:"D\xFC\u015F\xFCk",not:"Gayrimenkul ve teminat de\u011Ferleri enflasyonist ortamda korunsa da, ekonomik yava\u015Flama likiditeye d\xF6n\xFC\u015F h\u0131z\u0131n\u0131 azaltabilir."},EAD:{duzey:"D\xFC\u015F\xFCk",not:"Bireysel kredilerdeki yava\u015Flama e\u011Filimi (haftal\u0131k %2), risk maruziyet tutarlar\u0131ndaki art\u0131\u015F h\u0131z\u0131n\u0131 s\u0131n\u0131rlamaktad\u0131r."},ECL:{duzey:"Orta",not:"Makroekonomik senaryolardaki zay\u0131f b\xFCy\xFCme beklentisi ve y\xFCksek faiz ortam\u0131, kar\u015F\u0131l\u0131k tutarlar\u0131nda yukar\u0131 y\xF6nl\xFC bask\u0131 olu\u015Fturabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-09-17",referans:"Sayfa 1"},{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2026-09-17",referans:"Sayfa 6, P27"}],gozden_gecirilecekler:[{baslik:"TFRS 9 Makroekonomik De\u011Fi\u015Fken Seti",aciklama:"Modelde kullan\u0131lan GSYH, enflasyon ve faiz tahminleri TCMB'nin g\xFCncel beklentileriyle uyumlu hale getirilmelidir."},{baslik:"YTAK Kredi Tahsis Stratejisi",aciklama:"750 milyar TL'ye \xE7\u0131kan limit dahilinde bankan\u0131n 2026-2028 d\xF6nemi i\xE7in hedef sekt\xF6r ve m\xFC\u015Fteri segmentleri belirlenmelidir."},{baslik:"Mevduat ve Kredi Fiyatlama",aciklama:"TL mevduat faizlerindeki 255 baz puanl\u0131k d\xFC\u015F\xFC\u015F\xFCn fonlama maliyetine etkisi ve kredi marjlar\u0131 analiz edilmelidir."}],referanslar:[{metin:"Para Politikas\u0131 Kurulu Toplant\u0131 \xD6zeti (2026-42)",sayfa:1,paragraf:null},{metin:"Parasal ve Finansal Ko\u015Fullar",sayfa:1,paragraf:4},{metin:"Para Politikas\u0131",sayfa:6,paragraf:26}]},analiz_bilgisi:{model:"gemini-3-flash-preview",olusturma_zamani:"2026-11-27T12:18:14+03:00",gonderilen_karakter:45196,alinti_dogrulanan:3,alinti_toplam:4,guven:"Orta"}},{id:"bddk-2026-09-17-b8166e",kurum:"bddk",baslik_orijinal:"Bankalar\u0131n Hisse Geri Al\u0131mlar\u0131 Hk. Kurul Karar\u0131",baslik_tr:"Bankalar\u0131n Hisse Geri Al\u0131mlar\u0131 Hakk\u0131nda Kurul Karar\u0131",url:"https://www.bddk.org.tr/Mevzuat/DokumanGetir/1346",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"Y\xFCksek",onem_gerekcesi:"Kamu sermayeli bankalar\u0131n \xF6zkaynak ve sermaye yeterlili\u011Fi hesaplamalar\u0131n\u0131 do\u011Frudan etkileyen, sermaye rasyolar\u0131 \xFCzerinde ge\xE7ici iyile\u015Ftirme sa\u011Flayan bir d\xFCzenlemedir.",konu:"Basel",ozet_tek_satir:"Halka a\xE7\u0131k bankalar\u0131n rmaye yeterlili\u011Fini olumsuz etkilemekteydi."],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Sermaye yeterlili\u011Fi raporlama sistemlerinde 31.12.2026 tarihine kadar ge\xE7ici bir istisna tan\u0131mlanmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Hisse geri al\u0131m i\u015Flemlerinin tarih bazl\u0131 takibi ve raporlama s\xFCre\xE7lerinde ayr\u0131\u015Ft\u0131r\u0131lmas\u0131 gerekecektir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Kredi riskine esas tutar ve piyasa riskine esas tutar hesaplamalar\u0131nda geri al\u0131nan hisseler nedeniyle bir azalma olabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Hisse geri al\u0131mlar\u0131n\u0131n sermaye hesaplamas\u0131ndaki yeri",onceki:"\xC7ekirdek sermayeden indirim kalemi ve risk hesaplamas\u0131na dahil",yeni:"\u0130ndirim kalemi de\u011Fil ve risk hesaplamas\u0131na dahil de\u011Fil",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:""},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Etki beklenmiyor",not:""}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2026-09-16",referans:"Sayfa 1"},{tur:"Uyum",tarih:"2026-12-31",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Sermaye Yeterlili\u011Fi Raporlamas\u0131",aciklama:"Geri al\u0131nan hisselerin sermaye yeterlili\u011Fi hesaplamalar\u0131ndan muaf tutulmas\u0131 i\xE7in sistem parametrelerinin g\xFCncellenmesi."}],referanslar:[{metin:"Bankac\u0131l\u0131k D\xFCzenleme ve Denetleme Kurulu Karar\u0131",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T22:03:13+03:00",gonderilen_karakter:959,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"eba-2026-09-14-5b841f",kurum:"eba",baslik_orijinal:"The EBA publishes updated list of validation rules as part of its regular quarterly reporting frameworks update",baslik_tr:"EBA, d\xFCzenli \xFC\xE7 ayl\u0131k raporlama \xE7er\xE7evesi g\xFCncellemesinin bir par\xE7as\u0131 olarak g\xFCncellenmi\u015F do\u011Frulama kurallar\u0131 listesini yay\u0131nlad\u0131",url:"https://www.eba.europa.eu/publications-and-media/press-releases/eba-publishes-updated-list-validation-rules-part-its-regular-quarterly-reporting-frameworks-update",belge_turu:"Bas\u0131n duyurusu",statu:"Y\xFCr\xFCrl\xFCkte",onem:"Orta",onem_gerekcesi:"Bankan\u0131n d\xFCzenli raporlama s\xFCre\xE7lerini ve veri do\u011Frulama altyap\u0131s\u0131n\u0131 do\u011Frudan etkileyen teknik bir g\xFCncellemedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"EBA, denetleyici raporlama \xE7er\xE7evelerindeki do\u011Frulama kurallar\u0131n\u0131 g\xFCncelleyerek, veri g\xF6nderimlerinde tutarl\u0131l\u0131\u011F\u0131 ve teknik uyumu art\u0131rmay\u0131 hedefleyen yeni bir paket yay\u0131nlam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-09-14",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"f241f0dd8142c132"}],alt_konular:["Raporlama","Veri Do\u011Frulama"],etkilenen_alanlar:["Raporlama","Bilgi Teknolojileri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, raporlama \xE7er\xE7eveleri kapsam\u0131ndaki do\u011Frulama kurallar\u0131n\u0131 g\xFCncelledi. Bu g\xFCncelleme, hatal\u0131 veya teknik sorunlu kurallar\u0131n devre d\u0131\u015F\u0131 b\u0131rak\u0131lmas\u0131n\u0131 veya yeniden etkinle\u015Ftirilmesini i\xE7ermektedir. Bankan\u0131n raporlama sistemlerinin bu yeni do\u011Frulama kurallar\u0131 ile uyumlu hale getirilmesi gerekmektedir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n raporlama yaz\u0131l\u0131m\u0131nda kullan\u0131lan do\u011Frulama kurallar\u0131n\u0131n g\xFCncellenmemesi durumunda, denetleyici otoriteye g\xF6nderilen verilerde hata mesajlar\u0131 olu\u015Fabilir.","Devre d\u0131\u015F\u0131 b\u0131rak\u0131lan kurallar\u0131n sistemden temizlenmesi, raporlama s\xFCre\xE7lerinde performans art\u0131\u015F\u0131 sa\u011Flayabilir.","EBA, raporlama \xE7er\xE7evelerinde tan\u0131mlanan do\u011Frulama kurallar\u0131n\u0131n g\xFCncellenmi\u015F bir listesini yay\u0131nlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[{hukum:"DPM 2.0 ile do\u011Frulama kurallar\u0131 do\u011Frudan taksonomi ve DPM i\xE7ine entegre edilmi\u015Ftir.",alinti:"With the introduction of DPM 2.0 from release 4.0 onwards, validation rules are now embedded directly in both the taxonomy and DPM.",sayfa:null,paragraf:10,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n kulland\u0131\u011F\u0131 raporlama yaz\u0131l\u0131m\u0131n\u0131n DPM 2.0 standartlar\u0131na tam uyumlu olmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Raporlama birimlerinin, devre d\u0131\u015F\u0131 b\u0131rak\u0131lan kurallar\u0131 sistemlerinden kald\u0131rmas\u0131 operasyonel hata riskini azaltabilir.","Yetkili otoriteler, ITS ve K\u0131lavuzlar uyar\u0131nca sunulan verilerin devre d\u0131\u015F\u0131 b\u0131rak\u0131lan kurallara g\xF6re do\u011Frulanmamas\u0131 gerekti\u011Fini hat\u0131rlat\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},sermaye_rwa:{teyitli:[],olasi_etki:[]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Do\u011Frulama kurallar\u0131",onceki:"\xD6nceki do\u011Frulama kurallar\u0131 seti",yeni:"G\xFCncellenmi\u015F, devre d\u0131\u015F\u0131 b\u0131rak\u0131lan veya yeniden etkinle\u015Ftirilen kurallar listesi",referans:"Sayfa 1, P4"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Bu g\xFCncelleme teknik raporlama kurallar\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u015Ftirmez."},LGD:{duzey:"Etki beklenmiyor",not:"Bu g\xFCncelleme teknik raporlama kurallar\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u0 ivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"da0e9809ddad18e4"}],alt_konular:["Para politikas\u0131","Politika Faizi","Makroekonomik Senaryolar","Likidite Y\xF6netimi"],etkilenen_alanlar:["Hazine ve Fonlama","Kredi Riski Y\xF6netimi","Finansal Raporlama","Stratejik Planlama"],gorus_son_tarihi:null,yururluk_tarihi:"2026-09-10",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"TCMB, Eyl\xFCl 2026 toplant\u0131s\u0131nda politika faizini %37 seviyesinde sabit b\u0131rakm\u0131\u015F ve s\u0131k\u0131 para politikas\u0131 duru\u015Funun dezenflasyon sa\u011Flanana kadar s\xFCrd\xFCr\xFClece\u011Fini teyit etmi\u015Ftir. Enflasyonun ana e\u011Filiminde gerileme g\xF6zlenmekle birlikte, enerji fiyatlar\u0131 kaynakl\u0131 yukar\u0131 y\xF6nl\xFC riskler vurgulanm\u0131\u015Ft\u0131r. Banka i\xE7in y\xFCksek fonlama maliyetlerinin devam\u0131 ve TFRS 9 modellerinde ihtiyatl\u0131 makroekonomik varsay\u0131mlar\u0131n korunmas\u0131 \xF6nem arz etmektedir.",amac:{teyitli:[{hukum:"Politika faizinin %37 d\xFCzeyinde sabit tutulmas\u0131 kararla\u015Ft\u0131r\u0131lm\u0131\u015Ft\u0131r.",alinti:"politika faizi olan bir hafta vadeli repo ihale faiz oran\u0131n\u0131n y\xFCzde 37\u2019de sabit tutulmas\u0131na karar vermi\u015Ftir.",sayfa:1,paragraf:null,alinti_dogrulandi:!0},{hukum:"Faiz koridoru oranlar\u0131 sabit b\u0131rak\u0131lm\u0131\u015Ft\u0131r.",alinti:"Merkez Bankas\u0131 gecelik vadede bor\xE7 verme faiz oran\u0131n\u0131 y\xFCzde 40\u2019ta, gecelik vadede bor\xE7lanma faiz oran\u0131n\u0131 ise y\xFCzde 35,5\u2019te sabit tutmu\u015Ftur.",sayfa:1,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["S\u0131k\u0131 para politikas\u0131 duru\u015Funun korunmas\u0131, bankan\u0131n mevduat ve bor\xE7lanma maliyetlerinin y\xFCksek seviyelerde kalmaya devam edece\u011Fini g\xF6stermektedir.","Enflasyon hedeflerine ula\u015Fma kararl\u0131l\u0131\u011F\u0131, uzun vadeli kredi fiyatlamalar\u0131nda dezenflasyon beklentilerinin dikk rtlara uyum a\xE7\u0131s\u0131ndan de\u011Ferlendiren IMF teknik raporudur.",yayin_tarihi:"2026-09-01",tarih_kaynagi:"belge",tespit_zamani:"2026-11-27T15:42:17.554264+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-27T15:42:17.554264+03:00",icerik_hash:"a79e80d3ecd3e8ca"}],alt_konular:["SREP","Kredi Riski","Kurumsal Y\xF6neti\u015Fim","Likidite Riski"],etkilenen_alanlar:["Kredi riski","Raporlama","Operasyonel risk","Likidite y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"IMF'nin \u0130talya bankac\u0131l\u0131k sistemi \xFCzerine yapt\u0131\u011F\u0131 bu teknik inceleme, Daha Az \xD6nemli Kurumlar (LSI) \xFCzerindeki denetim \xE7er\xE7evesini de\u011Ferlendirmektedir. Raporda, denetim otoritelerinin kredi s\u0131n\u0131fland\u0131rmas\u0131 ve kar\u015F\u0131l\u0131k ay\u0131rma s\xFCre\xE7lerine do\u011Frudan m\xFCdahale yetkisinin art\u0131r\u0131lmas\u0131, kurumsal y\xF6neti\u015Fimin g\xFC\xE7lendirilmesi ve dijitalle\u015Fen finansal ortamda likidite risklerinin (\xE7evrimi\xE7i mevduat platformlar\u0131 gibi) daha s\u0131k\u0131 takibi \xF6nerilmektedir. Bankam\u0131z i\xE7in \xF6zellikle kredi riski denetimindeki ihtiyati beklentiler ve dijitalle\u015Fmenin fonlama istikrar\u0131 \xFCzerindeki etkileri \xF6n plana \xE7\u0131kmaktad\u0131r.",amac:{teyitli:[],olasi_etki:["Denetim otoritelerinin k\xFCresel \xF6l\xE7ekte benzer yakla\u015F\u0131mlar benimseyerek bankalar\u0131n kredi s\u0131n\u0131fland\u0131rma politikalar\u0131na daha m\xFCdahaleci olmas\u0131 beklenebilir.","Dijital mevduat platformlar\u0131na olan ba\u011F\u0131ml\u0131l\u0131\u011F\u0131n likidite stres testlerinde daha muhafazakar senaryolarla ele al\u0131nmas\u0131 gerekebilir.","\u0130talya'daki Daha Az \xD6nemli Kurumlar\u0131n (LSI) bankac\u0131l\u0131k d\xFCzenlemesi ve denetimi \xFCzerine hedeflenmi\u015F bir inceleme yap\u0131lmas\u0131. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[{hukum:"Denetim otoritesinin kredi s\u0131n\u0131fland\u0131rmas\u0131n\u0131 ayarlama ve kar\u015F\u0131l\u0131klar\u0131 art\u0131rma konusunda a\xE7\u0131k bir yetkisinin bulunmamas\u0131.",alinti:"BdI does not have the power to require LSIs to adjust the classifications of individual exposures or impose provisioning levels for specific exposures.",sayfa:40,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["\xD6nceki d\xF6nemde denetim otoriteleri daha \xE7ok 'ikna' (moral suasion) y\xF6ntemini kullan\u0131rken, yeni d\xF6nemde do\u011Frudan yasal yapt\u0131r\u0131m ve d\xFCzeltme yetkilerinin art\u0131r\u0131lmas\u0131 \xF6ng\xF6r\xFClmektedir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["TFRS 9 kapsam\u0131nda ayr\u0131lan kar\u015F\u0131l\u0131klar\u0131n denetim otoritesi taraf\u0131ndan yetersiz bulunmas\u0131 durumunda, do\u011Frudan sermaye yeterlilik rasyosunu etkileyecek ek y\xFCk\xFCml\xFCl\xFCkler gelebilir.","Standart yakla\u015F\u0131m kullanan bankalar i\xE7in konsantrasyon riski hesaplamalar\u0131nda daha karma\u015F\u0131k modellerin kullan\u0131lmas\u0131 gerekebilir.","SREP s\xFCrecinin i\u015F modelleri, y\xF6neti\u015Fim, sermaye yeterlili\u011Fi ve likidite risklerini kapsayacak \u015Fekilde yap\u0131land\u0131r\u0131lmas\u0131. (belgeden birebir do\u011Frulanamad\u0131)"]},operasyonel_etki:{teyitli:[{hukum:"BT hizmet sa\u011Flay\u0131c\u0131lar\u0131na y\xF6nelik yerinde incelemelerin art\u0131r\u0131lmas\u0131 ve d\u0131\u015F kaynak kullan\u0131m\u0131n\u0131n denetimi.",alinti:"BdI conducted seven on-site inspections of IT providers, and continued prioritization of this type of on-site inspections is essential.",sayfa:9,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["D\u0131\u015F kaynakl\u0131 BT hizmeti al\u0131mlar\u0131nda denetim otoritesinin hizmet sa\u011Flay\u0131c\u0131y\u0131 do\u011Frudan denetleme yetkisi nedeniyle s\xF6zle\u015Fme s\xFCre\xE7lerinin g\xFCncellenmesi gerekebilir.","Y\xF6netim kurulu \xFCyeleriyle yap\u0131lacak denetim toplant\u0131lar\u0131n\u0131n s\u0131kl\u0131\u011F\u0131n\u0131n ve derinli\u011Finin artmas\u0131 operasyonel i\u015F y\xFCk\xFC yaratabilir."]},sermaye_rwa:{teyitli:[{hukum:"Pillar 2 sermaye ek y\xFCklerinin belirlenmesinde konsantrasyon riskinin t\xFCm formlar\u0131n\u0131n dikkate al\u0131nmas\u0131.",alinti:"Consider all forms of material concentration risk, when setting Pillar 2 capital add-ons.",sayfa:11,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Egemen risk konsantrasyonu i\xE7in getirilebilecek olas\u0131 ek sermaye y\xFCk\xFCml\xFCl\xFC\u011F\xFC, RWA \xFCzerinde art\u0131\u015F bask\u0131s\u0131 yaratabilir.","SREP puanlamas\u0131ndaki zay\u0131fl\u0131klar\u0131n do\u011Frudan Pillar 2 sermaye gereksinimini art\u0131rmas\u0131 olas\u0131d\u0131r."]},iklim:{teyitli:[],olasi_etki:["SREP de\u011Ferlendirmelerinde ESG (\xC7evresel, Sosyal, Y\xF6neti\u015Fim) fakt\xF6rlerinin bir risk bile\u015Feni olarak daha fazla a\u011F\u0131rl\u0131k kazanmas\u0131 beklenebilir."],ilgili_degil:!1},degisiklikler:[{konu:"Kredi S\u0131n\u0131fland\u0131rma ve Kar\u015F\u0131l\u0131k Yetkileri",onceki:"Denetim otoritesinin bireysel krediler i\xE7in s\u0131n\u0131fland\u0131rma ve kar\u015F\u0131l\u0131k seviyelerini de\u011Fi\u015Ftirme yetkisi s\u0131n\u0131rl\u0131yd\u0131.",yeni:"Denetim otoritesine ihtiyati ama\xE7larla varl\u0131k s\u0131n\u0131fland\u0131rmas\u0131n\u0131 ayarlama ve kar\u015F\u0131l\u0131k seviyelerini art\u0131rma konusunda a\xE7\u0131k yetki verilmesi \xF6nerilmektedir.",referans:"Sayfa 10"},{konu:"Pillar 2 ve Konsantrasyon Riski",onceki:"Konsantrasyon riski a\u011F\u0131rl\u0131kl\u0131 olarak kredi riski alt\u0131nda ele al\u0131n\u0131yordu.",yeni:"Egemen risk konsantrasyonu dahil olmak \xFCzere t\xFCm maddi konsantrasyon risklerinin Pillar 2 sermaye ek y\xFCk\xFC hesaplamalar\u0131na dahil edilmesi \xF6nerilmektedir.",referans:"Sayfa 11"}],parametre_etkisi:{PD:{duzey:"\u0130lgili de\u011 :4,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n s\xFCrd\xFCr\xFClebilirlik raporlama s\xFCre\xE7lerinde operasyonel y\xFCk\xFCn azalmas\u0131 beklenebilir.","KPI hesaplamalar\u0131nda daha odakl\u0131 ve finansal piyasalarla uyumlu verilerin kullan\u0131lmas\u0131 sa\u011Flanabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Omnibus Delegated Act ile getirilen mevcut raporlama \u015Fablonlar\u0131 ve KPI hesaplama y\xF6ntemleri, EBA'n\u0131n yeni tavsiyeleri do\u011Frultusunda revize edilebilir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n raporlama sistemlerinde \u015Fablon g\xFCncellemeleri gerekebilir.","Veri toplama s\xFCre\xE7lerinde sermaye piyasas\u0131 odakl\u0131 yeni bir s\u0131n\u0131fland\u0131rma yap\u0131lmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Raporlama birimlerinin i\u015F y\xFCk\xFCnde azalma olabilir.","S\xFCrd\xFCr\xFClebilirlik raporlar\u0131n\u0131n haz\u0131rlanmas\u0131nda kullan\u0131lan veri setlerinin kapsam\u0131 daralabilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Raporlama gerekliliklerindeki de\u011Fi\u015Fikliklerin sermaye yeterlili\u011Fi rasyolar\u0131 \xFCzerinde do\u011Frudan bir etkisi beklenmemektedir."]},iklim:{teyitli:[],olasi_etki:["Ye\u015Fil varl\u0131klar\u0131n raporlanmas\u0131nda daha net ve basitle\u015Ftirilmi\u015F bir metodolojiye ge\xE7ilmesi, iklim riskine duyarl\u0131 varl\u0131klar\u0131n takibini kolayla\u015Ft\u0131rabilir."],ilgili_degil:!1},degisiklikler:[{konu:"Komisyon ve \xDCcretler KPI",onceki:"Daha geni\u015F kapsaml\u0131 hizmetleri i\xE7ermekteydi.",yeni:"Sermaye piyasalar\u0131 ile ilgili faaliyetlerle s\u0131n\u0131rland\u0131r\u0131lmas\u0131 \xF6nerilmektedir.",referans:"Sayfa 5"},{konu:"Al\u0131m-Sat\u0131m Defteri KPI",onceki:"Daha geni\u015F kapsaml\u0131 piyasa faaliyetlerini i\xE7ermekteydi.",yeni:"Piyasa yap\u0131c\u0131 faaliyetler ve ye\u015Fil menkul k\u0131ymetler ile s\u0131n\u0131rland\u0131r\u0131lmas\u0131 \xF 6netimi","Finansal Raporlama"],gorus_son_tarihi:null,yururluk_tarihi:"2026-10-22",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"TCMB, politika faizini 100 baz puan indirerek %36 seviyesine \xE7ekmi\u015F ve faiz koridorunu a\u015Fa\u011F\u0131 y\xF6nl\xFC g\xFCncellemi\u015Ftir. Enflasyondaki ana e\u011Filimin geriledi\u011Fi teyit edilirken, s\u0131k\u0131 para politikas\u0131 duru\u015Funun korunaca\u011F\u0131 vurgulanm\u0131\u015Ft\u0131r. Banka i\xE7in bu durum fonlama maliyetlerinde d\xFC\u015F\xFC\u015F potansiyeli yarat\u0131rken, TFRS 9 modellerindeki makroekonomik varsay\u0131mlar\u0131n g\xFCncellenmesini gerektirmektedir.",amac:{teyitli:[{hukum:"Politika faiz oran\u0131n\u0131n d\xFC\u015F\xFCr\xFClmesi ve dezenflasyon s\xFCrecinin g\xFC\xE7lendirilmesi.",alinti:"Para Politikas\u0131 Kurulu (Kurul), politika faizi olan bir hafta vadeli repo ihale faiz oran\u0131n\u0131n y\xFCzde 37\u2019den y\xFCzde 36\u2019ya indirilmesine karar vermi\u015Ftir.",sayfa:1,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Piyasa faiz oranlar\u0131n\u0131n a\u015Fa\u011F\u0131 \xE7ekilmesiyle iktisadi faaliyetin desteklenmesi ama\xE7lan\u0131yor olabilir.","Fonlama maliyetlerinin d\xFC\u015F\xFCr\xFClmesi yoluyla bankac\u0131l\u0131k sekt\xF6r\xFC k\xE2rl\u0131l\u0131\u011F\u0131n\u0131n k\u0131sa vadede olumlu etkilenmesi beklenebilir."]},onceki_cerceve:{teyitli:[{hukum:"\xD6nceki politika faiz oran\u0131 y\xFCzde 37 d\xFCzeyindeydi.",alinti:"politika faizi olan bir hafta vadeli repo ihale faiz oran\u0131n\u0131n y\xFCzde 37\u2019den y\xFCzde 36\u2019ya indirilmesine karar vermi\u015Ftir.",sayfa:1,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Daha \xF6nceki s\u0131k\u0131la\u015Ft\u0131rma d\xF6ng\xFCs\xFCn\xFCn ard\u0131ndan ilk faiz indirimi ile gev\u015Feme s\xFCrecine girilmi\u015F olabilir."],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["TFRS 9 modellerinde kullan\u0131lan risksiz faiz oran\u0131 ve iskonto oranlar\u0131n\u0131n g\xFC asyona ge\xE7irilmesi i\xE7in suptech \xE7\xF6z\xFCmleri de\u011Ferlendirilebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yapay zeka modellerinin do\u011Frulanmas\u0131 ve \u015F\xFCpheli i\u015Flem bildirimlerinin (STR) nihai karar\u0131 i\xE7in uzman personel ihtiyac\u0131 artabilir.","AML/CFT anketleri ve veri toplama s\xFCre\xE7lerinde daha fazla veri noktas\u0131n\u0131n i\u015Flenmesi operasyonel y\xFCk olu\u015Fturabilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk sermaye y\xFCk\xFCml\xFCl\xFCkleri, AML/CFT s\xFCre\xE7lerindeki iyile\u015Ftirmelerle daha etkin y\xF6netilebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"AML/CFT risk de\u011Ferlendirmeleri, m\xFC\u015Fteri risk profillerini etkileyerek dolayl\u0131 yoldan kredi riski de\u011Ferlendirmelerine yans\u0131yabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"AML/CFT kaynakl\u0131 uyum riskleri, bankan\u0131n itibar ve operasyonel riskleri \xFCzerinden TFRS 9 kar\u015F\u0131l\u0131k hesaplamalar\u0131n\u0131 dolayl\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-10-19",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Yapay Zeka Y\xF6neti\u015Fimi",aciklama:"\u0130\u015Flem izleme sistemlerinde kullan\u0131lan yapay zeka modellerinin a\xE7\u0131klanabilirli\u011Fi ve insan g\xF6zetimi s\xFCre\xE7lerinin g\xF6zden ge\xE7irilmesi."},{baslik:"Veri Kalitesi ve Otomasyon",aciklama:"AML/CFT veri toplama s\xFCre\xE7lerinde manuel y\xF6ntemlerin azalt\u0131lmas\u0131 ve veri kalitesinin art\u0131r\u0131lmas\u0131 i\xE7in suptech ara\xE7lar\u0131n\u0131n de\u011Ferlendirilmesi."}],referanslar:[{metin:"Enhancing AML/CFT Risk Assessments: key findings from a supervisory stocktake",sayfa:1,paragraf:32},{metin:"The role of AI in transaction monitoring: insights from an industry workshop",sayfa:1,paragraf:36}]},analiz_bilgisi:{model:"gemi g","Raporlama e\u015Fi\u011Fi"],etkilenen_alanlar:["Raporlama","Veri y\xF6netimi","Kredi riski"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:"2030-01-01",analiz:{yonetici_ozeti:"Basel Komitesi, G-SIB \xE7er\xE7evesinde 'window dressing' (makyajlama) faaliyetlerini engellemek amac\u0131yla raporlama y\xF6ntemlerini revize etmi\u015Ftir. Y\u0131l sonu de\u011Ferleri yerine y\u0131l boyu ortalama de\u011Ferlerin kullan\u0131lmas\u0131 zorunlu hale getirilmi\u015Ftir. Ayr\u0131ca, G-SIB raporlama ve a\xE7\u0131klama e\u015Fi\u011Fi 200 milyar EUR'dan 350 milyar EUR'ya y\xFCkseltilmi\u015Ftir. De\u011Fi\u015Fiklikler 2027 ve 2030 y\u0131llar\u0131nda iki a\u015Famada y\xFCr\xFCrl\xFC\u011Fe girecektir.",amac:{teyitli:[{hukum:"G-SIB \xE7er\xE7evesinde makyajlama faaliyetlerini engellemek amac\u0131yla revizyonlar yap\u0131lm\u0131\u015Ft\u0131r.",alinti:"The Basel Committee on Banking Supervision has finalised amendments to address window-dressing behaviour in the context of the framework for global systemically important banks (G-SIBs).",sayfa:null,paragraf:34,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n sistemik \xF6nem skorunun hesaplanmas\u0131nda y\u0131l sonu yerine ortalama de\u011Ferlerin kullan\u0131lmas\u0131, bilan\xE7o y\xF6netimi stratejilerinde de\u011Fi\u015Fikli\u011Fe yol a\xE7abilir.","Raporlama e\u015Fi\u011Finin y\xFCkseltilmesi, baz\u0131 bankalar\u0131n G-SIB raporlama y\xFCk\xFCml\xFCl\xFC\u011F\xFCnden muaf kalmas\u0131na veya raporlama kapsam\u0131n\u0131n daralmas\u0131na neden olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Y\xFCksek frekansl\u0131 (g\xFCnl\xFCk, ayl\u0131k) veri toplama ve i\u015Fleme kapasitesinin art\u0131r\u0131lmas\u0131 gerekebilir.","Veri ambar\u0131 ve raporlama sistemlerinde hesaplama mant\u0131\u011F\u0131n\u0131n g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["2028'den itibaren ba\u015Fla Dayan\u0131kl\u0131l\u0131k"],etkilenen_alanlar:["Risk Y\xF6netimi","Bilgi Teknolojileri","Operasyonel Risk","Y\xF6neti\u015Fim"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"FSB, finansal kurumlar\u0131n yapay zekay\u0131 sorumlu bir \u015Fekilde benimsemelerine yard\u0131mc\u0131 olmak amac\u0131yla haz\u0131rlad\u0131\u011F\u0131 iyi uygulama raporunu, gelen 160'tan fazla geri bildirimi de\u011Ferlendirerek nihai hale getirmi\u015Ftir. Rapor, YZ y\xF6neti\u015Fimi, ya\u015Fam d\xF6ng\xFCs\xFC y\xF6netimi ve \xFC\xE7\xFCnc\xFC taraf riskleri gibi konularda ilkeler bazl\u0131 ve teknoloji tarafs\u0131z bir yakla\u015F\u0131m sunmaktad\u0131r. \xD6zellikle otonom (agentic) YZ sistemlerine y\xF6nelik risk y\xF6netimi ve insan g\xF6zetimi konular\u0131nda ek rehberlik sa\u011Flanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n mevcut risk y\xF6netimi ve y\xF6neti\u015Fim \xE7er\xE7evelerini bu ilkelerle uyumlu hale getirmesi beklenmektedir.",amac:{teyitli:[{hukum:"Finansal kurumlar\u0131n yapay zekay\u0131 sorumlu bir \u015Fekilde benimsemelerine yard\u0131mc\u0131 olmak i\xE7in iyi uygulamalar\u0131n belirlenmesi.",alinti:"The FSB has developed sound practices to help all types of financial institutions navigate benefits and risks responsibly as they adopt AI.",sayfa:null,paragraf:19,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n mevcut YZ projelerinde ve \xFC\xE7\xFCnc\xFC taraf YZ tedarik\xE7i s\xF6zle\u015Fmelerinde, FSB'nin g\xFCncellenmi\u015F iyi uygulama ilkeleriyle uyum sa\u011Flanmas\u0131 gerekebilir.","Otonom YZ sistemlerinin kullan\u0131m\u0131nda, raporun \xF6nerdi\u011Fi yeni kontrol mekanizmalar\u0131n\u0131n (runtime monitoring, audit trails) i\xE7 s\xFCre\xE7lere entegre edilmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Daha \xF6nce yay\u0131mlanan isti\u015Fare raporuna k\u0131yasla, nihai raporda otonom YZ sistemlerine y\xF6nelik daha spesifik risk y\xF6netimi beklentileri eklenmi\u015Ftir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["YZ sistemlerinin a\xE7\u0131klanabilirli\u011Fi ve performans y\xF6netimi i\xE7in ba\u011F\u0131ms\u0131z do\u011Frulama s\xFCre\xE7lerinin teknik altyap\u0131ya dahil edilmesi gerekebilir.","Otonom YZ sistemleri i\xE7in ger\xE7ek zamanl\u0131 izleme ve m\xFCdahale yeteneklerinin geli\u015Ftirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Y\xF6netim kurulu ve \xFCst y\xF6netimin YZ riskleri konusundaki sorumluluklar\u0131n\u0131n netle\u015Ftirilmesi ve raporlama s\xFCre\xE7lerinin g\xFCncellenmesi gerekebilir.","\u0130\u015F s\xFCreklili\u011Fi planlar\u0131n\u0131n, otonom YZ sistemlerinin hata yapmas\u0131 veya kesintiye u\u011Framas\u0131 durumlar\u0131n\u0131 kapsayacak \u015Fekilde revize edilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Operasyonel risk y\xF6netimi \xE7er\xE7evesinin g\xFC\xE7lendirilmesi, uzun vadede operasyonel risk kaynakl\u0131 sermaye gereksinimlerinin daha etkin y\xF6netilmesini sa\u011Flayabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"\xDC\xE7\xFCnc\xFC Taraf YZ Risk Y\xF6netimi",onceki:"Genel \xFC\xE7\xFCnc\xFC taraf risk y\xF6netimi \xE7er\xE7evesi.",yeni:"G\xF6m\xFCl\xFC YZ riskleri, alt y\xFCklenici faaliyetleri ve yo\u011Funla\u015Fma risklerini kapsayan geni\u015Fletilmi\u015F rehberlik.",referans:"Sayfa 7"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},EAD:{duzey:"Etki beklenmiyor",not:"Bu rapor do\u011Frudan kredi riski parametrelerini de\u011Fil, operasyonel risk y\xF6netimi ilkelerini d\xFCzenlemektedir."},ECL:{duzey:"Dolayl\u0131",not:"YZ tabanl\u0131 modelleme s\xFCre\xE7lerinin iyile\u015Ftirilmesi, mod .",konu:"Risk Y\xF6netimi",ozet_tek_satir:"FSB taraf\u0131ndan haz\u0131rlanan bu rapor, k\xFCresel stablecoin d\xFCzenlemelerinin s\u0131n\u0131r \xF6tesi risklerini, finansal istikrar \xFCzerindeki etkilerini ve bu varl\u0131klar\u0131n izlenmesine y\xF6nelik veri kaynaklar\u0131 ile metrikleri analiz etmektedir.",yayin_tarihi:"2026-10-12",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"9024b19dfc233bec"}],alt_konular:["Finansal \u0130stikrar","Stablecoin","S\u0131n\u0131r \xF6tesi riskler"],etkilenen_alanlar:["Kredi riski","Likidite riski","Operasyonel risk"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"FSB taraf\u0131ndan yay\u0131mlanan bu rapor, k\xFCresel stablecoin d\xFCzenlemelerinin s\u0131n\u0131r \xF6tesi finansal istikrar \xFCzerindeki etkilerini ve izleme metriklerini ele almaktad\u0131r. Stablecoinlerin geleneksel finansal sistemle olan ba\u011Flant\u0131lar\u0131, rezerv varl\u0131klar\u0131n y\xF6netimi ve olas\u0131 bir kriz an\u0131nda banka mevduatlar\u0131 \xFCzerindeki bask\u0131 potansiyeli vurgulanmaktad\u0131r. Bankam\u0131z\u0131n bu varl\u0131klarla olan do\u011Frudan veya dolayl\u0131 etkile\u015Fimleri, \xF6zellikle likidite ve operasyonel risk y\xF6netimi \xE7er\xE7evesinde g\xF6zden ge\xE7irilmelidir.",amac:{teyitli:[{hukum:"Rapor, k\xFCresel stablecoin d\xFCzenlemelerinin finansal istikrar \xFCzerindeki etkilerini ve izleme metriklerini \xF6zetlemektedir.",alinti:"This note summarises ongoing monitoring work at the FSB on global stablecoin arrangements.",sayfa:null,paragraf:3,alinti_dogrulandi:!0}],olasi_etki:["K\xFCresel stablecoinlerin yayg\u0131nla\u015Fmas\u0131, banka mevduatlar\u0131nda dalgalanmalara ve likidite y\xF6netimi s\xFCre\xE7lerinde ek stres testlerine ihtiya\xE7 duyulmas\u0131na neden olabilir.","Stablecoin rezervlerinin bankac\u0131l\u0131k sisteminde tutu :{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:57:41+03:00",gonderilen_karakter:1348,alinti_dogrulanan:2,alinti_toplam:2,guven:"Y\xFCksek"}},{id:"imf-2026-10-01-9a427b",kurum:"imf",baslik_orijinal:"Global Financial Stability Report, October 2026: Resilience, Risk, and Transformation",baslik_tr:"K\xFCresel Finansal \u0130stikrar Raporu, Ekim 2026: Dayan\u0131kl\u0131l\u0131k, Risk ve D\xF6n\xFC\u015F\xFCm",url:"https://www.imf.org/en/publications",kaynak_baglantisi:"https://www.imf.org/en/publications",belge_turu:"Rapor",statu:"Bilgi ama\xE7l\u0131",onem:"Y\xFCksek",onem_gerekcesi:"Rapor, k\xFCresel finansal sistemdeki k\u0131r\u0131lganl\u0131klar\u0131, \xF6zellikle banka d\u0131\u015F\u0131 finansal kurulu\u015Flar\u0131n (NBFI) artan kald\u0131ra\xE7 ve likidite risklerini vurgulamaktad\u0131r. Kamu bankas\u0131 olarak, bu piyasa ko\u015Fullar\u0131n\u0131n kredi riski ve fonlama maliyetleri \xFCzerindeki dolayl\u0131 etkileri kritik \xF6nem ta\u015F\u0131maktad\u0131r.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"IMF taraf\u0131ndan haz\u0131rlanan bu rapor, k\xFCresel finansal piyasalardaki riskleri, hedge fonlar\u0131n finansal istikrar \xFCzerindeki etkilerini ve varl\u0131k tokenizasyonunun finansal sistemdeki yerini analiz etmektedir.",yayin_tarihi:"2026-10-01",tarih_kaynagi:"belge",tespit_zamani:"2026-11-27T15:42:17.554264+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-27T15:42:17.554264+03:00",icerik_hash:"16ac5732ac66d8f4"}],alt_konular:["Kredi riski","Likidite riski","Kald\u0131ra\xE7","Siber g\xFCvenlik"],etkilenen_alanlar:["Kredi riski","Hazine ve piyasa i\u015Flemleri","Raporlama","Siber g\xFCvenlik"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"IMF'nin Ekim 2026 tarihli raporu, k\xFCresel finansal piyasalar\u0131n diren\xE7li kalmas\u0131na ra\u011Fmen, yapay zeka (AI) kaynakl\u0131 piyasa d\xFCzeltmeleri, devlet tahvili getirilerindeki keskin art\u0131\u015Flar CP'ler nezdindeki teminat de\u011Ferleme modellerinin g\xF6zden ge\xE7irilmesini gerektirebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["CCP'lerin yat\u0131r\u0131m risklerine ili\u015Fkin raporlama ve izleme s\xFCre\xE7lerinde daha detayl\u0131 stres testi senaryolar\u0131 kullan\u0131labilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["CCP'lerin finansal istikrar\u0131 \xFCzerindeki risklerin artmas\u0131, bankam\u0131z\u0131n CCP'lere y\xF6nelik sermaye y\xFCk\xFCml\xFCl\xFCkleri \xFCzerinde dolayl\u0131 bir bask\u0131 olu\u015Fturabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"CCP'lerin yat\u0131r\u0131m yapt\u0131\u011F\u0131 kar\u015F\u0131 taraflar\u0131n temerr\xFCt riski, bankam\u0131z\u0131n CCP'ler \xFCzerindeki genel risk alg\u0131s\u0131n\u0131 etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"Teminat iskonto oranlar\u0131n\u0131n (haircut) yetersizli\u011Fi, CCP'lerin temerr\xFCt durumunda geri kazan\u0131m oranlar\u0131n\u0131 etkileyebilir."},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"CCP'lerin temerr\xFCt d\u0131\u015F\u0131 kay\u0131plar\u0131n\u0131n artmas\u0131, sistemik risk \xFCzerinden dolayl\u0131 bir etki yaratabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-10-01",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"CCP Kar\u015F\u0131 Taraf Kredi Riski",aciklama:"Bankam\u0131z\u0131n CCP'ler nezdindeki ters repo ve nakit y\xF6netimi maruziyetlerinin, kar\u015F\u0131 taraf kredi riski a\xE7\u0131s\u0131ndan yeniden de\u011Ferlendirilmesi."}],referanslar:[{metin:"Beyond Clearing: Central Counterparties\u2019 Investment and Risk Management of Cash from Margin Calls",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-27T16:26:58+03:00",gonderilen_karakter:5911,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"bddk-2026-10-01-dcfccb",kurum:"bddk",baslik_orijinal:"Kredi Kart\u013 ,statu:"Bilgi ama\xE7l\u0131",onem:"D\xFC\u015F\xFCk",onem_gerekcesi:"Belge, BCBS taraf\u0131ndan d\xFCzenlenen bir konferans\u0131n \xF6zetini i\xE7eren bilgilendirme ama\xE7l\u0131 bir bas\u0131n b\xFCltenidir; banka i\xE7in do\u011Frudan ba\u011Flay\u0131c\u0131 bir d\xFCzenleme de\u011Fi\u015Fikli\u011Fi i\xE7ermemektedir.",konu:"Di\u011Fer",ozet_tek_satir:"Basel Komitesi taraf\u0131ndan d\xFCzenlenen 24. Uluslararas\u0131 Banka Denet\xE7ileri Konferans\u0131'nda, denetim etkinli\u011Finin art\u0131r\u0131lmas\u0131, d\xFCzenlemelerin sadele\u015Ftirilmesi, finans\u0131n dijitalle\u015Fmesi ve banka-banka d\u0131\u015F\u0131 finansal kurulu\u015Flar aras\u0131ndaki risk ba\u011Flant\u0131lar\u0131 ele al\u0131nm\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-10-01",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T21:43:03+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T21:43:03+03:00",icerik_hash:"5a9931911d5a9bdc"}],alt_konular:["Denetim stratejileri","Dijitalle\u015Fme","Operasyonel dayan\u0131kl\u0131l\u0131k"],etkilenen_alanlar:["Risk Y\xF6netimi","Stratejik Planlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"BCBS taraf\u0131ndan d\xFCzenlenen 24. Uluslararas\u0131 Bankac\u0131l\u0131k Denet\xE7ileri Konferans\u0131'nda (ICBS) denetim etkinli\u011Fi, finans\u0131n dijitalle\u015Fmesi, yapay zeka ve banka-banka d\u0131\u015F\u0131 finansal kurulu\u015Flar aras\u0131ndaki ba\u011Flant\u0131lar ele al\u0131nm\u0131\u015Ft\u0131r. Konferans, denetim \xE7er\xE7evelerinin modernle\u015Ftirilmesi ve risk odakl\u0131 yakla\u015F\u0131mlar\u0131n g\xFC\xE7lendirilmesi \xFCzerine odaklanm\u0131\u015Ft\u0131r. Bankam\u0131z i\xE7in do\u011Frudan bir y\xFCk\xFCml\xFCl\xFCk getirmemekle birlikte, k\xFCresel denetim e\u011Filimlerini anlamak ad\u0131na takip edilmelidir.",amac:{teyitli:[],olasi_etki:["Gelecekteki d\xFCzenleyici yakla\u015F\u0131mlar\u0131n, konferansta tart\u0131\u015F\u0131lan 'basitle\u015Ftirme' ve 'risk odakl\u0131 denetim' ilkeleri do\u011Frultusunda \u015Fekillenmesi beklenebilir.","Yapay zeka ve kripto varl\u0131klar konusundaki denetim beklentilerinin, ilerleyen d\xF6nemde yerel d\xFCzenlemelere yans\u0131mas\u0131 olas\u0131d\u0131r.","Konferans\u0131n amac\u0131, denetim etkinli\u011Fini art\u0131rmak, d\xFCzenlemeleri basitle\u015Ftirmek ve finans\u0131n dijitalle\u015Fmesi ile banka-banka d\u0131\u015F\u0131 kurulu\u015Flar aras\u0131ndaki ba\u011Flant\u0131lar\u0131 tart\u0131\u015Fmakt\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Operasyonel dayan\u0131kl\u0131l\u0131k ve \xFC\xE7\xFCnc\xFC taraf hizmet sa\u011Flay\u0131c\u0131 risklerine y\xF6nelik denetim beklentilerinin artmas\u0131 muhtemeldir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Yapay zeka kullan\u0131m\u0131 ve dijitalle\u015Fme s\xFCre\xE7lerinde bankan\u0131n y\xF6neti\u015Fim ve g\xF6zetim mekanizmalar\u0131n\u0131 g\xF6zden ge\xE7irmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:[]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Belge do\u011Frudan kredi riski parametrelerini etkileyen bir d\xFCzenleme i\xE7ermemektedir."},LGD:{duzey:"Etki beklenmiyor",not:"Belge do\u011Frudan kredi riski parametrelerini etkileyen bir d\xFCzenleme i\xE7ermemektedir."},EAD:{duzey:"Etki beklenmiyor",not:"Belge do\u011Frudan kredi riski parametrelerini etkileyen bir d\xFCzenleme i\xE7ermemektedir."},ECL:{duzey:"Etki beklenmiyor",not:"Belge do\u011Frudan kredi riski parametrelerini etkileyen bir d\xFCzenleme i\xE7ermemektedir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-10-01",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Operasyonel Dayan\u0131kl\u0131l\u0131k",aciklama:"\xDC\xE7\xFCnc\xFC taraf hizmet sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131k ve siber risk y\xF6netimi s\xFCre\xE7lerinin g\xFCncelli\u011Fi."},{baslik:"Dijitalle\u015Fme ve Yapay Zeka",aciklama:"Yapay zeka kullan\u0131m\u0131na ili\u015Fkin i\xE7 y\xF6neti\u015Fim ve risk g\xF6zetim \xE7er\xE7evesinin de\u011Ferlendirilmesi."}],referanslar:[{metin:"International supervisory community meets to discuss the future of global bank supervision and regulation",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T21:59:29+03:00",gonderilen_karakter:5839,alinti_dogrulanan:0,alinti_toplam:1,guven:"D\xFC\u015F\xFCk"}},{id:"imf-2026-11-27-8927b9",kurum:"imf",baslik_orijinal:"Systemwide liquidity stress testing in FSAPs",baslik_tr:"FSAP'larda Sistem Genelinde Likidite Stres Testi",url:"https://www.imf.org/en/publications",kaynak_baglantisi:"https://www.imf.org/en/publications",belge_turu:"Rapor",statu:"Bilgi ama\xE7l\u0131",onem:"Y\xFCksek",onem_gerekcesi:"Belgede 2023 T\xFCrkiye FSAP sonu\xE7lar\u0131na ve kamu bankalar\u0131n\u0131n TCMB ile olan FX likidite ili\u015Fkisine (nexus) do\u011Frudan at\u0131f yap\u0131lmas\u0131, bankan\u0131n likidite risk y\xF6netimi stratejilerini etkilemektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Finansal Sekt\xF6r De\u011Ferlendirme Programlar\u0131 (FSAP) kapsam\u0131nda bankalar ve banka d\u0131\u015F\u0131 finansal kurulu\u015Flar aras\u0131ndaki likidite etkile\u015Fimlerini ve sistemik riskleri analiz eden metodolojik ara\xE7lar\u0131 tan\u0131tmaktad\u0131r.",yayin_tarihi:"2026-11-27",tarih_kaynagi:"tespit",tespit_zamani:"2026-11-27T15:42:17.554264+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-27T15:42:17.554264+03:00",icerik_hash:"01ce11e4dbf481cc"}],alt_konular:["Likidite Stres Testi","NBFI Etkile\u015Fimi","FX Likidite Riski","Sistemik Risk"],etkilenen_alanlar:["Likidite Y\xF6netimi","Risk Raporlama","Hazine Operasyonlar\u0131"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"IMF, finansal istikrar analizlerinde bankalar ile banka d\u0131\u015F\u0131 finansal kurulu\u015Flar (NBFI) aras\u0131ndaki etkile\u015Fimi \xF6l\xE7en 'sistem genelinde likidite stres testi' metodolojilerini \xF6n plana \xE7\u0131karmaktad\u0131r. \xD6zellikle geli\u015Fmekte olan piyasalarda FX likidite \xE7\u0131k\u0131\u015Flar\u0131n\u0131n ve sekt\xF6rler aras\u0131 bula\u015Fma kanallar\u0131n\u0131n (marj \xE7a\u011Fr\u0131lar\u0131, varl\u0131k sat\u0131\u015Flar\u0131) bankac\u0131l\u0131k sistemini nas\u0131l etkiledi\u011Fi analiz edilmektedir. T\xFCrkiye \xF6zelinde 2023 FSAP bulgular\u0131na at\u0131f yap\u0131larak, bankalar\u0131n TCMB'deki FX rezervleri ve swap i\u015Flemleri \xFCzerinden olu\u015Fan kar\u015F\u0131l\u0131kl\u0131 ba\u011F\u0131ml\u0131l\u0131k risklerine dikkat \xE7ekilmektedir.",amac:{teyitli:[{hukum:"Sistem genelinde stres testi yakla\u015F\u0131mlar\u0131, bankalar ve NBFI'lar aras\u0131ndaki sekt\xF6rler aras\u0131 g\xFC\xE7lendirme kanallar\u0131n\u0131 yakalamay\u0131 ama\xE7lar.",alinti:"international financial stability groups have increasingly called for systemwide stress testing approaches that can capture cross-sectoral amplification channels among banks and NBFIs",sayfa:1,paragraf:null,alinti_dogrulandi:!0},{hukum:"Excel tabanl\u0131 ara\xE7, likidite \u015Foklar\u0131n\u0131 ve bunlar\u0131n yurt i\xE7i finansal ba\u011Flant\u0131lar yoluyla iletimini izlemek i\xE7in sekt\xF6rel ak\u0131m verilerini kullan\u0131r.",alinti:"The first is an Excel-based systemwide liquidity analysis tool, leveraging sector-aggregate flow-of-funds data to monitor liquidity shocks and their transmission across domestic financial linkages",sayfa:2,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Gelecekteki FSAP denetimlerinde bankan\u0131n likidite tamponlar\u0131n\u0131n sadece miktar olarak de\u011Fil, NBFI ve TCMB ile olan ba\u011Flant\u0131lar\u0131 \xFCzerinden niteliksel olarak da sorgulanmas\u0131 olas\u0131d\u0131r.","Bankan\u0131n likidite stres testlerinde sadece kendi bilan\xE7osuna de\u011Fil, fon piyasalar\u0131ndaki di\u011Fer oyuncular\u0131n davran\u0131\u015Flar\u0131na da odaklanmas\u0131 gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Geleneksel stres testleri genellikle tek bir sekt\xF6re (\xF6rne\u011Fin sadece bankalar) odaklan\u0131rken, yeni yakla\u015F\u0131m sekt\xF6rler aras\u0131 bula\u015Fma kanallar\u0131n\u0131 (contagion) merkeze almaktad\u0131r.","\xD6nceki modellerde marj \xE7a\u011Fr\u0131lar\u0131 ve varl\u0131k yang\u0131n sat\u0131\u015Flar\u0131n\u0131n (fire sales) ikincil etkileri genellikle ihmal ediliyordu."],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[{hukum:"MILD \xE7er\xE7evesi, itfa bask\u0131lar\u0131n\u0131, varl\u0131k sat\u0131\u015Flar\u0131n\u0131 ve ikincil fiyat etkilerini de\u011Ferlendirmek i\xE7in gran\xFCler yat\u0131r\u0131m fonu ve varl\u0131k verilerini kullan\u0131r.",alinti:"The second tool is the Market Impact from Investment Funds Liquidity Distress (MILD) framework, which uses granular investment funds and their asset data",sayfa:2,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n likidite modellerine 'yang\u0131n sat\u0131\u015F\u0131' (fire sale) fiyat etkisi parametrelerinin eklenmesi gerekebilir.","TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 (ECL) hesaplamalar\u0131nda kullan\u0131lan makroekonomik senaryolara sistemik likidite \u015Foklar\u0131n\u0131n dahil edilmesi olas\u0131d\u0131r."]},operasyonel_etki:{teyitli:[],olasi_etki:["Risk y\xF6netimi birimlerinin, banka d\u0131\u015F\u0131 finansal kurulu\u015Flarla (emeklilik fonlar\u0131, yat\u0131r\u0131m fonlar\u0131) olan marj ve teminat y\xF6netimi s\xFCre\xE7lerini daha s\u0131k\u0131 izlemesi gerekebilir.","Veri y\xF6netimi taraf\u0131nda, kar\u015F\u0131 taraf bazl\u0131 gran\xFCler i\u015Flem verilerinin (repo, t\xFCrev) sistemik risk analizi i\xE7in haz\u0131r bulundurulmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["L hem de i\xE7sel derecelendirme yakla\u015F\u0131mlar\u0131 i\xE7in kritik oldu\u011Funu belirtmektedir.",yayin_tarihi:"2026-11-26",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T13:46:13+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T13:46:13+03:00",icerik_hash:"9913f3fdf6bfdbdd"}],alt_konular:["Temerr\xFCt Tan\u0131m\u0131 (DoD)","Standart yakla\u015F\u0131m","Kredi riski"],etkilenen_alanlar:["Kredi riski","Raporlama","\u0130\xE7 kontrol"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, temerr\xFCt tan\u0131m\u0131 (DoD) rehberlerinin uygulanmas\u0131na ili\u015Fkin bir takip raporu yay\u0131mlam\u0131\u015Ft\u0131r. Rapor, AB genelinde denetimsel yak\u0131nsaman\u0131n y\xFCksek oldu\u011Funu ancak standart yakla\u015F\u0131m (SA) kullanan bankalar\u0131n denetiminde farkl\u0131l\u0131klar bulundu\u011Funu belirtmektedir. Bankam\u0131z\u0131n SA kullanmas\u0131 nedeniyle, denetleyici otoritelerin temerr\xFCt tan\u0131m\u0131 uyumunu izlemek i\xE7in daha resmi ve dok\xFCmante edilmi\u015F \xE7er\xE7eveler geli\u015Ftirmesi beklenmektedir.",amac:{teyitli:[],olasi_etki:["Denetleyici otoritelerin, standart yakla\u015F\u0131m kullanan bankalar i\xE7in temerr\xFCt tan\u0131m\u0131 uyumunu izlemek \xFCzere daha s\u0131k\u0131 ve dok\xFCmante edilmi\u015F denetim s\xFCre\xE7leri uygulamas\u0131 beklenebilir.","Bankan\u0131n temerr\xFCt tan\u0131m\u0131 ile ilgili i\xE7 politikalar\u0131n\u0131n ve IT sistemlerinin, EBA rehberleri ile tam uyumunun sa\u011Flanmas\u0131 i\xE7in ek denetimler gerekebilir.","EBA, temerr\xFCt tan\u0131m\u0131n\u0131n AB bankac\u0131l\u0131k sekt\xF6r\xFCnde tutarl\u0131 uygulanmas\u0131n\u0131 te\u015Fvik etmek amac\u0131yla rehberler yay\u0131mlam\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131 (DoD) ile ilgili IT sistemlerinin, \xF6zellikle 'g\xFCn baz\u0131nda gecikme' (DpD) ve '\xF6dememe olas\u0131l\u0131\u011F\u0131' (UTP) g\xF6stergelerini do\u011Fru hesaplayacak \u015Fekilde g\xFCncellenmesi gerekebilir.","Temerr\xFCt tan\u0131m\u0131n\u0131n grup d\xFCzeyinde tutarl\u0131 uygulanmas\u0131 i\xE7in veri altyap\u0131s\u0131n\u0131n g\xFC\xE7lendirilmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131 uyumuna ili\u015Fkin i\xE7 denetim ve risk y\xF6netimi raporlamalar\u0131n\u0131n s\u0131kl\u0131\u011F\u0131 ve derinli\u011Fi artabilir.","Temerr\xFCt tan\u0131m\u0131 ile ilgili s\xFCre\xE7lerin (UTP g\xF6stergeleri, \xE7\u0131k\u0131\u015F kriterleri) daha detayl\u0131 dok\xFCmante edilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Temerr\xFCt tan\u0131m\u0131n\u0131n daha tutarl\u0131 uygulanmas\u0131, risk a\u011F\u0131rl\u0131kl\u0131 varl\u0131klar\u0131n (RWA) hesaplanmas\u0131nda daha do\u011Fru sonu\xE7lar do\u011Furabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Denetim Yakla\u015F\u0131m\u0131",onceki:"SA bankalar\u0131 i\xE7in daha az resmi denetim s\xFCre\xE7leri",yeni:"SA bankalar\u0131 i\xE7in daha resmi ve dok\xFCmante edilmi\u015F denetim \xE7er\xE7eveleri beklentisi",referans:"Sayfa 39"}],parametre_etkisi:{PD:{duzey:"Orta",not:"Temerr\xFCt tan\u0131m\u0131ndaki de\u011Fi\u015Fiklikler, temerr\xFCt olas\u0131l\u0131\u011F\u0131 (PD) tahminlerini do\u011Frudan etkileyebilir."},LGD:{duzey:"Dolayl\u0131",not:"Temerr\xFCt tan\u0131m\u0131n\u0131n netle\u015Fmesi, temerr\xFCt durumunda kay\u0131p (LGD) hesaplamalar\u0131nda kullan\u0131lan verilerin kalitesini etkileyebilir."},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Orta",not:"Temerr\xFCt tan\u0131m\u0131ndaki g\xFCncellemeler, TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 (ECL) hesaplamalar\u0131n\u0131 etkileyebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-26",referans:"Sayfa 1"}],gozden_gecirilecek nda lisansl\u0131 platformlarda ihra\xE7 edilen varl\u0131klar\u0131n, Eurosystem kredi operasyonlar\u0131nda teminat olarak kabul edilece\u011Fini duyurmu\u015Ftur.",yayin_tarihi:"2026-11-23",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"4606e454d293dbd2"}],alt_konular:["Teminat y\xF6netimi","DLT tabanl\u0131 varl\u0131klar"],etkilenen_alanlar:["Hazine i\u015Flemleri","Dijital varl\u0131k stratejisi"],gorus_son_tarihi:null,yururluk_tarihi:"2027-06-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Avrupa Merkez Bankas\u0131 (ECB), AB DLT Pilot Rejimi kapsam\u0131nda lisansl\u0131 platformlarda ihra\xE7 edilen varl\u0131klar\u0131n Eurosystem kredi operasyonlar\u0131nda teminat olarak kabul edilece\u011Fini duyurmu\u015Ftur. Bu ad\u0131m, tokenize edilmi\u015F finansal piyasalara uyum sa\u011Flama yol haritas\u0131n\u0131n bir par\xE7as\u0131d\u0131r. Bankam\u0131z\u0131n do\u011Frudan Eurosystem operasyonlar\u0131 bulunmamakla birlikte, DLT tabanl\u0131 varl\u0131klar\u0131n teminat olarak kabul edilmesi k\xFCresel finansal piyasalardaki dijitalle\u015Fme e\u011Filimini yans\u0131tmaktad\u0131r.",amac:{teyitli:[],olasi_etki:["DLT tabanl\u0131 varl\u0131klar\u0131n teminat olarak kabul edilmesi, Avrupa piyasalar\u0131nda tokenizasyonun h\u0131zlanmas\u0131na ve bankam\u0131z\u0131n uluslararas\u0131 muhabir bankac\u0131l\u0131k ili\u015Fkilerinde dijital varl\u0131k kabul\xFCn\xFCn artmas\u0131na neden olabilir.","DLT platformlar\u0131nda ihra\xE7 edilen varl\u0131klar\u0131n Eurosystem kredi operasyonlar\u0131nda teminat olarak kabul edilmesi onaylanm\u0131\u015Ft\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[{hukum:"27 Ocak 2026 tarihinde DLT tabanl\u0131 hizmetler kullanan CSD'lerde ihra\xE7 edilen varl\u0131klar\u0131n teminat olarak kabul edilece\u011Fi duyurulmu\u015Ftur.",alinti:"Today\u2019s decision follows the announcement on 27 January 2026 to accept as collateral assets issued in CSDs using DLT-based services.",sayfa:null,paragraf:12,alinti_dogrulandi:!0}],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n dijital varl\u0131k saklama ve mutabakat altyap\u0131s\u0131, gelecekteki olas\u0131 DLT tabanl\u0131 teminat y\xF6netimi s\xFCre\xE7lerine uyum sa\u011Flamak ad\u0131na g\xF6zden ge\xE7irilebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["DLT tabanl\u0131 varl\u0131klar\u0131n operasyonel s\xFCre\xE7lere entegrasyonu i\xE7in yeni yasal ve teknik g\xFCvenlik standartlar\u0131n\u0131n takip edilmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Do\u011Frudan bir sermaye etkisi beklenmemektedir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Teminat uygunlu\u011Fu",onceki:"Geleneksel CSD hizmetleri ile s\u0131n\u0131rl\u0131 teminat kabul\xFC.",yeni:"AB DLT Pilot Rejimi kapsam\u0131nda lisansl\u0131 DLT platformlar\u0131nda ihra\xE7 edilen varl\u0131klar\u0131n teminat olarak kabul\xFC.",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"Banka Eurosystem operasyonlar\u0131na dahil de\u011Fildir."},LGD:{duzey:"Etki beklenmiyor",not:"Banka Eurosystem operasyonlar\u0131na dahil de\u011Fildir."},EAD:{duzey:"Etki beklenmiyor",not:"Banka Eurosystem operasyonlar\u0131na dahil de\u011Fildir."},ECL:{duzey:"Etki beklenmiyor",not:"Banka Eurosystem operasyonlar\u0131na dahil de\u011Fildir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-06-01",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Dijital Varl\u0131k Stratejisi",aciklama:"Euro B\xF6lgesi'ndeki DLT tabanl\u0131 teminat kabul\xFC standartlar\u0131n\u0131n, bankan\u0131n gelecekteki dijital varl\u0131k stratejisi ile uyumu de\u011Ferlendirilmelidir."}],referanslar:[{metin:"ECB expands acceptance of DLT-based assets as eligible Eurosystem collateral",sayfa:1,paragraf:2}]},analiz_bilgisi:{model:"gemini-3.1-fla
