onderilen_karakter:2492,alinti_dogrulanan:1,alinti_toplam:1,guven:"Y\xFCksek"}},{id:"ecb-2026-11-19-f93c44",kurum:"ecb",baslik_orijinal:"Transatlantic securitisation gap revisited: comparing EU and US securitisation architectures",baslik_tr:"Transatlantik menkul k\u0131ymetle\u015Ftirme fark\u0131n\u0131n yeniden de\u011Ferlendirilmesi: AB ve ABD menkul k\u0131ymetle\u015Ftirme mimarilerinin kar\u015F\u0131la\u015Ft\u0131r\u0131lmas\u0131",url:"https://www.ecb.europa.eu//pub/pdf/scpops/ecb.op403.en.pdf",belge_turu:"Rapor",statu:"Bilgi ama\xE7l\u0131",onem:"Orta",onem_gerekcesi:"Belge, AB ve ABD menkul k\u0131ymetle\u015Ftirme piyasalar\u0131n\u0131 kar\u015F\u0131la\u015Ft\u0131rmal\u0131 olarak analiz eden bir ara\u015Ft\u0131rma raporudur. Kamu bankas\u0131 i\xE7in do\u011Frudan bir yasal de\u011Fi\u015Fiklik i\xE7ermemekle birlikte, stratejik sermaye y\xF6netimi ve fonlama ara\xE7lar\u0131 (SRT, teminatl\u0131 tahviller) konusunda \xF6nemli piyasa ve d\xFCzenleyici perspektifler sunmaktad\u0131r.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, AB ve ABD'deki menkul k\u0131ymetle\u015Ftirme piyasalar\u0131n\u0131, \xF6zellikle sentetik risk transferi (SRT) ve teminatl\u0131 tahvillerin sermaye y\xF6netimi ve fonlama \xFCzerindeki etkileri ba\u011Flam\u0131nda kar\u015F\u0131la\u015Ft\u0131rmal\u0131 olarak incelemektedir.",yayin_tarihi:"2026-11-19",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"745e72006c64081e"}],alt_konular:["Menkul k\u0131ymetle\u015Ftirme","Sentetik Risk Transferi (SRT)","Teminatl\u0131 Tahviller","Sermaye Optimizasyonu"],etkilenen_alanlar:["Kredi riski","Sermaye y\xF6netimi","Fonlama stratejileri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Bu rapor, AB ve ABD menkul k\u0131ymetle\u015Ftirme piyasalar\u0131 aras\u0131ndaki farklar\u0131 incelemekte ve AB piyasas\u0131n\u0131n san\u0131lan\u0131n aksine daha az geli\u015Fmi\u015F olmad\u0131\u011F\u0131n\u0131, sadece farkl\u0131 ara\xE7lara (teminatl\u0131 tahviller ve sentetik SRT) odakland\u0131\u011F\u0131n\u0131 savunmaktad\u0131r. Kamu bankalar\u0131 i\xE7in sentetik SRT i\u015Flemlerinin sermaye verimlili\u011Fi ve kredi kapasitesini koruma konusundaki stratejik \xF6nemi vurgulanmaktad\u0131r. Rapor, AB'deki fonlama ekosisteminin \xE7e\u015Fitlili\u011Finin, ABD'nin ajans destekli modeline k\u0131yasla farkl\u0131 bir dayan\u0131kl\u0131l\u0131k sa\u011Flad\u0131\u011F\u0131n\u0131 ortaya koymaktad\u0131r.",amac:{teyitli:[{hukum:"AB ve ABD menkul k\u0131ymetle\u015Ftirme piyasalar\u0131 aras\u0131ndaki farklar\u0131n metodolojik ve yap\u0131sal tan\u0131mlamalardan kaynakland\u0131\u011F\u0131 belirtilmektedir.",alinti:"We conclude that the apparent gap in terms of scale stems from methodological and structural differences in how securitisation is defined and measured across jurisdictions",sayfa:3,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n sermaye optimizasyonu stratejilerinde sentetik SRT i\u015Flemlerinin pay\u0131n\u0131n art\u0131r\u0131lmas\u0131 g\xFCndeme gelebilir.","Teminatl\u0131 tahvil ihrac\u0131n\u0131n, fonlama maliyetlerini d\xFC\u015F\xFCrmek ve likidite y\xF6netimi i\xE7in daha etkin bir ara\xE7 olarak kullan\u0131lmas\u0131 de\u011Ferlendirilebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Sentetik SRT i\u015Flemlerinin, bankan\u0131n RWA (Risk A\u011F\u0131rl\u0131kl\u0131 Varl\u0131klar) y\xF6netimi \xFCzerindeki etkisi daha yak\u0131ndan izlenebilir.","Teminatl\u0131 tahvillerin LCR (Likidite Kar\u015F\u0131lama Oran\u0131) ve NSFR (Net \u0130stikrarl\u0131 Fonlama Oran\u0131) \xFCzerindeki avantajlar\u0131, bankan\u0131n fonlama planlamas\u0131nda daha fazla dikkate al\u0131nabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Sentetik SRT i\u015Flemlerinin yap\u0131lan 1n\u0131n %75 azalt\u0131lmas\u0131.",alinti:"t\xFCketicinin kendisinin, e\u015Finin veya 18 ya\u015F alt\u0131ndaki \xE7ocuklar\u0131n\u0131n malik oldu\u011Fu en az iki konutunun bulunmas\u0131 halinde y\xFCzde 75 azalt\u0131larak uygulanmas\u0131na",sayfa:1,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Konut kredisi taleplerinde azalma g\xF6r\xFClebilir.","M\xFC\u015Fterilerin tapu bilgilerinin do\u011Frulanmas\u0131 s\xFCre\xE7lerinde operasyonel y\xFCk artabilir.","Kredi risk a\u011F\u0131rl\u0131klar\u0131nda dolayl\u0131 bir de\u011Fi\u015Fim ya\u015Fanabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Daha \xF6nce uygulanan 29.01.2026 tarihli ve 11364 say\u0131l\u0131 Kurul Karar\u0131 ile belirlenen genel LTV oranlar\u0131, bu yeni k\u0131s\u0131tlama ile daha s\u0131k\u0131 hale getirilmi\u015Ftir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Kredi kulland\u0131r\u0131m ekranlar\u0131nda otomatik kontrol mekanizmas\u0131 kurulmas\u0131 gerekebilir.","Tapu ve MERN\u0130S verilerinin entegrasyonu ile konut sahipli\u011Fi sorgulama s\xFCre\xE7leri g\xFCncellenmelidir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Kredi ba\u015Fvuru formlar\u0131n\u0131n ve m\xFC\u015Fteri bilgilendirme s\xFCre\xE7lerinin g\xFCncellenmesi gerekecektir.","Hisseli tapu ve riskli yap\u0131 istisnalar\u0131n\u0131n manuel kontrol\xFC i\xE7in operasyonel bir s\xFCre\xE7 tan\u0131mlanmal\u0131d\u0131r."]},sermaye_rwa:{teyitli:[],olasi_etki:["Kredi hacmindeki azalma, RWA \xFCzerinde d\xFC\u015F\xFCr\xFCc\xFC bir etki yaratabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"Konut kredisi LTV k\u0131s\u0131tlamas\u0131",onceki:"Genel LTV oranlar\u0131 ge\xE7erliydi.",yeni:"\u0130kinci konut sahipli\u011Finde LTV oran\u0131 %75 azalt\u0131larak uygulanacakt\u0131r.",referans:"Sayfa 1"}],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Kredi k\u0131s\u0131tlamas\u0131 nedeniyle daha d\xFC\u015F\xFCk riskli m\xFC\u015Fteri profil ye piyasas\u0131 faaliyetleri \xFCzerindeki dolayl\u0131 etkiler izlenmelidir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, yapay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n ve pasif yat\u0131r\u0131m trendlerinin piyasa d\xF6ng\xFCselli\u011Fi ve \xF6zkaynak finansman\u0131 \xFCzerindeki finansal istikrar etkilerini de\u011Ferlendirmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"6467bf3615b350c8"}],alt_konular:["\xD6z sermaye ihrac\u0131","Pasif yat\u0131r\u0131m","Piyasa d\xF6ng\xFCselli\u011Fi"],etkilenen_alanlar:["Kredi riski","Piyasa riski","Hazine faaliyetleri"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB raporu, \xF6zellikle yapay zeka sekt\xF6r\xFCndeki b\xFCy\xFCk halka arzlar\u0131n (IPO) ve \xF6z sermaye ihra\xE7lar\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerini incelemektedir. Pasif yat\u0131r\u0131m\u0131n artan rol\xFC, hisse senedi talebini daha inelastik hale getirerek ihra\xE7 hacimlerini art\u0131rmaktad\u0131r. Bu durum, piyasa d\xF6ng\xFCselli\u011Fini g\xFC\xE7lendirebilir ve ekonomik gerileme d\xF6nemlerinde \xF6z sermaye finansman\u0131n\u0131n kurumas\u0131 riskini do\u011Furabilir. Bankam\u0131z\u0131n piyasa riskleri ve sermaye piyasas\u0131 stratejileri a\xE7\u0131s\u0131ndan bu e\u011Filimlerin izlenmesi \xF6nerilmektedir.",amac:{teyitli:[],olasi_etki:["Piyasa duyarl\u0131l\u0131\u011F\u0131ndaki de\u011Fi\u015Fimlerin, bankan\u0131n \xF6z sermaye piyasalar\u0131ndaki yat\u0131r\u0131m portf\xF6y\xFC \xFCzerinde oynakl\u0131\u011F\u0131 art\u0131rabilece\u011Fi de\u011Ferlendirilmektedir.","Pasif yat\u0131r\u0131m\u0131n artan etkisi nedeniyle, piyasa likiditesinin stres d\xF6nemlerinde beklenenden daha h\u0131zl\u0131 daralabilece\u011Fi \xF6ng\xF6r\xFClebilir.","B\xFCy\xFCk halka arzlar\u0131n ve genel olarak \xF6z sermaye ihrac\u0131n\u0131n finansal istikrar \xFCzerindeki etkilerinin de\u011Ferlendirilmesi. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Pasif yat\u0131r\u0131m\u0131n inelastik talebi, hisse senedi fiyatlar\u0131n\u0131n temel g\xF6stergelerden kopmas\u0131na ve fiyat ke\u015Ffi s\xFCre\xE7lerinin zay\u0131flamas\u0131na neden olabilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Halka arzlara kat\u0131l\u0131m veya bu piyasalardaki pozisyon y\xF6netimi s\xFCre\xE7lerinde, pasif yat\u0131r\u0131mc\u0131 ak\u0131\u015Flar\u0131n\u0131n piyasa \xFCzerindeki etkisinin daha yak\u0131ndan izlenmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan \xF6z sermaye pozisyonlar\u0131n\u0131n de\u011Ferlemesindeki oynakl\u0131k, sermaye yeterlilik rasyolar\u0131 \xFCzerinde k\u0131sa vadeli dalgalanmalara yol a\xE7abilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"\xD6z sermaye finansman\u0131n\u0131n d\xF6ng\xFCselli\u011Fi, ekonomik gerileme d\xF6nemlerinde firmalar\u0131n sermaye art\u0131rma kapasitesini etkileyerek dolayl\u0131 olarak kredi riskini art\u0131rabilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Dolayl\u0131",not:"Piyasa oynakl\u0131\u011F\u0131n\u0131n artmas\u0131, \xF6z sermaye bazl\u0131 varl\u0131klar\u0131n de\u011Ferlemesinde ve dolay\u0131s\u0131yla TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 hesaplamalar\u0131nda dolayl\u0131 etki yaratabilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-18",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Piyasa Duyarl\u0131l\u0131\u011F\u0131 ve \xD6z Sermaye \u0130hrac\u0131",aciklama:"\xD6z sermaye ihra\xE7lar\u0131ndaki d\xF6ng\xFCsel zirvelerin, piyasa d\xFCzeltmelerine \xF6nc\xFC bir g\xF6sterge olup olmad\u0131\u011F\u0131 Riski"],etkilenen_alanlar:["Risk Y\xF6netimi","Stratejik Planlama"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB'nin Kas\u0131m 2026 Finansal \u0130stikrar Raporu, yapay zeka de\u011Ferlemeleri, mali dengesizlikler ve jeoekonomik gerilimlerin finansal piyasalar \xFCzerindeki risklerini vurgulamaktad\u0131r. Bankac\u0131l\u0131k sekt\xF6r\xFC g\xFC\xE7l\xFC sermaye ve likidite ile diren\xE7li g\xF6r\xFClse de, piyasa oynakl\u0131\u011F\u0131 ve kredi kalitesindeki olas\u0131 bozulmalara kar\u015F\u0131 dikkatli olunmas\u0131 gerekti\u011Fi belirtilmektedir. Bankam\u0131z\u0131n bu makro riskleri stratejik planlama ve risk i\u015Ftah\u0131 s\xFCre\xE7lerine dahil etmesi \xF6nerilmektedir.",amac:{teyitli:[{hukum:"Finansal istikrar g\xF6r\xFCn\xFCm\xFC, yapay zeka de\u011Ferlemeleri, mali dengesizlikler ve jeoekonomik gerilimlerden kaynaklanan riskler taraf\u0131ndan \u015Fekillenmektedir.",alinti:"The outlook for euro area financial stability is being shaped by risks stemming from artificial intelligence (AI) valuations, fiscal imbalances and geoeconomic tensions",sayfa:null,paragraf:7,alinti_dogrulandi:!0}],olasi_etki:["Yapay zeka sekt\xF6r\xFCne y\xF6nelik kredi tahsislerinde piyasa de\u011Ferlemelerindeki ani de\u011Fi\u015Fimler nedeniyle kredi riski artabilir.","Mali dengesizlikler nedeniyle devlet tahvili portf\xF6y\xFCnde yeniden fiyatlama riskleri olu\u015Fabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Yapay zeka ile ilgili sekt\xF6rlere verilen kredilerin teminat de\u011Ferlemelerinde daha muhafazakar yakla\u015F\u0131mlar benimsenebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Stres testi senaryolar\u0131na jeoekonomik gerilimler ve enerji fiyat \u015Foklar\u0131 gibi de\u011Fi\u015Fkenler eklenebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan varl\u0131klar\u0131n yeniden fiyatlanmas\u0131, sermaye yet i, yapay zeka kaynakl\u0131 piyasa oynakl\u0131\u011F\u0131n\u0131 ve egemen bor\xE7 risklerini detayland\u0131rmaktad\u0131r. Kamu sermayeli bir banka i\xE7in bu risklerin kredi riski ve sermaye yeterlili\u011Fi \xFCzerindeki etkileri kritiktir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, yapay zeka kaynakl\u0131 riskler, kamu bor\xE7lulu\u011Fu ve jeopolitik gerilimlerin finansal istikrar \xFCzerindeki etkilerini analiz ederek bankac\u0131l\u0131k sekt\xF6r\xFC i\xE7in potansiyel kredi riski ve yay\u0131lma etkilerine dikkat \xE7ekmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"460c49a6c0cfdaaa"}],alt_konular:["Kredi riski","Piyasa riski","Operasyonel risk","Sermaye yeterlili\u011Fi"],etkilenen_alanlar:["Kredi riski","Hazine ve piyasa i\u015Flemleri","Operasyonel risk y\xF6netimi","Sermaye planlamas\u0131"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"ECB'nin Kas\u0131m 2026 Finansal \u0130stikrar Raporu, yapay zeka (AI) yat\u0131r\u0131mlar\u0131na dayal\u0131 piyasa de\u011Ferlemeleri, artan egemen bor\xE7 y\xFCk\xFC ve jeopolitik gerilimlerin finansal istikrar \xFCzerindeki bask\u0131lar\u0131n\u0131 vurgulamaktad\u0131r. Bankalar genel olarak diren\xE7li olsa da, AI ba\u011Flant\u0131l\u0131 varl\u0131klardaki olas\u0131 bir d\xFCzeltmenin banka-d\u0131\u015F\u0131 finansal kurulu\u015Flar \xFCzerinden bankalara s\u0131\xE7rama riski bulunmaktad\u0131r. Ayr\u0131ca, enerji arz\u0131 kesintileri ve y\xFCksek faiz ortam\u0131, kredi kalitesinde bozulma potansiyeli ta\u015F\u0131maktad\u0131r. Bankalar\u0131n sermaye ve likidite tamponlar\u0131n\u0131 korumalar\u0131, makro-ihtiyati politikalar\u0131n temel \xF6nceli\u011Fi olarak belirlenmi\u015Ftir.",amac:{teyitli:[],olasi_etki:["Bankan\u0131n kredi portf\xF6y\xFCnde enerji yo\u011Fun sekt\xF6rlere y\xF6nelik risklerin artmas\u0131 beklenebilir.","Yapay zeka teknolojilerine ba\u011F\u0131ml\u0131 firmalara verilen kredilerde teminat yap\u0131s\u0131n\u0131n zay\u0131fl\u0131\u011F\u0131 nedeniyle risk art\u0131\u015F\u0131 g\xF6r\xFClebilir.","Sovereign (egemen) bor\xE7 piyasalar\u0131ndaki oynakl\u0131k, bankan\u0131n elindeki devlet tahvili portf\xF6y\xFCn\xFCn de\u011Ferlemesini olumsuz etkileyebilir.","Rapor, sistemik risklerin fark\u0131ndal\u0131\u011F\u0131n\u0131 art\u0131rmay\u0131 ve finansal istikrar\u0131 te\u015Fvik etmeyi ama\xE7lamaktad\u0131r. (belgeden birebir do\u011Frulanamad\u0131)"]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["TFRS 9 kapsam\u0131nda beklenen kredi zarar\u0131 (ECL) modellerinde, jeopolitik riskler ve enerji fiyat \u015Foklar\u0131 nedeniyle ileriye d\xF6n\xFCk senaryolar\u0131n g\xFCncellenmesi gerekebilir.","Siber risklerin artmas\u0131, operasyonel risk sermaye hesaplamalar\u0131nda daha y\xFCksek stres testi senaryolar\u0131n\u0131 zorunlu k\u0131labilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["\xDC\xE7\xFCnc\xFC taraf ICT sa\u011Flay\u0131c\u0131lar\u0131na olan ba\u011F\u0131ml\u0131l\u0131\u011F\u0131n g\xF6zden ge\xE7irilmesi ve siber g\xFCvenlik protokollerinin s\u0131k\u0131la\u015Ft\u0131r\u0131lmas\u0131 gerekebilir.","Dijital bankac\u0131l\u0131k kanallar\u0131nda yapay zeka kullan\u0131m\u0131 nedeniyle artan siber sald\u0131r\u0131 risklerine kar\u015F\u0131 savunma mekanizmalar\u0131 g\xFC\xE7lendirilmelidir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Piyasa riskine maruz kalan varl\u0131klar\u0131n de\u011Ferlemesindeki oynakl\u0131k, RWA hesaplamalar\u0131nda art\u0131\u015Fa neden olabilir."]},iklim:{teyitli:[],olasi_etki:["A\u015F\u0131r\u0131 hava olaylar\u0131n\u0131n fiziksel riskleri, kredi portf\xF6y\xFCndeki tar\u0131m ve enerji sekt\xF6rlerini do\u011Frudan etkileyebilir."],ilgili_degil:!1},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Y\xF nin finansal istikrar \xFCzerindeki etkileri",url:"https://www.ecb.europa.eu//press/financial-stability-publications/fsr/special/html/ecb.fsrart202611_01~dd6e15a84a.en.html",belge_turu:"Rapor",statu:"Bilgi ama\xE7l\u0131",onem:"Y\xFCksek",onem_gerekcesi:"Yapay zeka (YZ) kullan\u0131m\u0131 bankac\u0131l\u0131k faaliyetlerinde operasyonel verimlili\u011Fi art\u0131r\u0131rken, yo\u011Funla\u015Fma riski ve \xFC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131 gibi finansal istikrar\u0131 tehdit edebilecek yeni riskler do\u011Furmaktad\u0131r.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Rapor, bankalar\u0131n yapay zeka kullan\u0131m\u0131n\u0131n operasyonel verimlilik sa\u011Flarken ayn\u0131 zamanda yo\u011Funla\u015Fma riski ve \xFC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131 gibi yeni finansal istikrar riskleri do\u011Furdu\u011Funu analiz etmektedir.",yayin_tarihi:"2026-11-18",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"d410d27176d38322"}],alt_konular:["Operasyonel risk","\xDC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131\u011F\u0131","Siber risk","Model riski"],etkilenen_alanlar:["Kredi riski","Operasyonel risk y\xF6netimi","Bilgi teknolojileri","Uyum"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Yapay zeka (YZ) kullan\u0131m\u0131 bankac\u0131l\u0131k sekt\xF6r\xFCnde h\u0131zla yayg\u0131nla\u015Fmakta olup, kredi skorlama ve doland\u0131r\u0131c\u0131l\u0131k tespiti gibi kritik alanlarda verimlilik sa\u011Flamaktad\u0131r. Ancak, s\u0131n\u0131rl\u0131 say\u0131da teknoloji sa\u011Flay\u0131c\u0131s\u0131na olan ba\u011F\u0131ml\u0131l\u0131k, operasyonel riskleri ve sistemik k\u0131r\u0131lganl\u0131klar\u0131 art\u0131rmaktad\u0131r. Bankalar\u0131n, YZ modellerinin g\xFCvenilirli\u011Fi, a\xE7\u0131klanabilirli\u011Fi ve \xFC\xE7\xFCnc\xFC taraf risk y\xF6netimi Taraf Risk Y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"Yapay zeka (YZ) teknolojilerindeki h\u0131zl\u0131 ilerleme, siber tehdit ortam\u0131n\u0131 k\xF6kten de\u011Fi\u015Ftirerek sald\u0131rganlar\u0131n yeteneklerini art\u0131rmaktad\u0131r. Bankalar, YZ destekli sald\u0131r\u0131lar\u0131n h\u0131z\u0131 ve sofistike yap\u0131s\u0131 kar\u015F\u0131s\u0131nda yap\u0131sal bir dezavantajla kar\u015F\u0131 kar\u015F\u0131yad\u0131r. Kamu bankas\u0131 olarak, \xFC\xE7\xFCnc\xFC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131 ve YZ modellerine eri\u015Fimdeki asimetriler, sistemik riskleri art\u0131rmaktad\u0131r. Bankan\u0131n siber savunma stratejilerini, 'varsay\u0131lan ihlal' (assumed compromise) prensibiyle yeniden g\xF6zden ge\xE7irmesi ve operasyonel dayan\u0131kl\u0131l\u0131\u011F\u0131 art\u0131rmas\u0131 gerekmektedir.",amac:{teyitli:[{hukum:"Yapay zeka modellerinin siber yeteneklerinin h\u0131zla geli\u015Fmesi, siber risklerin artmas\u0131na katk\u0131da bulunmaktad\u0131r.",alinti:"Rapid advances in the cyber capabilities of AI models are contributing to heightened cyber risks.",sayfa:null,paragraf:100,alinti_dogrulandi:!0}],olasi_etki:["YZ destekli sald\u0131r\u0131lar\u0131n artmas\u0131, bankan\u0131n mevcut siber g\xFCvenlik b\xFCt\xE7esinin ve personel kapasitesinin yetersiz kalmas\u0131na yol a\xE7abilir.","\xDC\xE7\xFCnc\xFC taraf hizmet sa\u011Flay\u0131c\u0131lar\u0131na olan yo\u011Fun ba\u011F\u0131ml\u0131l\u0131k, tek bir noktadan kaynaklanan sistemik bir kesintiye neden olabilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"genel_bilgi"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n kulland\u0131\u011F\u0131 YZ modellerinin 'prompt injection' gibi yeni sald\u0131r\u0131 t\xFCrlerine kar\u015F\u0131 savunmas\u0131z kalmas\u0131 muhtemeldir.","Yama y\xF6netimi (patch management) s\xFCre\xE7lerinin, YZ destekli h\u0131zl\u0131 sald\u0131r\u0131lar kar\u015 iye/",belge_turu:"Rapor",statu:"Nihai",onem:"Y\xFCksek",onem_gerekcesi:"FSB'nin T\xFCrkiye'ye y\xF6nelik kripto varl\u0131k ve stablecoin d\xFCzenlemelerine ili\u015Fkin kritik tavsiyeleri, bankalar\u0131n bu varl\u0131klarla olan etkile\u015Fimlerini ve risk y\xF6netimini do\u011Frudan etkilemektedir.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"Finansal \u0130stikrar Kurulu (FSB), T\xFCrkiye'nin kripto varl\u0131k piyasalar\u0131na ili\u015Fkin d\xFCzenleyici \xE7er\xE7evesini de\u011Ferlendirerek, finansal istikrar\u0131n izlenmesi, stabil kripto varl\u0131klar i\xE7in \xF6zel bir rejim olu\u015Fturulmas\u0131 ve denetimlerin g\xFC\xE7lendirilmesi y\xF6n\xFCnde tavsiyelerde bulunmaktad\u0131r.",yayin_tarihi:"2026-11-11",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"3926a6801e624439"}],alt_konular:["Kripto varl\u0131klar","Stablecoin","Finansal istikrar izleme","Kredi riski"],etkilenen_alanlar:["Kredi riski","Raporlama","Uyum","Hazine ve risk y\xF6netimi"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"FSB, T\xFCrkiye'nin kripto varl\u0131k d\xFCzenlemelerinde kaydetti\u011Fi ilerlemeyi olumlu bulmakla birlikte, stablecoinler i\xE7in \xF6zel bir rejim kurulmas\u0131n\u0131 ve finansal istikrar izleme \xE7er\xE7evesinin g\xFC\xE7lendirilmesini \xF6nermektedir. Bankalar\u0131n kripto varl\u0131k maruziyetlerinin prudansiyel \xE7er\xE7evede daha etkin ele al\u0131nmas\u0131 ve BCBS standartlar\u0131yla uyumun de\u011Ferlendirilmesi kritik bir beklentidir. Bankam\u0131z\u0131n, i\u015Ftirakleri \xFCzerinden y\xFCr\xFCtt\xFC\u011F\xFC kripto faaliyetlerinde operasyonel ve finansal riskleri daha sistematik izlemesi gerekmektedir.",amac:{teyitli:[{hukum:"T\xFCrkiye'nin kripto varl\u0131k faaliyetlerinin d\xFCzenlenmesi ve denetlenmesine ili\u015Fkin FSB tavsiyelerini uygulama ilerlemesinin incelenmesi.",alinti:"The FC taraf ba\u011F\u0131ml\u0131l\u0131klar\u0131","T\xFCketici koruma","AML/CFT uyumu"],etkilenen_alanlar:["Kredi riski","Operasyonel risk","Uyum (Compliance)","T\xFCketici haklar\u0131"],gorus_son_tarihi:null,yururluk_tarihi:null,uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, beyaz etiketli finansal \xFCr\xFCnlerin da\u011F\u0131t\u0131m modeline ili\u015Fkin bir bilgilendirme notu ve kapsaml\u0131 bir rapor yay\u0131mlam\u0131\u015Ft\u0131r. Bu model, bankalar\u0131n \xFCr\xFCnlerini \xFC\xE7\xFCnc\xFC taraf markalar \xFCzerinden sunmas\u0131n\u0131 i\xE7erir ve operasyonel, uyum ve itibar riskleri ta\u015F\u0131r. Bankan\u0131n, bu t\xFCr i\u015F birliklerinde sorumluluk payla\u015F\u0131m\u0131n\u0131, m\xFC\u015Fteri \u015Feffafl\u0131\u011F\u0131n\u0131 ve AML/CFT s\xFCre\xE7lerini netle\u015Ftirmesi beklenmektedir. Rapor, \xF6zellikle \xE7apraz s\u0131n\u0131r faaliyetlerde ve dijital platformlarda risklerin artt\u0131\u011F\u0131na dikkat \xE7ekmektedir.",amac:{teyitli:[{hukum:"T\xFCketicilerin beyaz etiketli \xFCr\xFCnleri tan\u0131mlamas\u0131na yard\u0131mc\u0131 olmak.",alinti:"The European Banking Authority (EBA) published today a factsheet to help consumers identify when a banking or payment product or service is white labelled",sayfa:null,paragraf:4,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n mevcut beyaz etiketli \xFCr\xFCn s\xF6zle\u015Fmelerinin, EBA'n\u0131n vurgulad\u0131\u011F\u0131 \u015Feffafl\u0131k ve sorumluluk payla\u015F\u0131m\u0131 ilkeleriyle uyumlu olup olmad\u0131\u011F\u0131n\u0131n denetlenmesi gerekebilir.","T\xFCketici \u015Fikayet s\xFCre\xE7lerinin, beyaz etiketli \xFCr\xFCnler i\xE7in daha belirgin hale getirilmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["API entegrasyonlar\u0131 ve veri payla\u015F\u0131m s\xFCre\xE7lerinde, \xFC\xE7\xFCnc\xFC taraf ortaklarla olan teknik ba\u011F\u0131ml\u0131l\u0131klar\u0131n g\xF6zden ge\xE7irilmesi gerekebilir.","AML/CFT izleme sistemlerinin, beyaz etiketli ortakl\u0131klar \xFCzerinden gelen verileri kapsayacak \u015Fekilde g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Ortaklarla yap\u0131lan s\xF6zle\u015Fmelerde '\xE7\u0131k\u0131\u015F planlar\u0131n\u0131n' (exit plans) eksikli\u011Fi durumunda operasyonel s\xFCreklilik riski olu\u015Fabilir.","M\xFC\u015Fteri \u015Fikayetlerinin y\xF6netimi i\xE7in ortaklarla olan i\u015F ak\u0131\u015Flar\u0131n\u0131n yeniden tan\u0131mlanmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Step-in risklerinin (itibar veya operasyonel nedenlerle \xFC\xE7\xFCnc\xFC tarafa destek olma zorunlulu\u011Fu) sermaye yeterlili\u011Fi hesaplamalar\u0131nda dikkate al\u0131nmas\u0131 gerekebilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[],parametre_etkisi:{PD:{duzey:"Dolayl\u0131",not:"Ortaklar\u0131n m\xFC\u015Fteri edinme s\xFCre\xE7lerindeki zafiyetler, kredi portf\xF6y\xFCn\xFCn PD tahminlerini dolayl\u0131 olarak etkileyebilir."},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"D\xFC\u015F\xFCk",not:"Operasyonel risk kaynakl\u0131 kay\u0131plar\u0131n kar\u015F\u0131l\u0131k hesaplamalar\u0131na yans\u0131mas\u0131 gerekebilir."}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-09",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"S\xF6zle\u015Fme ve Sorumluluk Payla\u015F\u0131m\u0131",aciklama:"Beyaz etiketli ortakl\u0131k s\xF6zle\u015Fmelerinde sorumluluklar\u0131n (\xF6zellikle AML/CFT ve \u015Fikayet y\xF6netimi) netle\u015Ftirilmesi."},{baslik:"T\xFCketici \u015Eeffafl\u0131\u011F\u0131",aciklama:"M\xFC\u015Fterilerin \xFCr\xFCn\xFCn ger\xE7ek sa\u011Flay\u0131c\u0131s\u0131n\u0131 kolayca tan\u0131mlayabilmesi i\xE7in aray\xFCz ve bilgilendirme metinlerinin g\xF6zden ge\xE7irilmesi."}],referanslar:[{metin:"EBA REPORT ON WHITE LABELLING",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olus edilmi\u015Ftir. Bankam\u0131z\u0131n bu yeni \u015Fablonlara ve iklim risk mod\xFCl\xFCne uyum sa\u011Flamak i\xE7in i\xE7 veri sistemlerini g\xF6zden ge\xE7irmesi gerekecektir.",amac:{teyitli:[{hukum:"Stres testi \u015Fablonlar\u0131n\u0131n ve metodolojisinin basitle\u015Ftirilmesi, raporlama y\xFCk\xFCn\xFC azaltmay\u0131 ve veri kalitesini art\u0131rmay\u0131 ama\xE7lamaktad\u0131r.",alinti:"These changes will reduce operational burden and improve efficiency while preserving the robustness, risk-sensitivity and comparability of stress test results.",sayfa:null,paragraf:4,alinti_dogrulandi:!0}],olasi_etki:["Veri noktalar\u0131ndaki %55'lik azalma, bankan\u0131n stres testi haz\u0131rl\u0131k s\xFCre\xE7lerinde operasyonel verimlilik sa\u011Flayabilir.","\u0130klim riski mod\xFCl\xFCn\xFCn eklenmesi, bankan\u0131n iklim riskine y\xF6nelik veri toplama ve modelleme kapasitesini art\u0131rmas\u0131n\u0131 zorunlu k\u0131labilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["\xD6nceki stres testlerinde kullan\u0131lan daha karma\u015F\u0131k ve geni\u015F kapsaml\u0131 veri setleri, 2027 itibar\u0131yla yerini denetim raporlamas\u0131yla uyumlu daha sade bir yap\u0131ya b\u0131rakacakt\u0131r."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Bankan\u0131n mevcut stres testi veri toplama altyap\u0131s\u0131n\u0131n, yeni \u015Fablonlara ve denetim raporlama kavramlar\u0131na g\xF6re g\xFCncellenmesi gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Stres testi haz\u0131rl\u0131k s\xFCrecinde operasyonel y\xFCk\xFCn azalmas\u0131 beklenmektedir; ancak iklim riski mod\xFCl\xFC i\xE7in yeni veri giri\u015Fleri gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Stres testi sonu\xE7lar\u0131n\u0131n sermaye yeterlili\u011Fi \xFCzerindeki etkisi, yeni metodoloji ile daha \u015Feffaf ve kar\u015F\u0131la\u015Ft\u0131r\u0131labilir hale gelebilir."]},iklim:{teyitli:[{hukum:"2027 stres testi, fiziksel ve ge\xE7i\u015F iklim risklerini de\u011Ferlendiren \xF6zel bir mod\xFCl i\xE7erecektir.",alinti:"For the first time, physical and transition climate risks will be assessed through a dedicated module, without affecting the core stress test results.",sayfa:null,paragraf:7,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n iklim riskine maruziyetini \xF6l\xE7mek i\xE7in yeni veri toplama s\xFCre\xE7leri geli\u015Ftirmesi gerekebilir."],ilgili_degil:!1},degisiklikler:[{konu:"Stres testi veri gereksinimleri",onceki:"Daha y\xFCksek say\u0131da veri noktas\u0131 i\xE7eren karma\u015F\u0131k \u015Fablonlar.",yeni:"Veri noktalar\u0131nda %55 azalma ve denetim raporlamas\u0131yla daha yak\u0131n uyum.",referans:"Sayfa 1, P4"}],parametre_etkisi:{PD:{duzey:"Orta",not:"Kredi riski \u015Fablonlar\u0131n\u0131n denetim raporlamas\u0131yla uyumla\u015Ft\u0131r\u0131lmas\u0131, PD tahminlerinde kullan\u0131lan veri setlerini etkileyebilir."},LGD:{duzey:"Orta",not:"Kredi riski metodolojisindeki sadele\u015Fme, LGD hesaplamalar\u0131nda kullan\u0131lan veri giri\u015Flerini etkileyebilir."},EAD:{duzey:"Orta",not:"Raporlama \u015Fablonlar\u0131ndaki de\u011Fi\u015Fiklikler EAD hesaplamalar\u0131n\u0131 do\u011Frudan etkileyecektir."},ECL:{duzey:"Orta",not:"Stres testi sonu\xE7lar\u0131n\u0131n TFRS 9 beklentileriyle uyumu, metodolojik de\u011Fi\u015Fikliklerden etkilenecektir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 1, P4"},{tur:"Yay\u0131n",tarih:"2026-11-09",referans:"Sayfa 1, P3"}],gozden_gecirilecekler:[{baslik:"\u0130klim Riski Mod\xFCl\xFC",aciklama:"Fiziksel ve ge\xE7i\u015F risklerini de\u011Ferlendirmek i\xE7in gerekli veri altyap\u0131s\u0131n\u0131n kurulmas\u0131."},{baslik:"Stres Testi \u015Eablonlar\u0131",aciklama:"Yeni yay\u0131nlanan \u015Fablonlar\u0131n ve rehberli\u011Fin banka i\xE7i raporlama sistemlerine entegrasyonu."}],referanslar:[{metin:"2027 EU-wide stress test - Methodological Note",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zama on) raporlama s\xFCre\xE7lerini g\xFCncellemeleri gerekecektir. Kamu sermayeli bankalar i\xE7in bu, risk i\u015Ftah\u0131 \xE7er\xE7evesinin ve sermaye yeterlilik de\u011Ferlendirmelerinin (ICAAP) yeniden g\xF6zden ge\xE7irilmesi anlam\u0131na gelmektedir.",amac:{teyitli:[{hukum:"IRRBB \xE7er\xE7evesinin i\u015Flevselli\u011Fini art\u0131rmak i\xE7in bankalara ve denet\xE7ilere ek Pillar 2 rehberli\u011Fi sa\u011Flamak.",alinti:"The Committee is proposing additional practical Pillar 2 guidance for banks and supervisors to improve the functionality of the IRRBB framework",sayfa:4,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n IRRBB y\xF6netimi \xFCzerindeki denetim bask\u0131s\u0131n\u0131n artmas\u0131 olas\u0131d\u0131r.","Model risk y\xF6netimi ve do\u011Frulama s\xFCre\xE7lerinin daha s\u0131k\u0131 hale gelmesi gerekebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:["Mevcut SRP98 uygulama rehberli\u011Finin yerini yeni rehberli\u011Fin almas\u0131 beklenmektedir."],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Model do\u011Frulama ve backtesting s\xFCre\xE7lerinde daha s\u0131k\u0131 kontroller gerekebilir.","Yeni 'Denetim Bilgisi' raporlama gereksinimleri i\xE7in veri altyap\u0131s\u0131 g\xFCncellenebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Y\xF6netim kurulu ve \xFCst y\xF6netimin IRRBB raporlamalar\u0131na kat\u0131l\u0131m\u0131n\u0131n art\u0131r\u0131lmas\u0131 gerekebilir.","Stres testi senaryolar\u0131n\u0131n kapsam\u0131n\u0131n geni\u015Fletilmesi ve daha s\u0131k raporlanmas\u0131 gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Outlier (ayk\u0131r\u0131) banka olarak tan\u0131mlanan kurumlar i\xE7in ek sermaye gereksinimi do\u011Fabilir."]},iklim:{teyitli:[],olasi_etki:[],ilgili_degil:!0},degisiklikler:[{konu:"IRRBB Y\xF6netimi",onceki:"Mevcut SRP98 rehberli\u011Fi",yeni:"Yeni Pillar 2 rehberli\u011Fi ve SRP98'in MIR20'ye entegrasyonu",referans:"Sayfa 4"}],parametre_etkisi:{PD:{duzey:"Etki bekle i beklenmiyor",not:""},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Etki beklenmiyor",not:""}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2026-11-04",referans:"Sayfa 1"}],gozden_gecirilecekler:[],referanslar:[{metin:"BANKACILIK D\xDCZENLEME VE DENETLEME KURULU KARARI",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T16:29:19+03:00",gonderilen_karakter:534,alinti_dogrulanan:1,alinti_toplam:1,guven:"Orta",not:"Taranm\u0131\u015F PDF; metin OCR ile okundu, yaz\u0131m hatalar\u0131 olabilir."}},{id:"eba-2026-11-06-e815e0",kurum:"eba",baslik_orijinal:"The EBA outlines next steps on supervisory reporting simplification and extends implementation timelines following consultation feedback on the ITS",baslik_tr:"EBA, denetim raporlamas\u0131n\u0131n basitle\u015Ftirilmesine y\xF6nelik sonraki ad\u0131mlar\u0131 ana hatlar\u0131yla belirtiyor ve ITS'ye ili\u015Fkin isti\u015Fare geri bildirimlerinin ard\u0131ndan uygulama s\xFCrelerini uzat\u0131yor",url:"https://www.eba.europa.eu/publications-and-media/press-releases/eba-outlines-next-steps-supervisory-reporting-simplification-and-extends-implementation-timelines",belge_turu:"Bas\u0131n duyurusu",statu:"Nihai",onem:"Orta",onem_gerekcesi:"Kamu bankas\u0131 olarak TFRS 9 uygulamas\u0131 ve denetleyici raporlama y\xFCk\xFCml\xFCl\xFCkleri, IFRS 18 ge\xE7i\u015Fi ve EBA raporlama sadele\u015Ftirme paketinden do\u011Frudan etkilenmektedir.",konu:"TFRS 9",ozet_tek_satir:"EBA, denetim raporlama y\xFCk\xFCn\xFC azaltmak amac\u0131yla raporlama \u015Fablonlar\u0131n\u0131 basitle\u015Ftirmekte, IFRS 9 raporlamas\u0131n\u0131 entegre etmekte ve yeni gereklilikler i\xE7in uygulama s\xFCrelerini 2027-2028 y\u0131llar\u0131na ertelemektedir.",yayin_tarihi:"2026-11-06",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"bf3fc60e8c147c15"}],alt_konular:["FINREP","IFRS 18","Denetleyici Raporlama"],etkilenen_alanlar:["Raporlama","Muhasebe","Bilgi Teknolojileri"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-01",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, denetleyici raporlamay\u0131 sadele\u015Ftirme ve IFRS 18 ge\xE7i\u015F s\xFCrecini y\xF6netme amac\u0131yla raporlama takvimlerini g\xFCncellemi\u015Ftir. IFRS 18'in 1 Ocak 2027'de y\xFCr\xFCrl\xFC\u011Fe girmesiyle, denetleyici raporlama (FINREP) ile uyum sa\u011Flamak i\xE7in ge\xE7ici bir opsiyonel raporlama d\xF6nemi tan\u0131mlanm\u0131\u015Ft\u0131r. Bankam\u0131z\u0131n, IFRS 18 uyumlu FINREP \u015Fablonlar\u0131na ge\xE7i\u015F stratejisini belirlemesi ve yeni raporlama takvimine g\xF6re sistemlerini g\xFCncellemesi gerekmektedir.",amac:{teyitli:[{hukum:"IFRS 18'in finansal tablolara uygulanmas\u0131 ile denetleyici raporlama aras\u0131ndaki uyumsuzluklar\u0131n giderilmesi ve raporlama y\xFCk\xFCn\xFCn azalt\u0131lmas\u0131.",alinti:"This Opinion aims to contribute to the reduction of any potential burdens for relevant institutions, who would otherwise have to incur costs from the discrepancies",sayfa:3,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["IFRS 18'e ge\xE7i\u015F s\xFCrecinde d\u0131\u015F raporlama ile denetleyici raporlama aras\u0131nda olu\u015Fabilecek uyumsuzluklar, bankan\u0131n operasyonel maliyetlerini art\u0131rabilir.","Yeni raporlama \u015Fablonlar\u0131n\u0131n kullan\u0131m\u0131, bankan\u0131n veri ambar\u0131 ve raporlama yaz\u0131l\u0131mlar\u0131nda g\xFCncelleme gerektirebilir."]},onceki_cerceve:{teyitli:[],olasi_etki:[],karsilastirma_kaynagi:"arsiv"},teknik_etkiler:{teyitli:[],olasi_etki:["Yeni veri noktas\u0131 modeli (DPM) ve XBRL taksonomilerinin 2026 sonuna kadar sisteme entegre edilmesi gerekebilir.","IFRS 18 uyumlu FINREP \u015Fablonlar\u0131n\u0131n (F 02.01, F 16.01.1 vb.) test s\xFCre\xE7lerinin ba\u015Flat\u0131lmas\u0131 gerekebilir."]},operasyonel_etki:{teyitli:[],olasi_etki:["Bankan\u0131n IFRS 18 ge\xE7i\u015Fi i\xE7in opsiyonel raporlama y\xF6ntemini se\xE7ip se\xE7meyece\u011Fine dair karar vermesi ve bunu yetkili otoriteye bildirmesi gerekebilir."]},sermaye_rwa:{teyitli:[],olasi_etki:["Raporlama sadele\u015Ftirmeleri, dolayl\u0131 olarak raporlama maliyetlerinde azalma sa\u011Flayabilir."]},iklim:{teyitli:[],olasi_etki:["ESG raporlama gereksinimlerinin sadele\u015Ftirilmesi ve ertelenmesi, bankan\u0131n ESG veri toplama s\xFCre\xE7lerinde rahatlama sa\u011Flayabilir."],ilgili_degil:!1},degisiklikler:[{konu:"Raporlama Takvimi",onceki:"Mevcut raporlama takvimi",yeni:"Yeni gereksinimler i\xE7in ilk referans tarihi Aral\u0131k 2027, likidite ve ESG gibi alanlar Aral\u0131k 2028'e ertelenmi\u015Ftir.",referans:"Sayfa 2, P12"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir, kredi riski parametrelerini do\u011Frudan de\u011Fi\u015Ftirmez."},LGD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},EAD:{duzey:"Etki beklenmiyor",not:"D\xFCzenleme raporlama formatlar\u0131 ile ilgilidir."},ECL:{duzey:"D\xFC\u015F\xFCk",not:"IFRS 9 k\u0131yaslama raporlamas\u0131n\u0131n denetleyici \xE7er\xE7eveye entegrasyonu nedeniyle raporlama s\xFCre\xE7lerinde de\u011Fi\u015Fiklik olabilir."}},tarihler:[{tur:"Y\xFCr\xFCrl\xFCk",tarih:"2027-01-01",referans:"Sayfa 2, P4"},{tur:"Yay\u0131n",tarih:"2026-11-06",referans:"Sayfa 1, P3"}],gozden_gecirilecekler:[{baslik:"IFRS 18 Ge\xE7i\u015F Stratejisi",aciklama:"Bankan\u0131n IFRS 18'e ge\xE7i\u015Fte denetleyici raporlama i\xE7in sunulan opsiyonel \u015Fablonlar\u0131 kullan\u0131p kullanmayaca\u011F\u0131n\u0131n de\u011Ferlendirilmesi."},{baslik:"Raporlama Takvimi G\xFCncellemesi",aciklama:"Ertelenen raporlama alanlar\u0131n\u0131n (likidite, ESG vb.) yeni takvime g\xF6re planlanmas\u0131."}],referanslar:[{metin:"Opinion on the implementation of IFRS 18 \u2013 FINREP \u2013 Interim period",sayfa:1,paragraf:null}]},analiz_bilgisi fa 1"}],parametre_etkisi:{PD:{duzey:"Etki beklenmiyor",not:""},LGD:{duzey:"Etki beklenmiyor",not:""},EAD:{duzey:"Etki beklenmiyor",not:""},ECL:{duzey:"Etki beklenmiyor",not:""}},tarihler:[{tur:"Yay\u0131n",tarih:"2026-11-05",referans:"Sayfa 1"}],gozden_gecirilecekler:[{baslik:"Denetim S\xF6zle\u015Fmeleri",aciklama:"Mevcut s\xFCrd\xFCr\xFClebilirlik denetim s\xF6zle\u015Fmelerinin yeni esneklikler \xE7er\xE7evesinde g\xF6zden ge\xE7irilmesi."}],referanslar:[{metin:"S\xFCrd\xFCr\xFClebilirlik Denetim Ekiplerine Y\xF6nelik Muafiyet S\xFCresinin Uzat\u0131lmas\u0131",sayfa:1,paragraf:null}]},analiz_bilgisi:{model:"gemini-3.1-flash-lite",olusturma_zamani:"2026-11-26T16:31:44+03:00",gonderilen_karakter:1223,alinti_dogrulanan:1,alinti_toplam:1,guven:"Orta",not:"Taranm\u0131\u015F PDF; metin OCR ile okundu, yaz\u0131m hatalar\u0131 olabilir."}},{id:"eba-2026-11-05-c3f28b",kurum:"eba",baslik_orijinal:"The EBA publishes revised Guidelines on internal governance, delivering greater proportionality and simplification for banks",baslik_tr:"EBA, bankalar i\xE7in daha fazla orant\u0131l\u0131l\u0131k ve basitle\u015Ftirme sa\u011Flayan revize edilmi\u015F i\xE7 y\xF6neti\u015Fim rehberini yay\u0131nlad\u0131",url:"https://www.eba.europa.eu/publications-and-media/press-releases/eba-publishes-revised-guidelines-internal-governance-delivering-greater-proportionality-and",belge_turu:"Rehber",statu:"Nihai",onem:"Y\xFCksek",onem_gerekcesi:"D\xFCzenleme, bankan\u0131n i\xE7 y\xF6neti\u015Fim, risk y\xF6netimi ve kontrol \xE7er\xE7evesini do\u011Frudan etkileyen CRD VI uyumunu i\xE7ermektedir. Kamu sermayeli bir banka olarak, \xF6zellikle \xFC\xE7\xFCnc\xFC \xFClke \u015Fubeleri, ESG riskleri ve i\xE7 kontrol fonksiyonlar\u0131n\u0131n ba\u011F\u0131ms\u0131zl\u0131\u011F\u0131na ili\u015Fkin yeni gereklilikler kritik uyum s\xFCre\xE7leri do\u011Furmaktad\u0131r.",konu:"Risk Y\xF6netimi",ozet_tek_satir:"EBA, CRD VI direktifi ile uyumlu olarak bankalar\u0131n i\xE7 y\xF6neti\u015Fim d\xFCzenlemelerini, risk y\xF6netimi \xE7er\xE7evelerini ve kontrol mekanizmalar\u0131n\u0131 basitle\u015Ftiren ve orant\u0131l\u0131l\u0131k ilkesini g\xFC\xE7lendiren revize edilmi\u015F rehberini yay\u0131nlam\u0131\u015Ft\u0131r.",yayin_tarihi:"2026-11-05",tarih_kaynagi:"belge",tespit_zamani:"2026-11-26T00:57:45+03:00",baslangic_arsivi:!0,ilgili_mi:!0,surumler:[{no:1,tespit_zamani:"2026-11-26T00:57:45+03:00",icerik_hash:"0d45551d060ecb4f"}],alt_konular:["\u0130\xE7 Y\xF6neti\u015Fim","Risk K\xFClt\xFCr\xFC","\xDC\xE7\xFCnc\xFC \xDClke \u015Eubeleri","ESG Riskleri","\u0130\xE7 Kontrol \xC7er\xE7evesi"],etkilenen_alanlar:["Kurumsal Y\xF6netim","Risk Y\xF6netimi","\u0130\xE7 Denetim","Uyum (Compliance)","\u0130nsan Kaynaklar\u0131"],gorus_son_tarihi:null,yururluk_tarihi:"2027-01-05",uyum_son_tarihi:null,analiz:{yonetici_ozeti:"EBA, CRD VI ile uyumlu hale getirilmi\u015F revize edilmi\u015F \u0130\xE7 Y\xF6neti\u015Fim K\u0131lavuzunu yay\u0131mlam\u0131\u015Ft\u0131r. Bu d\xFCzenleme, y\xF6netim organlar\u0131n\u0131n sorumluluklar\u0131n\u0131 netle\u015Ftirmekte, ESG risklerinin entegrasyonunu zorunlu k\u0131lmakta ve \xFC\xE7\xFCnc\xFC \xFClke \u015Fubeleri i\xE7in \xF6zel y\xF6neti\u015Fim \xE7er\xE7eveleri getirmektedir. Bankam\u0131z\u0131n mevcut i\xE7 y\xF6neti\u015Fim politikalar\u0131n\u0131, \xF6zellikle g\xF6rev tan\u0131mlar\u0131, \xE7\u0131kar \xE7at\u0131\u015Fmas\u0131 y\xF6netimi ve i\xE7 kontrol fonksiyonlar\u0131n\u0131n ba\u011F\u0131ms\u0131zl\u0131\u011F\u0131 a\xE7\u0131s\u0131ndan g\xF6zden ge\xE7irmesi gerekmektedir.",amac:{teyitli:[{hukum:"Kurumlar\u0131n i\xE7 y\xF6neti\u015Fim d\xFCzenlemelerini, s\xFCre\xE7lerini ve mekanizmalar\u0131n\u0131 AB genelinde daha fazla uyumlu hale getirmek.",alinti:"To further harmonise institutions\u2019 internal governance arrangements, processes and mechanisms within the Union, the European Banking Authority (EBA) is mandated",sayfa:4,paragraf:null,alinti_dogrulandi:!0}],olasi_etki:["Bankan\u0131n mevcut i\
